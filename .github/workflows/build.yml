      - name: Yaz app/src/main/java/com/novax/assistant/ScreenOps.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/ScreenOps.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.graphics.Rect
          import android.os.SystemClock
          import org.json.JSONArray
          import org.json.JSONObject

          /** Hızlı ekran yönetimi: olay tabanlı bekleme, numaralı ekran listesi, kaydırarak arama ve toplu eylem. */
          object ScreenOps {
              const val NEED = "HATA: Erişilebilirlik servisi kapalı. Ayarlar > Erişilebilirlik > Novax'ı aç."

              class Item(val rect: Rect, val label: String, val clickable: Boolean, val editable: Boolean)

              private var cache: List<Item> = emptyList()

              private fun svc(): NovaxAccessibilityService? = NovaxAccessibilityService.instance

              /** Hızlı mod açıkken beklemeler yarıya iner. */
              fun nap(ms: Long) {
                  val f = if (Prefs.fastMode) 0.5 else 1.0
                  try {
                      Thread.sleep((ms * f).toLong())
                  } catch (_: InterruptedException) {
                  }
              }

              /** Ekran olayları durulana kadar (en çok maxMs) bekler. */
              fun idle(maxMs: Long = 1500L, quietMs: Long = 140L): Boolean {
                  val end = SystemClock.uptimeMillis() + maxMs
                  while (SystemClock.uptimeMillis() < end) {
                      val since = SystemClock.uptimeMillis() - NovaxAccessibilityService.lastEventAt
                      if (since >= quietMs) return true
                      try {
                          Thread.sleep(25)
                      } catch (_: InterruptedException) {
                      }
                  }
                  return false
              }

              fun exists(text: String, exact: Boolean): Boolean {
                  val s = svc() ?: return false
                  return s.findAll(text, exact).isNotEmpty()
              }

              /** Numaralı, kısa ekran listesi; tap_index ile kullanılır. */
              fun readIndexed(max: Int = 90): String {
                  val s = svc() ?: return NEED
                  val items = ArrayList<Item>()
                  val sb = StringBuilder()
                  sb.append("Uygulama: ").append(s.activePackage())
                  sb.append(if (KeyboardOps.isOpen()) " | Klavye: açık\n" else " | Klavye: kapalı\n")
                  for (r in s.appRoots()) {
                      s.walkTree(r, 0) { n, _ ->
                          if (items.size < max && n.isVisibleToUser) {
                              val t = (n.text?.toString() ?: "").replace("\n", " ").trim()
                              val d = (n.contentDescription?.toString() ?: "").replace("\n", " ").trim()
                              val hint = (n.hintText?.toString() ?: "").replace("\n", " ").trim()
                              val label = if (t.isNotEmpty()) t else if (d.isNotEmpty()) d else hint
                              val useful = label.isNotEmpty() || n.isClickable || n.isEditable
                              if (useful) {
                                  val rect = Rect()
                                  n.getBoundsInScreen(rect)
                                  if (!rect.isEmpty && !(label.isEmpty() && n.childCount > 0)) {
                                      val i = items.size
                                      items.add(Item(rect, label, n.isClickable, n.isEditable))
                                      sb.append('[').append(i).append("] ")
                                      sb.append(n.className?.toString()?.substringAfterLast('.') ?: "View")
                                      if (label.isNotEmpty()) sb.append(" \"").append(Text.clip(label, 70)).append('"')
                                      if (n.isEditable) sb.append(" [yazılabilir]")
                                      if (n.isClickable) sb.append(" [tıklanır]")
                                      if (n.isScrollable) sb.append(" [kaydırılır]")
                                      if (n.isChecked) sb.append(" [seçili]")
                                      sb.append(" @").append(rect.centerX()).append(',').append(rect.centerY()).append('\n')
                                  }
                              }
                          }
                          items.size < max
                      }
                  }
                  cache = items
                  if (items.isEmpty()) sb.append("(okunabilir öğe yok; ekran_describe dene)\n")
                  return sb.toString()
              }

              fun tapIndex(i: Int): String {
                  val s = svc() ?: return NEED
                  if (i < 0 || i >= cache.size) return "HATA: [" + i + "] yok. Önce screen_read çağır."
                  val item = cache[i]
                  val ok = s.tap(item.rect.exactCenterX(), item.rect.exactCenterY(), 40L)
                  idle(700L)
                  return if (ok) "Dokundum [" + i + "] " + Text.clip(item.label, 40) else "HATA: dokunma başarısız"
              }

              fun tapText(text: String, exact: Boolean, scrollTries: Int): String {
                  val s = svc() ?: return NEED
                  var tries = 0
                  while (true) {
                      val n = s.findAll(text, exact).firstOrNull()
                      if (n != null) {
                          val ok = s.clickNode(n)
                          idle(600L)
                          return if (ok) "Dokundum: " + text else "HATA: '" + text + "' bulundu ama tıklanamadı"
                      }
                      if (tries >= scrollTries) break
                      s.scroll("down")
                      idle(700L)
                      tries++
                  }
                  return "HATA: ekranda '" + text + "' bulunamadı"
              }

              fun scrollFind(text: String, direction: String, max: Int): String {
                  val s = svc() ?: return NEED
                  var tries = 0
                  while (tries <= max) {
                      if (s.findAll(text, false).isNotEmpty()) return "Bulundu: " + text
                      s.scroll(direction)
                      idle(700L)
                      tries++
                  }
                  return "HATA: '" + text + "' kaydırarak bulunamadı"
              }

              fun longPressText(text: String, ms: Long): String {
                  val s = svc() ?: return NEED
                  val n = s.findAll(text, false).firstOrNull() ?: return "HATA: ekranda '" + text + "' bulunamadı"
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  val ok = s.longPress(r.exactCenterX(), r.exactCenterY(), ms)
                  idle(600L)
                  return if (ok) "Uzun bastım: " + text else "HATA: uzun basma başarısız"
              }

              fun pressKey(k: String): String {
                  val s = svc() ?: return NEED
                  val key = k.lowercase().trim()
                  if (key == "enter" || key == "gonder" || key == "ara") {
                      return if (s.pressEnter()) "Enter'a bastım" else "HATA: enter uygulanamadı"
                  }
                  return if (s.global(key)) "Bastım: " + key else "HATA: tuş çalışmadı (" + key + ")"
              }

              fun typeSet(text: String, append: Boolean, enter: Boolean): String {
                  val s = svc() ?: return NEED
                  if (!s.typeText(text, append)) return "HATA: yazılabilir alan bulunamadı. Önce alana dokun."
                  if (enter) {
                      nap(250L)
                      s.pressEnter()
                  }
                  return "Yazdım" + (if (enter) " ve Enter'a bastım" else "")
              }

              /** JSON dizisi olarak verilen eylemleri sırayla, bekleme olmadan çalıştırır; ilk hatada durur. */
              fun batch(json: String): String {
                  val arr: JSONArray = try {
                      JSONArray(json)
                  } catch (e: Exception) {
                      return "HATA: actions geçerli bir JSON dizisi olmalı: " + e.message
                  }
                  val sb = StringBuilder()
                  for (i in 0 until arr.length()) {
                      val o: JSONObject = arr.optJSONObject(i) ?: continue
                      val a = o.optString("a", "").lowercase()
                      val t = o.optString("t", "")
                      val res: String = when (a) {
                          "tap" -> tapText(t, o.optBoolean("exact", false), o.optInt("scroll", 0))
                          "idx" -> tapIndex(o.optInt("i", -1))
                          "tapxy" -> {
                              val s = svc()
                              if (s == null) NEED else if (s.tap(o.optDouble("x").toFloat(), o.optDouble("y").toFloat(), 40L)) "Dokundum" else "HATA: dokunma başarısız"
                          }
                          "type" -> typeSet(t, o.optBoolean("append", false), o.optBoolean("enter", false))
                          "kb" -> KeyboardOps.type(t, o.optBoolean("enter", false))
                          "key" -> pressKey(o.optString("k", ""))
                          "back", "home", "recents" -> pressKey(a)
                          "wait" -> {
                              nap(o.optLong("ms", 500L).coerceIn(0L, 10000L))
                              "bekledim"
                          }
                          "idle" -> if (idle(o.optLong("ms", 1500L).coerceIn(100L, 8000L))) "durdu" else "durmadı"
                          "expect" -> {
                              val s = svc()
                              if (s == null) NEED else if (s.waitForText(t, o.optLong("ms", 6000L).coerceIn(500L, 30000L))) "Göründü: " + t else "HATA: '" + t + "' görünmedi"
                          }
                          "swipe" -> {
                              val s = svc()
                              if (s == null) NEED else if (s.scroll(o.optString("d", "down"))) "Kaydırdım" else "HATA: kaydırılamadı"
                          }
                          "scroll_find" -> scrollFind(t, o.optString("d", "down"), o.optInt("max", 6))
                          "long" -> longPressText(t, o.optLong("ms", 700L))
                          "open" -> Act.openApp(o.optString("app", t))
                          else -> "HATA: bilinmeyen eylem '" + a + "'"
                      }
                      sb.append(i + 1).append(". ").append(a).append(' ').append(Text.clip(t, 30)).append(": ").append(res).append('\n')
                      if (res.startsWith("HATA")) {
                          sb.append("(durdu)")
                          break
                      }
                  }
                  return sb.toString().trim()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/ScreenshotOps.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/ScreenshotOps.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.ContentValues
          import android.graphics.Bitmap
          import android.os.Build
          import android.provider.MediaStore
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Ekran görüntüsü: önce erişilebilirlik takeScreenshot (Android 11+), sık çağrılırsa tekrar dener,
           * olmazsa sistem kısayolunu kullanır. Sonucu galeriye (Pictures/Novax) ve önbelleğe kaydeder.
           */
          object ScreenshotOps {
              fun errorText(code: Int): String {
                  return when (code) {
                      1 -> "iç hata"
                      2 -> "erişilebilirlik izni eksik (servisi kapatıp yeniden aç)"
                      3 -> "çok sık denendi"
                      4 -> "geçersiz ekran"
                      5 -> "geçersiz pencere"
                      6 -> "güvenli pencere (banka/şifre ekranları ekran görüntüsüne izin vermez)"
                      -100 -> "Android 11 altında bu yöntem yok"
                      else -> "kod " + code
                  }
              }

              /** Ham bitmap alır (yeniden deneme dahil). Hata kodu döner. */
              fun grab(): NovaxAccessibilityService.ShotResult {
                  val s = NovaxAccessibilityService.instance ?: return NovaxAccessibilityService.ShotResult(null, 2)
                  var last = NovaxAccessibilityService.ShotResult(null, 0)
                  for (attempt in 0 until 3) {
                      last = s.takeScreenshotRaw()
                      if (last.bitmap != null) return last
                      if (last.error == 3) {
                          try {
                              Thread.sleep(1300)
                          } catch (_: InterruptedException) {
                          }
                      } else {
                          break
                      }
                  }
                  return last
              }

              fun cacheFile(): File = File(NovaxApp.instance.cacheDir, "last_shot.png")

              fun capture(): String {
                  val s = NovaxAccessibilityService.instance ?: return "HATA: Erişilebilirlik servisi kapalı."
                  var err = 0
                  if (Build.VERSION.SDK_INT >= 30) {
                      val r = grab()
                      val b = r.bitmap
                      if (b != null) return save(b)
                      err = r.error
                  }
                  if (Build.VERSION.SDK_INT >= 28) {
                      val ok = s.global("screenshot")
                      if (ok) {
                          try {
                              Thread.sleep(1800)
                          } catch (_: InterruptedException) {
                          }
                          val f = newestScreenshotPath()
                          return if (f != null) "Ekran görüntüsü alındı (sistem kısayolu): " + f else "Ekran görüntüsü alındı (sistem kısayolu); galeride Screenshots klasöründe."
                      }
                  }
                  return "HATA: Ekran görüntüsü alınamadı: " + errorText(err)
              }

              private fun save(b: Bitmap): String {
                  val ctx = NovaxApp.instance
                  try {
                      val f = cacheFile()
                      f.outputStream().use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  } catch (e: Exception) {
                      AppLog.e("shot", "önbelleğe yazılamadı", e)
                  }
                  val name = "novax_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".png"
                  if (Build.VERSION.SDK_INT >= 29) {
                      try {
                          val cv = ContentValues()
                          cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                          cv.put(MediaStore.MediaColumns.MIME_TYPE, "image/png")
                          cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Novax")
                          cv.put(MediaStore.MediaColumns.IS_PENDING, 1)
                          val resolver = ctx.contentResolver
                          val uri = resolver.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv)
                          if (uri != null) {
                              val os = resolver.openOutputStream(uri)
                              if (os != null) {
                                  os.use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                              }
                              val done = ContentValues()
                              done.put(MediaStore.MediaColumns.IS_PENDING, 0)
                              resolver.update(uri, done, null, null)
                              return "Ekran görüntüsü kaydedildi: Pictures/Novax/" + name + " (" + b.width + "x" + b.height + ")"
                          }
                      } catch (e: Exception) {
                          AppLog.e("shot", "MediaStore kaydı başarısız", e)
                      }
                  }
                  val dir = ctx.getExternalFilesDir("screenshots") ?: ctx.filesDir
                  dir.mkdirs()
                  val f = File(dir, name)
                  f.outputStream().use { b.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  return "Ekran görüntüsü kaydedildi: " + f.absolutePath
              }

              private fun newestScreenshotPath(): String? {
                  return try {
                      val cr = NovaxApp.instance.contentResolver
                      val cols = arrayOf(MediaStore.MediaColumns.DISPLAY_NAME, MediaStore.MediaColumns.DATE_ADDED)
                      val c = cr.query(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cols,
                          MediaStore.MediaColumns.DISPLAY_NAME + " LIKE ?", arrayOf("%Screenshot%"),
                          MediaStore.MediaColumns.DATE_ADDED + " DESC"
                      )
                      var out: String? = null
                      if (c != null) {
                          try {
                              if (c.moveToFirst()) out = c.getString(0)
                          } finally {
                              c.close()
                          }
                      }
                      out
                  } catch (_: Exception) {
                      null
                  }
              }

              /** Model için JPEG base64 (uzun kenar maxSide). */
              fun jpegBase64(maxSide: Int): String? {
                  val r = grab()
                  val b = r.bitmap ?: return null
                  val scale = maxSide.toFloat() / maxOf(b.width, b.height)
                  val s = if (scale < 1f) Bitmap.createScaledBitmap(b, (b.width * scale).toInt(), (b.height * scale).toInt(), true) else b
                  val bos = ByteArrayOutputStream()
                  s.compress(Bitmap.CompressFormat.JPEG, 72, bos)
                  return android.util.Base64.encodeToString(bos.toByteArray(), android.util.Base64.NO_WRAP)
              }
          }
          NOVAX_EOF

