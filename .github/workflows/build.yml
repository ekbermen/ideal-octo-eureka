      - name: Yaz app/src/main/java/com/novax/assistant/NovaxService.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/NovaxService.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Notification
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager

          /** Her zaman açık çalışan gerçek foreground service: mikrofon türünde, uyandırma kelimesini dinler. */
          class NovaxService : Service(), Bus.Listener {

              companion object {
                  const val ACTION_START = "com.novax.assistant.START"
                  const val ACTION_LISTEN = "com.novax.assistant.LISTEN"
                  const val ACTION_STOP = "com.novax.assistant.STOP"
                  const val NOTIF_ID = 1001
                  @Volatile var running = false

                  fun start(ctx: Context) {
                      ctx.startForegroundService(Intent(ctx, NovaxService::class.java).setAction(ACTION_START))
                  }

                  fun stop(ctx: Context) {
                      ctx.stopService(Intent(ctx, NovaxService::class.java))
                  }
              }

              private var wake: PowerManager.WakeLock? = null
              private var lastText = ""

              override fun onBind(intent: Intent?): IBinder? = null

              private fun wakeHint(): String = "\"" + Prefs.wakeWord.replaceFirstChar { it.uppercase() } + "\" de, dinliyorum"

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (!goForeground(wakeHint())) {
                      Bus.log("Foreground servis başlatılamadı (mikrofon izni?)")
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  running = true
                  Voice.init(this)
                  Bus.add(this)
                  if (wake == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "novax:service")
                      wl.acquire(12 * 60 * 60 * 1000L)
                      wake = wl
                  }
                  if (intent?.action == ACTION_LISTEN) {
                      Voice.listenOnce()
                  } else if (Prefs.wakeOn && Voice.mode == Voice.Mode.OFF) {
                      Voice.startWake()
                  }
                  if (Prefs.overlayOn) Overlay.show(this)
                  return START_STICKY
              }

              private fun goForeground(text: String): Boolean {
                  return try {
                      val n = buildNotification(text)
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                      } else {
                          startForeground(NOTIF_ID, n)
                      }
                      lastText = text
                      true
                  } catch (e: Exception) {
                      Bus.log("startForeground: " + e.message)
                      false
                  }
              }

              private fun buildNotification(text: String): Notification {
                  val open = PendingIntent.getActivity(this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val listen = PendingIntent.getService(this, 1, Intent(this, NovaxService::class.java).setAction(ACTION_LISTEN), PendingIntent.FLAG_IMMUTABLE)
                  val stop = PendingIntent.getService(this, 2, Intent(this, NovaxService::class.java).setAction(ACTION_STOP), PendingIntent.FLAG_IMMUTABLE)
                  val ic = Icon.createWithResource(this, R.drawable.ic_notif)
                  return Notification.Builder(this, NovaxApp.CH_SERVICE)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("NOVAX aktif")
                      .setContentText(text)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(ic, "Dinle", listen).build())
                      .addAction(Notification.Action.Builder(ic, "Kapat", stop).build())
                      .build()
              }

              private fun updateText(text: String) {
                  if (text == lastText) return
                  lastText = text
                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify(NOTIF_ID, buildNotification(text))
              }

              override fun onState(s: OrbState) {
                  val t = when (s) {
                      OrbState.IDLE -> if (Prefs.wakeOn) wakeHint() else "Beklemede"
                      OrbState.LISTENING -> "Dinliyorum…"
                      OrbState.THINKING -> "Düşünüyorum…"
                      OrbState.SPEAKING -> "Konuşuyorum…"
                      OrbState.ERROR -> "Hata oluştu"
                  }
                  updateText(t)
              }

              override fun onDestroy() {
                  running = false
                  Bus.remove(this)
                  Voice.stopAll()
                  Overlay.hide()
                  try { wake?.release() } catch (_: Exception) {}
                  wake = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  super.onDestroy()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/NumberParser.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/NumberParser.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /** Türkçe sayı sözcüklerini rakama çevirir: "on beş" -> 15, "iki yüz" -> 200. */
          object NumberParser {
              private val units: Map<String, Int> = mapOf(
                  "sıfır" to 0, "sifir" to 0, "bir" to 1, "iki" to 2, "üç" to 3, "uc" to 3, "dört" to 4, "dort" to 4,
                  "beş" to 5, "bes" to 5, "altı" to 6, "alti" to 6, "yedi" to 7, "sekiz" to 8, "dokuz" to 9
              )
              private val tens: Map<String, Int> = mapOf(
                  "on" to 10, "yirmi" to 20, "otuz" to 30, "kırk" to 40, "kirk" to 40, "elli" to 50,
                  "altmış" to 60, "altmis" to 60, "yetmiş" to 70, "yetmis" to 70, "seksen" to 80, "doksan" to 90
              )

              private fun isNumWord(w: String): Boolean =
                  units.containsKey(w) || tens.containsKey(w) || w == "yüz" || w == "yuz" || w == "bin"

              private fun runValue(words: List<String>): Int {
                  var total = 0
                  var cur = 0
                  for (w in words) {
                      val u = units[w]
                      val t = tens[w]
                      if (u != null) {
                          cur += u
                      } else if (t != null) {
                          cur += t
                      } else if (w == "yüz" || w == "yuz") {
                          cur = if (cur == 0) 100 else cur * 100
                      } else if (w == "bin") {
                          total += (if (cur == 0) 1 else cur) * 1000
                          cur = 0
                      }
                  }
                  return total + cur
              }

              fun parse(text: String): Int? {
                  val words = text.lowercase().trim().split(Regex("\\s+")).filter { it.isNotEmpty() }
                  if (words.isEmpty()) return null
                  for (w in words) {
                      if (!isNumWord(w)) return null
                  }
                  return runValue(words)
              }

              /** Cümledeki sayı sözcük dizilerini rakamla değiştirir. */
              fun replaceWords(s: String): String {
                  val tokens = s.split(" ")
                  val out = ArrayList<String>()
                  var i = 0
                  while (i < tokens.size) {
                      val w = tokens[i].lowercase()
                      if (isNumWord(w)) {
                          val run = ArrayList<String>()
                          var j = i
                          while (j < tokens.size && isNumWord(tokens[j].lowercase())) {
                              run.add(tokens[j].lowercase())
                              j++
                          }
                          out.add(runValue(run).toString())
                          i = j
                      } else {
                          out.add(tokens[i])
                          i++
                      }
                  }
                  return out.joinToString(" ")
              }

              fun hasNumberWords(s: String): Boolean {
                  for (w in s.lowercase().split(" ")) {
                      if (isNumWord(w)) return true
                  }
                  return false
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/OpenAiClient.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/OpenAiClient.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import org.json.JSONArray
          import org.json.JSONObject

          /** OpenAI ve OpenAI uyumlu tüm şirketler (Groq, OpenRouter, xAI, DeepSeek, Mistral, Together, ...). */
          class OpenAiClient(private val p: Provider, private val key: String, val model: String) : LlmClient {
              override val label: String get() = p.company + " / " + model

              private fun userJson(m: LlmMsg): JSONObject {
                  var onlyText = true
                  for (x in m.parts) {
                      if (x.kind != LlmPart.TEXT) onlyText = false
                  }
                  if (onlyText) {
                      val sb = StringBuilder()
                      for (x in m.parts) {
                          if (sb.isNotEmpty()) sb.append("\n")
                          sb.append(x.text)
                      }
                      return JSONObject().put("role", "user").put("content", if (sb.isEmpty()) " " else sb.toString())
                  }
                  val arr = JSONArray()
                  for (x in m.parts) {
                      if (x.kind == LlmPart.TEXT) {
                          arr.put(JSONObject().put("type", "text").put("text", if (x.text.isEmpty()) " " else x.text))
                      } else if (x.kind == LlmPart.IMAGE) {
                          val url = "data:" + x.mime + ";base64," + x.b64
                          arr.put(JSONObject().put("type", "image_url").put("image_url", JSONObject().put("url", url)))
                      } else {
                          arr.put(JSONObject().put("type", "text").put("text", "[Bu sağlayıcı ses/video dosyalarını doğrudan alamıyor]"))
                      }
                  }
                  return JSONObject().put("role", "user").put("content", arr)
              }

              private fun assistantJson(m: LlmMsg): JSONObject {
                  val sb = StringBuilder()
                  for (x in m.parts) {
                      if (x.kind == LlmPart.TEXT) sb.append(x.text)
                  }
                  val o = JSONObject().put("role", "assistant").put("content", sb.toString())
                  if (m.calls.isNotEmpty()) {
                      val arr = JSONArray()
                      for (c in m.calls) {
                          val fn = JSONObject().put("name", c.name).put("arguments", c.args.toString())
                          arr.put(JSONObject().put("id", c.id).put("type", "function").put("function", fn))
                      }
                      o.put("tool_calls", arr)
                  }
                  return o
              }

              private fun toolDefs(tools: JSONArray): JSONArray {
                  val out = JSONArray()
                  for (i in 0 until tools.length()) {
                      val t = tools.getJSONObject(i)
                      var params = t.optJSONObject("parameters")
                      if (params == null) {
                          params = JSONObject().put("type", "object").put("properties", JSONObject())
                      }
                      val fn = JSONObject().put("name", t.getString("name")).put("description", t.optString("description", "")).put("parameters", params)
                      out.put(JSONObject().put("type", "function").put("function", fn))
                  }
                  return out
              }

              private fun errorText(r: Http.Resp): String {
                  if (r.code == -1) return "Ağ hatası: " + r.body
                  return try {
                      val e = JSONObject(r.body).opt("error")
                      val msg = if (e is JSONObject) e.optString("message", r.body) else e.toString()
                      p.company + " " + r.code + ": " + msg.take(300)
                  } catch (_: Exception) {
                      p.company + " " + r.code + ": " + r.body.take(300)
                  }
              }

              override fun chat(system: String, msgs: List<LlmMsg>, tools: JSONArray?): LlmReply {
                  val arr = JSONArray()
                  if (system.isNotBlank()) arr.put(JSONObject().put("role", "system").put("content", system))
                  for (m in msgs) {
                      if (m.role == LlmMsg.USER) {
                          arr.put(userJson(m))
                      } else if (m.role == LlmMsg.ASSISTANT) {
                          arr.put(assistantJson(m))
                      } else {
                          for (r in m.results) {
                              arr.put(JSONObject().put("role", "tool").put("tool_call_id", r.callId).put("content", r.content))
                          }
                      }
                  }
                  val body = JSONObject().put("model", model).put("messages", arr)
                  if (tools != null && tools.length() > 0) {
                      body.put("tools", toolDefs(tools))
                      body.put("tool_choice", "auto")
                  }
                  val r = Http.postJsonRetry(p.baseUrl + p.chatPath, Providers.authHeaders(p, key), body.toString())
                  if (!r.ok) throw LlmException(errorText(r), r.code)
                  val resp = JSONObject(r.body)
                  val choice = resp.optJSONArray("choices")?.optJSONObject(0)
                      ?: return LlmReply("Cevap alamadım.", emptyList(), null, "none")
                  val msg = choice.optJSONObject("message") ?: return LlmReply("", emptyList(), null, choice.optString("finish_reason", ""))
                  val text = if (msg.isNull("content")) "" else msg.optString("content", "")
                  val calls = ArrayList<LlmToolCall>()
                  val tc = msg.optJSONArray("tool_calls")
                  if (tc != null) {
                      for (i in 0 until tc.length()) {
                          val c = tc.optJSONObject(i) ?: continue
                          val fn = c.optJSONObject("function") ?: continue
                          var args = JSONObject()
                          try {
                              val s = fn.optString("arguments", "{}")
                              args = JSONObject(if (s.isBlank()) "{}" else s)
                          } catch (_: Exception) {
                          }
                          val id = c.optString("id", "call_" + i)
                          calls.add(LlmToolCall(id, fn.optString("name"), args))
                      }
                  }
                  return LlmReply(text.trim(), calls, null, choice.optString("finish_reason", ""))
              }

              /** Whisper uyumlu uçla ses çevirisi (OpenAI, Groq). Başarısızsa boş döner. */
              fun transcribe(bytes: ByteArray, fileName: String, mime: String): String {
                  val whisper = if (p.id == "groq") "whisper-large-v3-turbo" else "whisper-1"
                  val fields = HashMap<String, String>()
                  fields["model"] = whisper
                  fields["language"] = "tr"
                  val r = Http.postMultipart(p.baseUrl + "/audio/transcriptions", Providers.authHeaders(p, key), fields, "file", fileName, mime, bytes)
                  if (!r.ok) throw LlmException(errorText(r), r.code)
                  return try {
                      JSONObject(r.body).optString("text", "")
                  } catch (_: Exception) {
                      ""
                  }
              }

              fun canTranscribe(): Boolean = p.id == "openai" || p.id == "groq"
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Overlay.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Overlay.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager

          /** Her uygulamanın üstünde duran yüzen Jarvis reaktörü. Dokun: dinle · Uzun bas: uygulamayı aç · Sürükle: taşı. */
          object Overlay : Bus.Listener {
              private val main = Handler(Looper.getMainLooper())
              private var view: JarvisReactorView? = null
              private var wm: WindowManager? = null

              fun show(ctx: Context) {
                  main.post {
                      val app = ctx.applicationContext
                      if (view == null && Settings.canDrawOverlays(app)) {
                          val size = (84 * app.resources.displayMetrics.density).toInt()
                          val v = JarvisReactorView(app)
                          val w = app.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                          val p = WindowManager.LayoutParams(
                              size, size, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                          )
                          p.gravity = Gravity.TOP or Gravity.START
                          p.x = 16
                          p.y = 320
                          v.state = Bus.current
                          v.setOnTouchListener(DragListener(app, w, p))
                          try {
                              w.addView(v, p)
                              view = v
                              wm = w
                              Bus.add(this)
                          } catch (e: Exception) {
                              Bus.log("Overlay eklenemedi: " + e.message)
                          }
                      }
                  }
              }

              fun hide() {
                  main.post {
                      val v = view
                      if (v != null) {
                          try { wm?.removeView(v) } catch (_: Exception) {}
                          view = null
                          wm = null
                          Bus.remove(this)
                      }
                  }
              }

              private class DragListener(
                  val ctx: Context,
                  val w: WindowManager,
                  val p: WindowManager.LayoutParams
              ) : View.OnTouchListener {
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  var longFired = false
                  val longPress = Runnable {
                      longFired = true
                      ctx.startActivity(Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  }

                  override fun onTouch(v: View, e: MotionEvent): Boolean {
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX; sy = e.rawY; ox = p.x; oy = p.y
                              moved = false; longFired = false
                              main.postDelayed(longPress, 650L)
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - sx
                              val dy = e.rawY - sy
                              if (Math.abs(dx) > 12f || Math.abs(dy) > 12f) {
                                  moved = true
                                  main.removeCallbacks(longPress)
                              }
                              if (moved) {
                                  p.x = ox + dx.toInt()
                                  p.y = oy + dy.toInt()
                                  try { w.updateViewLayout(v, p) } catch (_: Exception) {}
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              main.removeCallbacks(longPress)
                              if (!moved && !longFired && e.actionMasked == MotionEvent.ACTION_UP) {
                                  if (Voice.speaking) Voice.stopSpeaking() else Voice.listenOnce()
                              }
                          }
                      }
                      return true
                  }
              }

              override fun onState(s: OrbState) { view?.state = s }
              override fun onLevel(v: Float) { view?.level = v }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Perms.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Perms.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.app.Activity
          import android.app.AlarmManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.PowerManager
          import android.provider.Settings

          /** Kurulum ekranındaki izin satırları: durum kontrolü + istek. */
          object Perms {
              class Item(
                  val title: String,
                  val why: String,
                  val critical: Boolean,
                  val ok: (Context) -> Boolean,
                  val ask: (Activity) -> Unit
              )

              const val REQ = 4411

              private fun rt(ctx: Context, p: String): Boolean = ctx.checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun runtimeAsk(a: Activity, perms: Array<String>) {
                  a.requestPermissions(perms, REQ)
              }

              fun accessibilityOn(ctx: Context): Boolean {
                  if (NovaxAccessibilityService.connected) return true
                  val s = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                  return s.contains(ctx.packageName + "/", true)
              }

              fun notifListenerOn(ctx: Context): Boolean {
                  val s = Settings.Secure.getString(ctx.contentResolver, "enabled_notification_listeners") ?: return false
                  return s.contains(ctx.packageName, true)
              }

              private fun mediaPerms(): Array<String> {
                  return if (Build.VERSION.SDK_INT >= 33) {
                      arrayOf(Manifest.permission.READ_MEDIA_IMAGES, Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }
              }

              private fun allFilesOk(): Boolean = Build.VERSION.SDK_INT < 30 || Environment.isExternalStorageManager()

              private fun simple(title: String, why: String, critical: Boolean, perm: String): Item =
                  Item(title, why, critical, { c -> rt(c, perm) }, { a -> runtimeAsk(a, arrayOf(perm)) })

              fun items(): List<Item> {
                  val list = ArrayList<Item>()
                  list.add(simple("Mikrofon", "Sesli komut, uyandırma kelimesi, canlı kamera, çağrı devri", true, Manifest.permission.RECORD_AUDIO))
                  list.add(simple("Kamera", "Canlı kamera sohbeti", false, Manifest.permission.CAMERA))
                  list.add(Item("Bildirimler", "Servis bildirimi ve görev sonuçları", false,
                      { c -> Build.VERSION.SDK_INT < 33 || rt(c, Manifest.permission.POST_NOTIFICATIONS) },
                      { a -> if (Build.VERSION.SDK_INT >= 33) runtimeAsk(a, arrayOf(Manifest.permission.POST_NOTIFICATIONS)) }))
                  list.add(simple("Rehber", "\"Anneme yaz\" gibi isimle komutlar", false, Manifest.permission.READ_CONTACTS))
                  list.add(simple("Telefon araması", "Kişiyi doğrudan arama", false, Manifest.permission.CALL_PHONE))
                  list.add(simple("Aramaları yanıtlama", "Telefon devri: gelen çağrıyı açma/kapatma", false, Manifest.permission.ANSWER_PHONE_CALLS))
                  list.add(simple("Telefon durumu", "Telefon devri: çağrı başladı/bitti bilgisi", false, Manifest.permission.READ_PHONE_STATE))
                  list.add(simple("Arama kaydı", "Telefon devri: arayan numarayı görme", false, Manifest.permission.READ_CALL_LOG))
                  list.add(simple("SMS", "SMS gönderme", false, Manifest.permission.SEND_SMS))
                  list.add(simple("Konum", "Konumumu söyle", false, Manifest.permission.ACCESS_FINE_LOCATION))
                  list.add(Item("Erişilebilirlik", "Ekranı okuma, dokunma, klavye, ekran görüntüsü. Android 13+ ta: Uygulama bilgisi > ⋮ > Kısıtlanmış ayarlara izin ver", true,
                      { c -> accessibilityOn(c) },
                      { a -> a.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }))
                  list.add(Item("Bildirim erişimi", "Bildirimleri okuma ve yanıtlama", false,
                      { c -> notifListenerOn(c) },
                      { a -> a.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) }))
                  list.add(Item("Üstte göster", "Arka plandan uygulama açma ve yüzen orb", false,
                      { c -> Settings.canDrawOverlays(c) },
                      { a -> a.startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + a.packageName))) }))
                  list.add(Item("Sistem ayarları", "Parlaklık değiştirme", false,
                      { c -> Settings.System.canWrite(c) },
                      { a -> a.startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + a.packageName))) }))
                  list.add(Item("Tüm dosyalara erişim", "WhatsApp sesli mesaj/foto/video dosyalarını bulma", false,
                      { _ -> allFilesOk() },
                      { a ->
                          if (Build.VERSION.SDK_INT >= 30) {
                              a.startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:" + a.packageName)))
                          }
                      }))
                  list.add(Item("Medya erişimi", "Galeri ve ses dosyalarını okuma", false,
                      { c ->
                          var all = true
                          for (p in mediaPerms()) {
                              if (!rt(c, p)) all = false
                          }
                          all
                      },
                      { a -> runtimeAsk(a, mediaPerms()) }))
                  list.add(Item("Tam zamanlı alarm", "Zamanlanmış görevlerin tam vaktinde çalışması", false,
                      { c ->
                          if (Build.VERSION.SDK_INT >= 31) (c.getSystemService(Context.ALARM_SERVICE) as AlarmManager).canScheduleExactAlarms() else true
                      },
                      { a ->
                          if (Build.VERSION.SDK_INT >= 31) {
                              a.startActivity(Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse("package:" + a.packageName)))
                          }
                      }))
                  list.add(Item("Pil kısıtı yok", "Arka planda öldürülmemek için", false,
                      { c -> (c.getSystemService(Context.POWER_SERVICE) as PowerManager).isIgnoringBatteryOptimizations(c.packageName) },
                      { a -> a.startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + a.packageName))) }))
                  return list
              }

              fun micGranted(ctx: Context): Boolean = rt(ctx, Manifest.permission.RECORD_AUDIO)

              fun missingCritical(ctx: Context): List<Item> = items().filter { it.critical && !it.ok(ctx) }
          }
          NOVAX_EOF

