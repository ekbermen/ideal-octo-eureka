      - name: Yaz app/src/main/java/com/novax/assistant/ProviderDetector.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/ProviderDetector.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import org.json.JSONArray
          import org.json.JSONObject

          /**
           * API anahtarından şirketi bulur: önce anahtar biçimine bakar, sonra aday şirketlerin uçlarını gerçekten dener.
           * Çalışan şirket bulununca modelleri listeler ve en uygun modeli seçer.
           */
          object ProviderDetector {
              class Result(val provider: Provider?, val models: List<String>, val ranked: List<String>, val log: List<String>)

              private class Probe(val provider: Provider) {
                  @Volatile var code: Int = 0
                  @Volatile var models: List<String> = emptyList()
                  @Volatile var note: String = ""
                  @Volatile var done: Boolean = false
              }

              private fun probeOne(pr: Probe, key: String) {
                  val p = pr.provider
                  try {
                      if (p.id == "perplexity") {
                          val body = JSONObject()
                              .put("model", "sonar")
                              .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", "hi")))
                              .put("max_tokens", 1)
                          val r = Http.postJson(p.baseUrl + p.chatPath, Providers.authHeaders(p, key), body.toString(), 10000, 20000)
                          pr.code = r.code
                          if (r.code == 200) pr.models = p.staticModels
                          pr.note = if (r.code == 200) "geçerli" else Text.clip(r.body, 80)
                      } else {
                          val r = Http.get(Providers.modelsUrl(p), Providers.authHeaders(p, key), 12000)
                          pr.code = r.code
                          if (r.code == 200) {
                              var list = Providers.parseModels(p, r.body)
                              if (list.isEmpty()) list = p.staticModels
                              pr.models = list
                              pr.note = list.size.toString() + " model"
                          } else if (r.code == 429) {
                              pr.models = p.staticModels
                              pr.note = "kota/sınır (anahtar geçerli olabilir)"
                          } else {
                              pr.note = Text.clip(r.body.replace("\n", " "), 80)
                          }
                      }
                  } catch (e: Exception) {
                      pr.code = -1
                      pr.note = e.javaClass.simpleName
                  }
                  pr.done = true
              }

              private fun runProbes(cands: List<Provider>, key: String, waitMs: Long): List<Probe> {
                  val probes = ArrayList<Probe>()
                  val threads = ArrayList<Thread>()
                  for (p in cands) {
                      val pr = Probe(p)
                      probes.add(pr)
                      val t = Thread { probeOne(pr, key) }
                      t.start()
                      threads.add(t)
                  }
                  val end = System.currentTimeMillis() + waitMs
                  for (t in threads) {
                      val left = end - System.currentTimeMillis()
                      if (left > 0) {
                          try {
                              t.join(left)
                          } catch (_: InterruptedException) {
                          }
                      }
                  }
                  return probes
              }

              private fun isSuccess(pr: Probe): Boolean = pr.code == 200 || (pr.code == 429 && pr.models.isNotEmpty())

              fun detect(rawKey: String, customBase: String, onLog: (String) -> Unit): Result {
                  val key = rawKey.trim()
                  val log = ArrayList<String>()
                  fun say(s: String) {
                      log.add(s)
                      onLog(s)
                  }
                  if (key.isBlank()) {
                      say("API anahtarı boş.")
                      return Result(null, emptyList(), emptyList(), log)
                  }

                  if (customBase.isNotBlank()) {
                      val p = Providers.custom(customBase)
                      say("Özel adres deneniyor: " + p.baseUrl)
                      val pr = runProbes(listOf(p), key, 15000L)[0]
                      if (isSuccess(pr)) {
                          say("Bağlandı: " + pr.note)
                          val ranked = ModelPicker.rank(p, pr.models)
                          return Result(p, pr.models, ranked, log)
                      }
                      say("Özel adres cevap vermedi (" + pr.code + "): " + pr.note)
                      return Result(null, emptyList(), emptyList(), log)
                  }

                  // 1) anahtar biçimine göre adaylar
                  val matched = ArrayList<Provider>()
                  for (p in Providers.all) {
                      var best = -1
                      for (pre in p.keyPrefixes) {
                          if (key.startsWith(pre) && pre.length > best) best = pre.length
                      }
                      if (best >= 0) matched.add(p)
                  }
                  matched.sortByDescending { p ->
                      var best = 0
                      for (pre in p.keyPrefixes) {
                          if (key.startsWith(pre) && pre.length > best) best = pre.length
                      }
                      best
                  }
                  if (matched.isEmpty()) {
                      say("Anahtar biçimi tanınmadı; tüm şirketler sırayla denenecek.")
                  } else {
                      say("Anahtar biçimine göre adaylar: " + matched.joinToString(", ") { it.company })
                  }

                  var winner: Probe? = null
                  if (matched.isNotEmpty()) {
                      val probes = runProbes(matched, key, 14000L)
                      for (pr in probes) {
                          say(pr.provider.company + " -> " + pr.code + " " + pr.note)
                      }
                      for (pr in probes) {
                          if (isSuccess(pr)) {
                              winner = pr
                              break
                          }
                      }
                  }

                  // 2) bulunamadıysa diğer tüm şirketler
                  if (winner == null) {
                      val rest = ArrayList<Provider>()
                      for (p in Providers.all) {
                          if (!matched.contains(p)) rest.add(p)
                      }
                      say("Diğer " + rest.size + " şirket deneniyor…")
                      val probes = runProbes(rest, key, 18000L)
                      for (pr in probes) {
                          if (isSuccess(pr)) say(pr.provider.company + " -> " + pr.code + " " + pr.note)
                      }
                      for (pr in probes) {
                          if (isSuccess(pr)) {
                              winner = pr
                              break
                          }
                      }
                  }

                  val w = winner
                  if (w == null) {
                      say("Hiçbir şirket bu anahtarı kabul etmedi. Anahtarı kontrol et ya da özel adres gir.")
                      return Result(null, emptyList(), emptyList(), log)
                  }
                  say("Şirket bulundu: " + w.provider.company)
                  val ranked = ModelPicker.rank(w.provider, w.models)
                  if (ranked.isEmpty()) {
                      say("Model listesi boş geldi; elle model adı girebilirsin.")
                  } else {
                      say("Seçilen model: " + ranked[0] + " (" + ranked.size + " uygun model)")
                  }
                  return Result(w.provider, w.models, ranked, log)
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Providers.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Providers.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import org.json.JSONArray
          import org.json.JSONObject

          /** Bir yapay zekâ şirketinin API tanımı. */
          class Provider(
              val id: String,
              val company: String,
              val kind: Int,
              val baseUrl: String,
              val keyPrefixes: List<String>,
              val modelsPath: String,
              val chatPath: String,
              val staticModels: List<String>
          )

          object Providers {
              const val KIND_GEMINI = 0
              const val KIND_OPENAI = 1
              const val KIND_ANTHROPIC = 2

              private fun oa(id: String, company: String, base: String, prefixes: List<String>, models: List<String> = emptyList()): Provider =
                  Provider(id, company, KIND_OPENAI, base, prefixes, "/models", "/chat/completions", models)

              val all: List<Provider> = listOf(
                  Provider("google", "Google (Gemini)", KIND_GEMINI, "https://generativelanguage.googleapis.com/v1beta", listOf("AIza"), "/models", "", emptyList()),
                  oa("openai", "OpenAI", "https://api.openai.com/v1", listOf("sk-proj-", "sk-svcacct-", "sk-admin-", "sk-")),
                  Provider("anthropic", "Anthropic (Claude)", KIND_ANTHROPIC, "https://api.anthropic.com/v1", listOf("sk-ant-"), "/models", "/messages", emptyList()),
                  oa("groq", "Groq", "https://api.groq.com/openai/v1", listOf("gsk_")),
                  oa("openrouter", "OpenRouter", "https://openrouter.ai/api/v1", listOf("sk-or-")),
                  oa("xai", "xAI (Grok)", "https://api.x.ai/v1", listOf("xai-")),
                  oa("deepseek", "DeepSeek", "https://api.deepseek.com/v1", listOf("sk-")),
                  oa("mistral", "Mistral AI", "https://api.mistral.ai/v1", emptyList()),
                  oa("together", "Together AI", "https://api.together.xyz/v1", listOf("tgp_v1_")),
                  Provider("perplexity", "Perplexity", KIND_OPENAI, "https://api.perplexity.ai", listOf("pplx-"), "", "/chat/completions", listOf("sonar-pro", "sonar", "sonar-reasoning-pro", "sonar-reasoning")),
                  oa("fireworks", "Fireworks AI", "https://api.fireworks.ai/inference/v1", listOf("fw_")),
                  oa("cerebras", "Cerebras", "https://api.cerebras.ai/v1", listOf("csk-")),
                  oa("nvidia", "NVIDIA NIM", "https://integrate.api.nvidia.com/v1", listOf("nvapi-")),
                  oa("huggingface", "Hugging Face", "https://router.huggingface.co/v1", listOf("hf_")),
                  oa("moonshot", "Moonshot (Kimi)", "https://api.moonshot.ai/v1", listOf("sk-")),
                  oa("qwen", "Alibaba (Qwen)", "https://dashscope-intl.aliyuncs.com/compatible-mode/v1", listOf("sk-")),
                  oa("siliconflow", "SiliconFlow", "https://api.siliconflow.com/v1", listOf("sk-")),
                  oa("cohere", "Cohere", "https://api.cohere.ai/compatibility/v1", emptyList()),
                  oa("sambanova", "SambaNova", "https://api.sambanova.ai/v1", emptyList()),
                  oa("github", "GitHub Models", "https://models.inference.ai.azure.com", listOf("ghp_", "github_pat_"))
              )

              fun byId(id: String): Provider? {
                  for (p in all) {
                      if (p.id == id) return p
                  }
                  if (id == "custom") return custom(Prefs.customBase)
                  return null
              }

              fun custom(base: String): Provider =
                  Provider("custom", "Özel (OpenAI uyumlu)", KIND_OPENAI, base.trim().trimEnd('/'), emptyList(), "/models", "/chat/completions", emptyList())

              fun authHeaders(p: Provider, key: String): Map<String, String> {
                  val h = HashMap<String, String>()
                  when (p.kind) {
                      KIND_GEMINI -> h["x-goog-api-key"] = key
                      KIND_ANTHROPIC -> {
                          h["x-api-key"] = key
                          h["anthropic-version"] = "2023-06-01"
                      }
                      else -> {
                          h["Authorization"] = "Bearer " + key
                          if (p.id == "openrouter") {
                              h["HTTP-Referer"] = "https://novax.local"
                              h["X-Title"] = "Novax"
                          }
                      }
                  }
                  return h
              }

              fun modelsUrl(p: Provider): String {
                  return when (p.kind) {
                      KIND_GEMINI -> p.baseUrl + p.modelsPath + "?pageSize=1000"
                      KIND_ANTHROPIC -> p.baseUrl + p.modelsPath + "?limit=1000"
                      else -> p.baseUrl + p.modelsPath
                  }
              }

              /** Sağlayıcının model listesi cevabını kimliklere çevirir. */
              fun parseModels(p: Provider, body: String): List<String> {
                  val out = ArrayList<String>()
                  try {
                      val t = body.trim()
                      if (t.startsWith("[")) {
                          val arr = JSONArray(t)
                          for (i in 0 until arr.length()) {
                              val o = arr.optJSONObject(i)
                              if (o != null) {
                                  val id = o.optString("id", "")
                                  if (id.isNotBlank()) out.add(id)
                              }
                          }
                          return out
                      }
                      val o = JSONObject(t)
                      if (p.kind == KIND_GEMINI) {
                          val arr = o.optJSONArray("models")
                          if (arr != null) {
                              for (i in 0 until arr.length()) {
                                  val m = arr.optJSONObject(i) ?: continue
                                  val methods = m.optJSONArray("supportedGenerationMethods")
                                  var ok = methods == null
                                  if (methods != null) {
                                      for (j in 0 until methods.length()) {
                                          if (methods.optString(j) == "generateContent") ok = true
                                      }
                                  }
                                  val name = m.optString("name", "").removePrefix("models/")
                                  if (ok && name.isNotBlank()) out.add(name)
                              }
                          }
                      } else {
                          var arr = o.optJSONArray("data")
                          if (arr == null) arr = o.optJSONArray("models")
                          if (arr != null) {
                              for (i in 0 until arr.length()) {
                                  val m = arr.optJSONObject(i)
                                  if (m != null) {
                                      val id = m.optString("id", m.optString("name", ""))
                                      if (id.isNotBlank()) out.add(id)
                                  }
                              }
                          }
                      }
                  } catch (_: Exception) {
                  }
                  return out
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Scheduler.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Scheduler.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          /** Zamanlanmış görevler: belirli saatte/gecikmeyle bir komutu (normal ya da arka plan) çalıştırır. */
          object Scheduler {
              private fun sp() = NovaxApp.instance.getSharedPreferences("novax_sched", Context.MODE_PRIVATE)

              private fun load(): JSONArray {
                  return try {
                      JSONArray(sp().getString("items", "[]"))
                  } catch (_: Exception) {
                      JSONArray()
                  }
              }

              private fun save(a: JSONArray) {
                  sp().edit().putString("items", a.toString()).apply()
              }

              private fun alarm(): AlarmManager = NovaxApp.instance.getSystemService(Context.ALARM_SERVICE) as AlarmManager

              private fun pending(id: Int): PendingIntent {
                  val ctx = NovaxApp.instance
                  val i = Intent(ctx, NovaxReceiver::class.java).setAction(NovaxReceiver.ACTION_FIRE).putExtra("id", id)
                  return PendingIntent.getBroadcast(ctx, 7000 + id, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
              }

              private fun setAlarm(id: Int, at: Long) {
                  val am = alarm()
                  val pi = pending(id)
                  if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi)
                  } else {
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi)
                  }
              }

              @Synchronized
              fun add(goal: String, atMs: Long, bg: Boolean): Int {
                  val items = load()
                  var id = 1
                  for (i in 0 until items.length()) {
                      val o = items.getJSONObject(i)
                      if (o.optInt("id") >= id) id = o.optInt("id") + 1
                  }
                  items.put(JSONObject().put("id", id).put("goal", goal).put("at", atMs).put("bg", bg))
                  save(items)
                  setAlarm(id, atMs)
                  AppLog.i("sched", "görev #" + id + " kuruldu: " + goal)
                  return id
              }

              @Synchronized
              fun cancel(id: Int): Boolean {
                  val items = load()
                  val out = JSONArray()
                  var found = false
                  for (i in 0 until items.length()) {
                      val o = items.getJSONObject(i)
                      if (o.optInt("id") == id) {
                          found = true
                      } else {
                          out.put(o)
                      }
                  }
                  save(out)
                  if (found) {
                      try {
                          alarm().cancel(pending(id))
                      } catch (_: Exception) {
                      }
                  }
                  return found
              }

              @Synchronized
              fun list(): String {
                  val items = load()
                  if (items.length() == 0) return "Zamanlanmış görev yok."
                  val f = SimpleDateFormat("d MMM HH:mm", Locale("tr"))
                  val sb = StringBuilder()
                  for (i in 0 until items.length()) {
                      val o = items.getJSONObject(i)
                      sb.append("#").append(o.optInt("id")).append(" ").append(f.format(Date(o.optLong("at"))))
                      sb.append(if (o.optBoolean("bg")) " [arka plan] " else " ")
                      sb.append(Text.clip(o.optString("goal"), 80)).append("\n")
                  }
                  return sb.toString().trim()
              }

              fun fire(id: Int) {
                  var goal = ""
                  var bg = false
                  synchronized(this) {
                      val items = load()
                      val out = JSONArray()
                      for (i in 0 until items.length()) {
                          val o = items.getJSONObject(i)
                          if (o.optInt("id") == id) {
                              goal = o.optString("goal")
                              bg = o.optBoolean("bg")
                          } else {
                              out.put(o)
                          }
                      }
                      save(out)
                  }
                  if (goal.isBlank()) return
                  AppLog.i("sched", "görev #" + id + " tetiklendi: " + goal)
                  if (bg) {
                      Bus.novax(BgTasks.start(goal))
                  } else {
                      Brain.handle(goal)
                  }
              }

              /** Yeniden başlatmadan sonra alarmları geri kurar. */
              fun rescheduleAll() {
                  val items = load()
                  val now = System.currentTimeMillis()
                  for (i in 0 until items.length()) {
                      val o = items.getJSONObject(i)
                      val at = o.optLong("at")
                      if (at <= now) {
                          val id = o.optInt("id")
                          Brain.runAsync(Runnable { fire(id) })
                      } else {
                          setAlarm(o.optInt("id"), at)
                      }
                  }
              }

              /** "HH:mm" için bir sonraki uygun zamanı hesaplar. */
              fun nextTime(hour: Int, minute: Int): Long {
                  val c = Calendar.getInstance()
                  c.set(Calendar.HOUR_OF_DAY, hour)
                  c.set(Calendar.MINUTE, minute)
                  c.set(Calendar.SECOND, 0)
                  c.set(Calendar.MILLISECOND, 0)
                  if (c.timeInMillis <= System.currentTimeMillis()) c.add(Calendar.DAY_OF_YEAR, 1)
                  return c.timeInMillis
              }
          }
          NOVAX_EOF

