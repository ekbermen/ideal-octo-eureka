              private fun refreshBanner() {
                  banner.removeAllViews()
                  val miss = Perms.missingCritical(this)
                  val aiReady = Prefs.apiKey.isNotBlank() && Prefs.providerId.isNotBlank() && Prefs.model.isNotBlank()
                  if (miss.isEmpty() && aiReady) {
                      banner.visibility = View.GONE
                      return
                  }
                  banner.visibility = View.VISIBLE
                  val lines = ArrayList<String>()
                  if (!aiReady) lines.add("• Yapay zekâ kurulumu eksik (API anahtarı → Algıla ve test et)")
                  for (m in miss) lines.add("• " + m.title + " izni gerekli")
                  banner.addView(Ui.text(this, "KURULUM EKSİK\n" + lines.joinToString("\n"), 12f, Ui.AMBER))
                  val go = Ui.button(this, "Kuruluma git", Ui.AMBER) { startActivity(Intent(this, SetupActivity::class.java)) }
                  banner.addView(go, Ui.margins(Ui.lp(-2, -2), this, 0f, 6f, 0f, 0f))
              }

              private fun send() {
                  val t = input.text.toString().trim()
                  if (t.isEmpty()) return
                  input.setText("")
                  (getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager).hideSoftInputFromWindow(input.windowToken, 0)
                  Voice.stopSpeaking()
                  Brain.handle(t)
              }

              private fun onMic() {
                  if (!Perms.micGranted(this)) {
                      requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO), Perms.REQ)
                      return
                  }
                  if (Voice.speaking) { Voice.stopSpeaking(); return }
                  if (Voice.mode == Voice.Mode.COMMAND) {
                      Voice.stopAll()
                      if (Prefs.wakeOn) Voice.startWake()
                      return
                  }
                  Voice.listenOnce()
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  refreshBanner()
                  if (Perms.micGranted(this) && !NovaxService.running) NovaxService.start(this)
              }

              private fun addBubble(user: Boolean, text: String) {
                  val tv = Ui.text(this, (if (user) "› " else "◈ ") + text, 14f, if (user) Color.WHITE else Ui.CYAN)
                  tv.setTextIsSelectable(true)
                  val fill = if (user) Color.parseColor("#12384D") else Color.parseColor("#0A1B2A")
                  val stroke = if (user) Ui.CYAN_DIM else Color.parseColor("#33005F73")
                  tv.background = Ui.box(this, fill, stroke, 10f)
                  tv.setPadding(Ui.dp(this, 12f), Ui.dp(this, 8f), Ui.dp(this, 12f), Ui.dp(this, 8f))
                  val lp = Ui.margins(Ui.lp(-2, -2), this, if (user) 40f else 0f, 3f, if (user) 0f else 40f, 3f)
                  lp.gravity = if (user) Gravity.END else Gravity.START
                  feed.addView(tv, lp)
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun applyState(s: OrbState) {
                  reactor.state = s
                  wave.state = s
                  val label: String
                  val color: Int
                  when (s) {
                      OrbState.IDLE -> {
                          label = if (NovaxService.running && Prefs.wakeOn) "DİNLİYOR · \"" + Prefs.wakeWord.uppercase() + "\"" else "STANDBY"
                          color = Ui.CYAN_DIM
                      }
                      OrbState.LISTENING -> { label = "LISTENING"; color = Ui.CYAN }
                      OrbState.THINKING -> { label = "PROCESSING"; color = Ui.AMBER }
                      OrbState.SPEAKING -> { label = "SPEAKING"; color = Ui.CYAN }
                      OrbState.ERROR -> { label = "ERROR"; color = Ui.RED }
                  }
                  val bgN = BgTasks.active()
                  statusLabel.text = if (bgN > 0) label + " · ARKA PLAN " + bgN else label
                  statusLabel.setTextColor(color)
                  dot.background = Ui.box(this, color, color, 20f, 0f)
              }

              // ------------------------------------------------------------------ Bus
              override fun onUser(text: String) { addBubble(true, text); partialLabel.text = "" }
              override fun onNovax(text: String) { addBubble(false, text) }
              override fun onState(s: OrbState) { applyState(s) }
              override fun onLevel(v: Float) { reactor.level = v; wave.level = v }
              override fun onPartial(text: String) { partialLabel.text = text }
              override fun onLog(line: String) { partialLabel.text = Text.clip(line, 60) }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/MediaAnalyzer.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/MediaAnalyzer.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.media.MediaMetadataRetriever
          import android.util.Base64
          import java.io.ByteArrayOutputStream
          import java.io.File

          /** Fotoğraf, ses ve video dosyalarını yapay zekâ ile inceler. */
          object MediaAnalyzer {
              private const val MAX_INLINE = 18L * 1024L * 1024L

              private fun mimeFor(ext: String): String {
                  return when (ext.lowercase()) {
                      "opus", "ogg", "oga" -> "audio/ogg"
                      "mp3" -> "audio/mp3"
                      "m4a" -> "audio/mp4"
                      "aac" -> "audio/aac"
                      "wav" -> "audio/wav"
                      "flac" -> "audio/flac"
                      "amr" -> "audio/amr"
                      "mp4" -> "video/mp4"
                      "mov" -> "video/quicktime"
                      "webm" -> "video/webm"
                      "3gp" -> "video/3gpp"
                      "mkv" -> "video/x-matroska"
                      "avi" -> "video/x-msvideo"
                      "png" -> "image/png"
                      "webp" -> "image/webp"
                      else -> "image/jpeg"
                  }
              }

              /** Görüntüyü yönünü düzelterek uzun kenarı maxSide olacak şekilde JPEG base64 yapar. */
              fun imageBase64(f: File, maxSide: Int): String? {
                  try {
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      BitmapFactory.decodeFile(f.absolutePath, bounds)
                      if (bounds.outWidth <= 0 || bounds.outHeight <= 0) return null
                      var sample = 1
                      while (maxOf(bounds.outWidth, bounds.outHeight) / sample > maxSide * 2) sample *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = sample
                      var bmp = BitmapFactory.decodeFile(f.absolutePath, opts) ?: return null
                      var rotate = 0
                      try {
                          val exif = ExifInterface(f.absolutePath)
                          val o = exif.getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL)
                          rotate = when (o) {
                              ExifInterface.ORIENTATION_ROTATE_90 -> 90
                              ExifInterface.ORIENTATION_ROTATE_180 -> 180
                              ExifInterface.ORIENTATION_ROTATE_270 -> 270
                              else -> 0
                          }
                      } catch (_: Exception) {
                      }
                      val scale = maxSide.toFloat() / maxOf(bmp.width, bmp.height)
                      val m = Matrix()
                      if (scale < 1f) m.postScale(scale, scale)
                      if (rotate != 0) m.postRotate(rotate.toFloat())
                      if (!m.isIdentity) bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                      val bos = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.JPEG, 82, bos)
                      return Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)
                  } catch (e: Exception) {
                      AppLog.e("media", "görüntü okunamadı", e)
                      return null
                  }
              }

              fun bitmapBase64(b: Bitmap, maxSide: Int, quality: Int = 80): String {
                  val scale = maxSide.toFloat() / maxOf(b.width, b.height)
                  val s = if (scale < 1f) Bitmap.createScaledBitmap(b, (b.width * scale).toInt(), (b.height * scale).toInt(), true) else b
                  val bos = ByteArrayOutputStream()
                  s.compress(Bitmap.CompressFormat.JPEG, quality, bos)
                  return Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP)
              }

              private fun fileBase64(f: File): String = Base64.encodeToString(f.readBytes(), Base64.NO_WRAP)

              private fun videoFrames(f: File, n: Int): List<LlmPart> {
                  val out = ArrayList<LlmPart>()
                  val r = MediaMetadataRetriever()
                  try {
                      r.setDataSource(f.absolutePath)
                      val durMs = r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                      for (i in 0 until n) {
                          val t = if (durMs > 0L) (durMs * (i + 0.5) / n).toLong() * 1000L else i * 1000000L
                          val b = r.getFrameAtTime(t, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                          if (b != null) out.add(LlmPart.ofImage(bitmapBase64(b, 768, 75)))
                      }
                  } catch (e: Exception) {
                      AppLog.e("media", "video kareleri alınamadı", e)
                  } finally {
                      try {
                          r.release()
                      } catch (_: Exception) {
                      }
                  }
                  return out
              }

              private fun defaultQuestion(kind: String, isVoice: Boolean): String {
                  if (kind == "audio") {
                      return if (isVoice) "Bu bir sesli mesaj. Önce ne dediğini olduğu gibi (kısaltmadan) yaz, sonra bir cümleyle özetle ve benden bir şey isteniyorsa belirt."
                      else "Bu ses kaydını dinle: ne anlatıyor? Konuşma varsa metne dök ve özetle."
                  }
                  if (kind == "video") return "Bu videoda ne oluyor? Önemli anları sırayla anlat; konuşma varsa özetle."
                  return "Bu görselde ne var? Yazı varsa oku, önemli ayrıntıları anlat."
              }

              fun analyze(path: String, questionIn: String): String {
                  val f = File(path)
                  if (!f.exists()) return "HATA: dosya yok: " + path
                  val kind = MediaFinder.kindOf(f)
                  val isVoice = f.extension.lowercase() == "opus" || path.contains("Voice Notes", true)
                  val question = questionIn.ifBlank { defaultQuestion(kind, isVoice) }
                  try {
                      return when (kind) {
                          "image" -> analyzeImage(f, question)
                          "audio" -> analyzeAudio(f, question)
                          "video" -> analyzeVideo(f, question)
                          else -> "HATA: desteklenmeyen dosya türü: " + f.name
                      }
                  } catch (e: Exception) {
                      AppLog.e("media", "analiz hatası", e)
                      return "HATA: " + Llm.describeError(e)
                  }
              }

              private fun askVision(parts: List<LlmPart>): String {
                  val client = Llm.visionClient()
                  val reply = client.chat("Türkçe, açık ve kısa cevap ver. Sesli okunacak; markdown kullanma.", listOf(LlmMsg.userParts(parts)), null)
                  return reply.text.ifBlank { "Boş cevap geldi." }
              }

              private fun analyzeImage(f: File, question: String): String {
                  val b64 = imageBase64(f, 1568) ?: return "HATA: görüntü okunamadı."
                  return askVision(listOf(LlmPart.ofText(question), LlmPart.ofImage(b64)))
              }

              private fun analyzeVideo(f: File, question: String): String {
                  val gem = Llm.geminiMediaClient()
                  if (gem != null && f.length() <= MAX_INLINE) {
                      val parts = listOf(LlmPart.ofText(question), LlmPart.ofVideo(fileBase64(f), mimeFor(f.extension)))
                      val r = gem.chat("Türkçe, açık ve kısa cevap ver. Sesli okunacak; markdown kullanma.", listOf(LlmMsg.userParts(parts)), null)
                      return r.text.ifBlank { "Boş cevap geldi." }
                  }
                  val frames = videoFrames(f, 8)
                  if (frames.isEmpty()) return "HATA: video kareleri çıkarılamadı."
                  val parts = ArrayList<LlmPart>()
                  parts.add(LlmPart.ofText(question + "\n(Not: videonun yalnızca " + frames.size + " karesi gönderildi, ses yok.)"))
                  parts.addAll(frames)
                  return askVision(parts)
              }

              private fun analyzeAudio(f: File, question: String): String {
                  if (f.length() > MAX_INLINE) return "HATA: ses dosyası çok büyük (" + f.length() / 1048576L + " MB, en fazla 18 MB)."
                  val gem = Llm.geminiMediaClient()
                  if (gem != null) {
                      val parts = listOf(LlmPart.ofText(question), LlmPart.ofAudio(fileBase64(f), mimeFor(f.extension)))
                      val r = gem.chat("Türkçe, açık ve kısa cevap ver. Sesli okunacak; markdown kullanma.", listOf(LlmMsg.userParts(parts)), null)
                      return r.text.ifBlank { "Boş cevap geldi." }
                  }
                  val c = Llm.client()
                  if (c is OpenAiClient && c.canTranscribe()) {
                      val ext = if (f.extension.lowercase() == "opus") "ogg" else f.extension.lowercase()
                      val text = c.transcribe(f.readBytes(), f.nameWithoutExtension + "." + ext, mimeFor(ext))
                      if (text.isBlank()) return "Ses çözümlenemedi (boş çıktı)."
                      val r = c.chat("Türkçe, açık ve kısa cevap ver. Markdown kullanma.", listOf(LlmMsg.user(question + "\n\nSes metni:\n" + text)), null)
                      return r.text.ifBlank { text }
                  }
                  return "HATA: Seçili sağlayıcı ses dosyası dinleyemiyor. Ayarlar > Yapay zekâ bölümüne 'ses/video için Gemini anahtarı' ekle (ücretsiz anahtar yeterli) ya da OpenAI/Groq kullan."
              }

              /** Seçilen kaynaktaki en yeni sesli mesajı bulup dinler. */
              fun listenLatestVoice(source: String, question: String): String {
                  val items = MediaFinder.find("voice", source.ifBlank { "whatsapp" }, 1)
                  if (items.isEmpty()) return MediaFinder.describe(items)
                  val it = items[0]
                  return "Dosya: " + it.file.name + "\n" + analyze(it.file.absolutePath, question)
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/MediaFinder.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/MediaFinder.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** WhatsApp/Telegram/İndirilenler/Kamera/Ekran görüntüleri klasörlerinde en yeni medya dosyalarını bulur. */
          object MediaFinder {
              class Item(val file: File, val kind: String, val source: String, val time: Long)

              private val AUDIO = setOf("opus", "ogg", "mp3", "m4a", "aac", "wav", "amr", "flac", "oga")
              private val IMAGE = setOf("jpg", "jpeg", "png", "webp", "heic", "gif")
              private val VIDEO = setOf("mp4", "mkv", "mov", "3gp", "webm", "avi")

              fun kindOf(f: File): String {
                  val ext = f.extension.lowercase()
                  if (AUDIO.contains(ext)) return "audio"
                  if (IMAGE.contains(ext)) return "image"
                  if (VIDEO.contains(ext)) return "video"
                  return "other"
              }

              fun hasAccess(): Boolean {
                  val ctx = NovaxApp.instance
                  if (Build.VERSION.SDK_INT >= 30 && Environment.isExternalStorageManager()) return true
                  if (Build.VERSION.SDK_INT >= 33) {
                      return ctx.checkSelfPermission(Manifest.permission.READ_MEDIA_IMAGES) == PackageManager.PERMISSION_GRANTED
                  }
                  return ctx.checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
              }

              private fun base(): File = Environment.getExternalStorageDirectory()

              private fun dirs(source: String, kind: String): List<File> {
                  val b = base()
                  val out = ArrayList<File>()
                  val src = source.lowercase()
                  if (src == "whatsapp" || src == "all" || src == "") {
                      for (root in listOf("Android/media/com.whatsapp/WhatsApp/Media", "WhatsApp/Media", "Android/media/com.whatsapp.w4b/WhatsApp Business/Media", "WhatsApp Business/Media")) {
                          val r = File(b, root)
                          if (kind == "voice") {
                              out.add(File(r, "WhatsApp Voice Notes"))
                              out.add(File(r, "WhatsApp Business Voice Notes"))
                          } else if (kind == "audio") {
                              out.add(File(r, "WhatsApp Voice Notes"))
                              out.add(File(r, "WhatsApp Audio"))
                          } else if (kind == "image") {
                              out.add(File(r, "WhatsApp Images"))
                          } else if (kind == "video") {
                              out.add(File(r, "WhatsApp Video"))
                          } else {
                              out.add(r)
                          }
                      }
                  }
                  if (src == "telegram" || src == "all") {
                      for (root in listOf("Android/media/org.telegram.messenger/Telegram", "Telegram")) {
                          val r = File(b, root)
                          if (kind == "voice" || kind == "audio") out.add(File(r, "Telegram Audio"))
                          else if (kind == "image") out.add(File(r, "Telegram Images"))
                          else if (kind == "video") out.add(File(r, "Telegram Video"))
                          else out.add(r)
                      }
                  }
                  if (src == "downloads" || src == "indirilenler" || src == "all") out.add(File(b, "Download"))
                  if (src == "camera" || src == "kamera" || src == "all") out.add(File(b, "DCIM"))
                  if (src == "screenshots" || src == "ekran" || src == "all") {
                      out.add(File(b, "Pictures/Screenshots"))
                      out.add(File(b, "DCIM/Screenshots"))
                  }
                  if (src == "recordings" || src == "kayit" || src == "all") {
                      out.add(File(b, "Recordings"))
                      out.add(File(b, "Music/Recordings"))
                      out.add(File(b, "Sounds"))
                  }
                  return out
              }

              private fun walk(dir: File, depth: Int, kind: String, includeSent: Boolean, out: MutableList<File>) {
                  if (depth > 4) return
                  val list = try { dir.listFiles() } catch (_: Exception) { null }
                  if (list == null) return
                  for (f in list) {
                      if (f.isDirectory) {
                          if (!includeSent && f.name.equals("Sent", true)) continue
                          if (f.name.startsWith(".")) continue
                          walk(f, depth + 1, kind, includeSent, out)
                      } else {
                          val k = kindOf(f)
                          val want = when (kind) {
                              "voice", "audio" -> k == "audio"
                              "image" -> k == "image"
                              "video" -> k == "video"
                              else -> k != "other"
                          }
                          if (want) out.add(f)
                      }
                  }
              }

              /** kind: voice|audio|image|video|any ; source: whatsapp|telegram|downloads|camera|screenshots|recordings|all */
              fun find(kind: String, source: String, count: Int, includeSent: Boolean = false): List<Item> {
                  val files = ArrayList<File>()
                  for (d in dirs(source, kind)) {
                      if (d.exists()) walk(d, 0, kind, includeSent, files)
                  }
                  val items = ArrayList<Item>()
                  for (f in files.sortedByDescending { it.lastModified() }.take(count.coerceIn(1, 30))) {
                      items.add(Item(f, kindOf(f), source, f.lastModified()))
                  }
                  if (items.isEmpty()) items.addAll(fromMediaStore(kind, count))
                  return items
              }

              private fun fromMediaStore(kind: String, count: Int): List<Item> {
                  val out = ArrayList<Item>()
                  try {
                      val uri = when (kind) {
                          "image" -> MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                          "video" -> MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                          else -> MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                      }
                      @Suppress("DEPRECATION")
                      val cols = arrayOf(MediaStore.MediaColumns.DATA, MediaStore.MediaColumns.DATE_ADDED)
                      val c = NovaxApp.instance.contentResolver.query(uri, cols, null, null, MediaStore.MediaColumns.DATE_ADDED + " DESC")
                      if (c != null) {
                          try {
                              var n = 0
                              while (c.moveToNext() && n < count) {
                                  val p = c.getString(0) ?: continue
                                  val f = File(p)
                                  if (f.exists()) {
                                      out.add(Item(f, kindOf(f), "mediastore", f.lastModified()))
                                      n++
                                  }
                              }
                          } finally {
                              c.close()
                          }
                      }
                  } catch (_: Exception) {
                  }
                  return out
              }

              fun describe(items: List<Item>): String {
                  if (items.isEmpty()) {
                      return if (hasAccess()) "Medya bulunamadı." else "Medya bulunamadı: 'Tüm dosyalara erişim' veya medya izni gerekli (Ayarlar > İzinler)."
                  }
                  val f = SimpleDateFormat("d MMM HH:mm", Locale("tr"))
                  val sb = StringBuilder()
                  for (i in items.indices) {
                      val it = items[i]
                      sb.append(i + 1).append(". ").append(it.file.absolutePath).append(" [").append(it.kind).append(", ")
                      sb.append(f.format(Date(it.time))).append(", ").append(it.file.length() / 1024L).append(" KB]\n")
                  }
                  return sb.toString().trim()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/MemoryStore.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/MemoryStore.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Kalıcı hafıza: bilgiler (anahtar/değer), konuşma geçmişi ve notlar. */
          object MemoryStore {
              private lateinit var db: SQLiteDatabase

              private class Helper(c: Context) : SQLiteOpenHelper(c, "novax.db", null, 1) {
                  override fun onCreate(d: SQLiteDatabase) {
                      d.execSQL("CREATE TABLE facts(k TEXT PRIMARY KEY, v TEXT NOT NULL, ts INTEGER NOT NULL)")
                      d.execSQL("CREATE TABLE turns(id INTEGER PRIMARY KEY AUTOINCREMENT, role TEXT NOT NULL, txt TEXT NOT NULL, ts INTEGER NOT NULL)")
                      d.execSQL("CREATE TABLE notes(id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT NOT NULL, body TEXT NOT NULL, ts INTEGER NOT NULL)")
                  }

                  override fun onUpgrade(d: SQLiteDatabase, o: Int, n: Int) {}
              }

              fun init(ctx: Context) {
                  db = Helper(ctx.applicationContext).writableDatabase
              }

              // ---- bilgiler ----
              @Synchronized
              fun remember(key: String, value: String) {
                  val cv = ContentValues()
                  cv.put("k", key.trim().lowercase())
                  cv.put("v", value.trim())
                  cv.put("ts", System.currentTimeMillis())
                  db.insertWithOnConflict("facts", null, cv, SQLiteDatabase.CONFLICT_REPLACE)
              }

              @Synchronized
              fun forget(key: String): Int {
                  val k = key.trim().lowercase()
                  return db.delete("facts", "k = ? OR k LIKE ?", arrayOf(k, "%" + k + "%"))
              }

              @Synchronized
              fun recall(query: String): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()
                  val q = "%" + query.trim().lowercase() + "%"
                  val c = if (query.isBlank()) {
                      db.rawQuery("SELECT k, v FROM facts ORDER BY ts DESC LIMIT 200", null)
                  } else {
                      db.rawQuery("SELECT k, v FROM facts WHERE k LIKE ? OR lower(v) LIKE ? ORDER BY ts DESC LIMIT 50", arrayOf(q, q))
                  }
                  try {
                      while (c.moveToNext()) out.add(Pair(c.getString(0), c.getString(1)))
                  } finally {
                      c.close()
                  }
                  return out
              }

              fun factsBlock(max: Int = 60): String =
                  recall("").take(max).joinToString("\n") { "- " + it.first + ": " + it.second }

              @Synchronized
              fun clearFacts() {
                  db.execSQL("DELETE FROM facts")
              }

              // ---- konuşma geçmişi ----
              @Synchronized
              fun addTurn(role: String, text: String) {
                  val cv = ContentValues()
                  cv.put("role", role)
                  cv.put("txt", text.take(2000))
                  cv.put("ts", System.currentTimeMillis())
                  db.insert("turns", null, cv)
                  db.execSQL("DELETE FROM turns WHERE id <= (SELECT MAX(id) FROM turns) - 400")
              }

              @Synchronized
              fun recentTurns(n: Int): List<Pair<String, String>> {
                  val out = ArrayList<Pair<String, String>>()
                  val c = db.rawQuery("SELECT role, txt FROM turns ORDER BY id DESC LIMIT " + n, null)
                  try {
                      while (c.moveToNext()) out.add(Pair(c.getString(0), c.getString(1)))
                  } finally {
                      c.close()
                  }
                  out.reverse()
                  return out
              }

              @Synchronized
              fun clearTurns() {
                  db.execSQL("DELETE FROM turns")
              }

              // ---- notlar ----
              @Synchronized
              fun addNote(title: String, body: String): Long {
                  val cv = ContentValues()
                  cv.put("title", title.ifBlank { "Not" })
                  cv.put("body", body)
                  cv.put("ts", System.currentTimeMillis())
                  return db.insert("notes", null, cv)
              }

              @Synchronized
              fun notes(limit: Int = 20): List<String> {
                  val out = ArrayList<String>()
                  val f = SimpleDateFormat("d MMM HH:mm", Locale("tr"))
                  val c = db.rawQuery("SELECT title, body, ts FROM notes ORDER BY id DESC LIMIT " + limit, null)
                  try {
                      while (c.moveToNext()) {
                          out.add(f.format(Date(c.getLong(2))) + " · " + c.getString(0) + ": " + c.getString(1))
                      }
                  } finally {
                      c.close()
                  }
                  return out
              }

              @Synchronized
              fun clearNotes() {
                  db.execSQL("DELETE FROM notes")
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Messaging.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Messaging.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.SystemClock
          import android.telephony.SmsManager

          /** Arama, SMS ve WhatsApp (wa.me + erişilebilirlik ile otomatik gönder). */
          object Messaging {
              private fun has(p: String): Boolean =
                  NovaxApp.instance.checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              fun resolve(to: String): Contacts.C? = Contacts.find(to)

              fun findContactText(name: String): String {
                  if (!Contacts.granted()) return "HATA: Rehber izni yok."
                  val c = Contacts.find(name)
                  val more = Contacts.search(name)
                  if (c == null) return "Rehberde '" + name + "' bulunamadı."
                  val label = if (c.name.isBlank()) "Numara" else c.name
                  val extra = if (more.size > 1) " (benzerleri: " + more.drop(1).joinToString { it.name } + ")" else ""
                  return label + ": " + c.number + extra
              }

              /** "anneme eve geliyorum" -> (Annem, "eve geliyorum"). İlk 1-3 kelimeyi isim olarak dener. */
              fun splitNameText(rest: String): Pair<Contacts.C, String>? {
                  val tokens = rest.trim().split(Regex("\\s+")).filter { it.isNotEmpty() }
                  if (tokens.size < 2) return null
                  for (k in minOf(3, tokens.size - 1) downTo 1) {
                      val name = tokens.take(k).joinToString(" ")
                      val c = Contacts.find(name) ?: continue
                      return Pair(c, tokens.drop(k).joinToString(" "))
                  }
                  return null
              }

              // ------------------------------------------------------------------ arama
              fun call(to: String): String {
                  val c = resolve(to) ?: return "HATA: '" + to + "' rehberde yok."
                  val uri = Uri.parse("tel:" + Uri.encode(c.number))
                  val label = if (c.name.isBlank()) c.number else c.name
                  return if (has(Manifest.permission.CALL_PHONE)) {
                      if (Act.start(Intent(Intent.ACTION_CALL, uri))) label + " aranıyor." else "HATA: arama başlatılamadı"
                  } else {
                      Act.start(Intent(Intent.ACTION_DIAL, uri))
                      "Arama izni yok; numarayı çevirici ekranında açtım."
                  }
              }

              // ------------------------------------------------------------------ SMS
              @Suppress("DEPRECATION")
              fun sms(to: String, text: String): String {
                  val c = resolve(to) ?: return "HATA: '" + to + "' rehberde yok."
                  if (text.isBlank()) return "HATA: mesaj boş"
                  if (!has(Manifest.permission.SEND_SMS)) {
                      val i = Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:" + Uri.encode(c.number))).putExtra("sms_body", text)
                      Act.start(i)
                      return "SMS izni yok; mesajı yazıp ekranı açtım, gönder tuşuna basman gerek."
                  }
                  return try {
                      val sm: SmsManager = if (android.os.Build.VERSION.SDK_INT >= 31) {
                          NovaxApp.instance.getSystemService(SmsManager::class.java)
                      } else {
                          SmsManager.getDefault()
                      }
                      val parts = sm.divideMessage(text)
                      sm.sendMultipartTextMessage(c.number, null, parts, null, null)
                      "SMS gönderildi: " + (if (c.name.isBlank()) c.number else c.name)
                  } catch (e: Exception) {
                      "HATA: SMS gönderilemedi: " + e.message
                  }
              }

              // ------------------------------------------------------------------ WhatsApp
              fun waPackage(): String? {
                  val pm = NovaxApp.instance.packageManager
                  for (p in listOf("com.whatsapp", "com.whatsapp.w4b")) {
                      try {
                          pm.getPackageInfo(p, 0)
                          return p
                      } catch (_: Exception) {
                      }
                  }
                  return null
              }

              private val sendLabels = listOf("gonder", "send", "enviar", "envoyer", "senden", "invia", "otpravit")

              /** Sohbeti (isteğe bağlı hazır metinle) açar. */
              fun openWhatsAppChat(c: Contacts.C, text: String): Boolean {
                  val pkg = waPackage() ?: return false
                  val num = Contacts.intl(c.number)
                  val url = if (text.isBlank()) "https://wa.me/" + num else "https://wa.me/" + num + "?text=" + Uri.encode(text)
                  val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).setPackage(pkg)
                  return Act.start(intent)
              }

              fun whatsapp(to: String, text: String): String {
                  if (text.isBlank()) return "HATA: mesaj boş"
                  val c = resolve(to) ?: return "HATA: '" + to + "' rehberde bulunamadı."
                  val pkg = waPackage() ?: return "HATA: WhatsApp yüklü değil."
                  if (!openWhatsAppChat(c, text)) return "HATA: WhatsApp açılamadı."
                  val who = if (c.name.isBlank()) c.number else c.name
                  val acc = NovaxAccessibilityService.instance
                      ?: return "WhatsApp'ta " + who + " sohbetini yazılı mesajla açtım; erişilebilirlik kapalı, gönder tuşuna elle bas."
                  return if (clickSend(acc, pkg, 12000L)) "WhatsApp mesajı " + who + " kişisine gönderildi."
                  else "Sohbeti açtım ama gönder tuşunu bulamadım; ekranı kontrol et. (Çoğunlukla WhatsApp henüz yüklenmedi veya kilit ekranı açık.)"
              }

              fun clickSend(acc: NovaxAccessibilityService, pkg: String, timeoutMs: Long): Boolean {
                  acc.waitForPackage(pkg, 5000L)
                  ScreenOps.idle(2500L, 350L)
                  val end = SystemClock.uptimeMillis() + timeoutMs
                  while (SystemClock.uptimeMillis() < end) {
                      val byId = acc.findByViewId(pkg + ":id/send")
                      if (byId.isNotEmpty() && acc.clickNode(byId.first())) {
                          ScreenOps.nap(500L)
                          return true
                      }
                      for (l in sendLabels) {
                          val n = acc.findAll(l, true).firstOrNull()
                          if (n != null && acc.clickNode(n)) {
                              ScreenOps.nap(500L)
                              return true
                          }
                      }
                      ScreenOps.nap(350L)
                  }
                  return false
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/ModelPicker.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/ModelPicker.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /** Bir şirketin model listesinden asistan için en uygun olanı seçer. */
          object ModelPicker {
              private val bad: List<String> = listOf(
                  "embed", "tts", "whisper", "moderation", "image", "imagen", "veo", "dall-e", "dalle", "realtime",
                  "transcribe", "rerank", "guard", "aqa", "learnlm", "audio", "speech", "davinci", "babbage",
                  "search-preview", "computer-use", "robotics", "native-audio", "diffusion", "flux", "stable-diffusion",
                  "sdxl", "bge-", "e5-", "clip", "codex", "deep-research", "instruct-0", "gpt-3.5-turbo-instruct",
                  "ocr", "safeguard", "prompt-guard", "-live", "live-", "lyria", "nano-banana"
              )

              private val preferred: Map<String, List<String>> = mapOf(
                  "google" to listOf("flash", "pro"),
                  "openai" to listOf("gpt-5", "gpt-4.1", "gpt-4o", "o4", "o3", "gpt-4"),
                  "anthropic" to listOf("sonnet", "opus", "haiku"),
                  "groq" to listOf("llama-3.3-70b-versatile", "llama-4-maverick", "llama-4-scout", "qwen3-32b", "llama-3.1-70b", "llama-3.1-8b"),
                  "openrouter" to listOf("anthropic/claude-sonnet", "google/gemini-2.5-flash", "openai/gpt-4.1", "openai/gpt-4o", "deepseek/deepseek-chat"),
                  "xai" to listOf("grok-4", "grok-3", "grok-2"),
                  "deepseek" to listOf("deepseek-chat", "deepseek-reasoner"),
                  "mistral" to listOf("mistral-large-latest", "mistral-medium-latest", "mistral-small-latest"),
                  "together" to listOf("Llama-3.3-70B", "Llama-4", "Qwen2.5-72B", "Llama-3.1-70B"),
                  "cerebras" to listOf("llama-3.3-70b", "llama3.1-70b", "qwen-3-32b", "llama3.1-8b"),
                  "nvidia" to listOf("llama-3.3-70b", "llama-3.1-70b", "llama-3.1-405b"),
                  "moonshot" to listOf("kimi-k2", "moonshot-v1"),
                  "perplexity" to listOf("sonar-pro", "sonar"),
                  "fireworks" to listOf("llama-v3p3-70b", "llama4", "qwen"),
                  "github" to listOf("gpt-4o", "Llama-3.3-70B", "Mistral-large")
              )

              fun rank(p: Provider, ids: List<String>): List<String> {
                  val clean = ArrayList<String>()
                  for (raw in ids) {
                      val id = raw.removePrefix("models/")
                      val l = id.lowercase()
                      var skip = false
                      for (b in bad) {
                          if (l.contains(b)) {
                              skip = true
                              break
                          }
                      }
                      if (!skip && !clean.contains(id)) clean.add(id)
                  }
                  return clean.sortedByDescending { score(p, it) }
              }

              fun score(p: Provider, id: String): Double {
                  val l = id.lowercase()
                  var s = 0.0
                  val pref = preferred[p.id]
                  if (pref != null) {
                      for (i in pref.indices) {
                          if (l.contains(pref[i].lowercase())) {
                              s += 100000.0 - i * 1000.0
                              break
                          }
                      }
                  }
                  val nums = ArrayList<Int>()
                  for (m in Regex("\\d+").findAll(l)) {
                      val v = m.value.toIntOrNull() ?: continue
                      if (v >= 100) break
                      nums.add(v)
                      if (nums.size == 2) break
                  }
                  var ver = 0.0
                  if (nums.size >= 1) ver = nums[0].toDouble()
                  if (nums.size >= 2 && nums[1] < 10) ver += nums[1] / 10.0
                  s += ver * 300.0
                  if (l.contains("preview") || l.contains("-exp")) s -= 200.0
                  if (Regex("\\d{4}-\\d{2}-\\d{2}").containsMatchIn(l) || Regex("-\\d{8}$").containsMatchIn(l)) s -= 50.0
                  if (l.contains("lite") || l.contains("nano") || l.contains("tiny") || l.contains("micro")) s -= 150.0
                  if (l.contains("latest")) s += 30.0
                  if (l.contains("gemma")) s -= 5000.0
                  if (l.contains("-pro") && p.id == "openai") s -= 300.0
                  if (l.contains("mini") && p.id != "google") s -= 20.0
                  return s
              }

              fun supportsVision(p: Provider, id: String): Boolean {
                  val l = id.lowercase()
                  if (p.kind == Providers.KIND_GEMINI) return !l.contains("gemma")
                  if (p.kind == Providers.KIND_ANTHROPIC) return true
                  val keys = listOf("gpt-4o", "gpt-4.1", "gpt-5", "gpt-4-turbo", "o1", "o3", "o4", "vision", "-vl", "vl-", "llava",
                      "llama-4", "gemini", "claude", "pixtral", "grok-4", "grok-2-vision", "kimi", "qwen2.5-vl", "qwen-vl", "mistral-medium", "mistral-large", "mistral-small-3", "sonar")
                  for (k in keys) {
                      if (l.contains(k)) return true
                  }
                  return false
              }

              /** Listeden görüntü destekleyen en iyi modeli seçer; yoksa null. */
              fun bestVision(p: Provider, ids: List<String>): String? {
                  for (id in rank(p, ids)) {
                      if (supportsVision(p, id)) return id
                  }
                  return null
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/NotifStore.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/NotifStore.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Notification
          import android.app.RemoteInput
          import android.content.Intent
          import android.os.Bundle
          import android.service.notification.StatusBarNotification
          import java.util.concurrent.CopyOnWriteArrayList

          /** Son bildirimlerin hafif kaydı: okuma, yanıtlama (RemoteInput) ve kapatma. */
          object NotifStore {
              class Entry(val key: String, val pkg: String, val app: String, val title: String, val text: String, val time: Long, val canReply: Boolean)

              private val list = CopyOnWriteArrayList<Entry>()
              private val speakApps = setOf("com.whatsapp", "com.whatsapp.w4b", "org.telegram.messenger", "com.google.android.apps.messaging", "com.samsung.android.messaging", "com.instagram.android", "com.facebook.orca")

              private fun hasReply(n: Notification): Boolean {
                  val acts = n.actions ?: return false
                  for (a in acts) {
                      val ris = a.remoteInputs
                      if (ris != null && ris.isNotEmpty()) return true
                  }
                  return false
              }

              fun add(sbn: StatusBarNotification) {
                  try {
                      if (sbn.packageName == NovaxApp.instance.packageName) return
                      val n = sbn.notification
                      if ((n.flags and Notification.FLAG_ONGOING_EVENT) != 0) return
                      if ((n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return
                      val ex = n.extras
                      val title = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                      val big = ex.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString()
                      val text = big ?: (ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: "")
                      if (title.isBlank() && text.isBlank()) return
                      val pm = NovaxApp.instance.packageManager
                      val app = try {
                          pm.getApplicationLabel(pm.getApplicationInfo(sbn.packageName, 0)).toString()
                      } catch (_: Exception) {
                          sbn.packageName
                      }
                      val e = Entry(sbn.key, sbn.packageName, app, title, text, sbn.postTime, hasReply(n))
                      val old = ArrayList<Entry>()
                      for (x in list) {
                          if (x.key == e.key) old.add(x)
                      }
                      list.removeAll(old.toSet())
                      list.add(e)
                      while (list.size > 120) list.removeAt(0)
                      if (Prefs.readNotifs) announce(e)
                  } catch (ex: Exception) {
                      AppLog.e("notif", "bildirim işlenemedi", ex)
                  }
              }

              private fun announce(e: Entry) {
                  if (!speakApps.contains(e.pkg)) return
                  if (Voice.speaking || Bus.current != OrbState.IDLE) return
                  Voice.speak(e.app + ": " + e.title + " yazdı. " + Text.clip(e.text, 160))
              }

              fun recent(count: Int, pkgFilter: String): List<Entry> {
                  val f = pkgFilter.trim().lowercase()
                  val out = ArrayList<Entry>()
                  for (e in list.reversed()) {
                      if (f.isEmpty() || e.pkg.lowercase().contains(f) || e.app.lowercase().contains(f)) out.add(e)
                      if (out.size >= count) break
                  }
                  return out
              }

              fun read(count: Int, pkgFilter: String): String {
                  if (NovaxNotifListener.instance == null) return "HATA: Bildirim erişimi kapalı. Ayarlar > İzinler > Bildirim erişimi."
                  val items = recent(count.coerceIn(1, 20), pkgFilter)
                  if (items.isEmpty()) return "Bildirim yok."
                  val sb = StringBuilder()
                  for (i in items.indices) {
                      val e = items[i]
                      sb.append(i + 1).append(". ").append(e.app).append(": ").append(e.title).append(" — ").append(Text.clip(e.text, 140))
                      if (e.canReply) sb.append(" [yanıtlanabilir]")
                      sb.append('\n')
                  }
                  return sb.toString().trim()
              }

              private fun pick(index: Int, pkgFilter: String): Entry? {
                  val items = recent(30, pkgFilter)
                  if (index < 1 || index > items.size) return null
                  return items[index - 1]
              }

              fun reply(index: Int, pkgFilter: String, text: String): String {
                  val l = NovaxNotifListener.instance ?: return "HATA: Bildirim erişimi kapalı."
                  val e = pick(index, pkgFilter) ?: return "HATA: " + index + ". bildirim yok."
                  val sbn = l.activeNotifications.firstOrNull { it.key == e.key } ?: return "HATA: bildirim artık açık değil."
                  val acts = sbn.notification.actions ?: return "HATA: bu bildirim yanıtlanamıyor."
                  for (a in acts) {
                      val ris = a.remoteInputs
                      if (ris != null && ris.isNotEmpty()) {
                          val intent = Intent()
                          val b = Bundle()
                          for (ri in ris) b.putCharSequence(ri.resultKey, text)
                          RemoteInput.addResultsToIntent(ris, intent, b)
                          return try {
                              a.actionIntent.send(NovaxApp.instance, 0, intent)
                              e.app + " bildirimine yanıt gönderildi."
                          } catch (ex: Exception) {
                              "HATA: yanıt gönderilemedi: " + ex.message
                          }
                      }
                  }
                  return "HATA: bu bildirimde yanıt alanı yok."
              }

              fun dismiss(index: Int, pkgFilter: String): String {
                  val l = NovaxNotifListener.instance ?: return "HATA: Bildirim erişimi kapalı."
                  val e = pick(index, pkgFilter) ?: return "HATA: " + index + ". bildirim yok."
                  return try {
                      l.cancelNotification(e.key)
                      "Bildirim kapatıldı."
                  } catch (ex: Exception) {
                      "HATA: " + ex.message
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/NovaxAccessibilityService.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/NovaxAccessibilityService.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.Looper
          import android.os.SystemClock
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.view.accessibility.AccessibilityWindowInfo
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /**
           * Ekran kontrolünün kalbi: ekranı okur, dokunur, kaydırır, yazar, ekran görüntüsü alır.
           * Tüm bloklayan çağrılar (bekleme, hareket) ana thread DIŞINDAN yapılmalıdır.
           */
          class NovaxAccessibilityService : AccessibilityService() {

              class ShotResult(val bitmap: Bitmap?, val error: Int)

              companion object {
                  @Volatile var instance: NovaxAccessibilityService? = null
                  @Volatile var lastPackage: String = ""
                  @Volatile var lastEventAt: Long = 0L
                  val connected: Boolean get() = instance != null
              }

              override fun onServiceConnected() {
                  instance = this
                  AppLog.i("acc", "Erişilebilirlik servisi bağlandı")
                  Bus.log("Erişilebilirlik servisi bağlandı")
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  if (e == null) return
                  lastEventAt = SystemClock.uptimeMillis()
                  val p = e.packageName?.toString() ?: return
                  if (e.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED && p != packageName) lastPackage = p
              }

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              // ------------------------------------------------------------------ ağaç gezme
              fun roots(): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  val ra = rootInActiveWindow
                  if (ra != null) out.add(ra)
                  try {
                      for (w in windows) {
                          val r = w.root
                          if (r != null && out.none { it == r }) out.add(r)
                      }
                  } catch (_: Exception) {
                  }
                  return out
              }

              /** Yalnızca klavye (IME) pencerelerinin kökleri. */
              fun imeRoots(): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  try {
                      for (w in windows) {
                          if (w.type == AccessibilityWindowInfo.TYPE_INPUT_METHOD) {
                              val r = w.root
                              if (r != null) out.add(r)
                          }
                      }
                  } catch (_: Exception) {
                  }
                  return out
              }

              /** Klavye hariç uygulama pencerelerinin kökleri. */
              fun appRoots(): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  try {
                      for (w in windows) {
                          if (w.type == AccessibilityWindowInfo.TYPE_INPUT_METHOD) continue
                          val r = w.root
                          if (r != null) out.add(r)
                      }
                  } catch (_: Exception) {
                  }
                  if (out.isEmpty()) {
                      val ra = rootInActiveWindow
                      if (ra != null) out.add(ra)
                  }
                  return out
              }

              fun walkTree(n: AccessibilityNodeInfo?, depth: Int, f: (AccessibilityNodeInfo, Int) -> Boolean) {
                  if (n == null || depth > 45) return
                  if (!f(n, depth)) return
                  for (i in 0 until n.childCount) walkTree(n.getChild(i), depth + 1, f)
              }

              private fun label(n: AccessibilityNodeInfo): String = Text.norm(n.text?.toString() ?: "")
              private fun desc(n: AccessibilityNodeInfo): String = Text.norm(n.contentDescription?.toString() ?: "")
              private fun hint(n: AccessibilityNodeInfo): String = Text.norm(n.hintText?.toString() ?: "")

              /** Metin / içerik açıklaması / ipucu ile düğüm bulur; tam eşleşmeler ve kısa metinler önce gelir. */
              fun findAll(query: String, exact: Boolean = false): List<AccessibilityNodeInfo> {
                  val q = Text.norm(query)
                  if (q.isEmpty()) return emptyList()
                  val hits = ArrayList<Pair<Int, AccessibilityNodeInfo>>()
                  for (r in appRoots()) {
                      walkTree(r, 0) { n, _ ->
                          if (n.isVisibleToUser) {
                              val t = label(n)
                              val d = desc(n)
                              val h = hint(n)
                              val eq = t == q || d == q || h == q
                              val contains = t.contains(q) || d.contains(q) || h.contains(q)
                              if (eq || (!exact && contains)) {
                                  val len = maxOf(t.length, maxOf(d.length, h.length))
                                  val score = if (eq) 0 else 1000 + len
                                  hits.add(Pair(score, n))
                              }
                          }
                          true
                      }
                  }
                  return hits.sortedBy { it.first }.map { it.second }
              }

              fun findByViewId(id: String): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  for (r in roots()) out.addAll(r.findAccessibilityNodeInfosByViewId(id))
                  return out
              }

              // ------------------------------------------------------------------ eylemler
              fun clickNode(n: AccessibilityNodeInfo): Boolean {
                  var cur: AccessibilityNodeInfo? = n
                  var hops = 0
                  while (cur != null && hops < 7) {
                      if (cur.isClickable && cur.isEnabled && cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
                      cur = cur.parent
                      hops++
                  }
                  val r = Rect()
                  n.getBoundsInScreen(r)
                  return if (!r.isEmpty) tap(r.exactCenterX(), r.exactCenterY()) else false
              }

              fun clickText(q: String, exact: Boolean = false): Boolean {
                  val n = findAll(q, exact).firstOrNull() ?: return false
                  return clickNode(n)
              }

              fun tap(x: Float, y: Float, hold: Long = 40L): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  return gesture(p, hold)
              }

              fun longPress(x: Float, y: Float, ms: Long): Boolean {
                  val p = Path()
                  p.moveTo(x, y)
                  return gesture(p, ms)
              }

              fun swipe(x1: Float, y1: Float, x2: Float, y2: Float, dur: Long = 220L): Boolean {
                  val p = Path()
                  p.moveTo(x1, y1)
                  p.lineTo(x2, y2)
                  return gesture(p, dur)
              }

              fun screenW(): Float = resources.displayMetrics.widthPixels.toFloat()
              fun screenH(): Float = resources.displayMetrics.heightPixels.toFloat()

              fun scroll(direction: String): Boolean {
                  val w = screenW()
                  val h = screenH()
                  return when (direction.lowercase()) {
                      "down", "asagi", "aşağı" -> swipe(w / 2, h * 0.72f, w / 2, h * 0.28f, 200L)
                      "up", "yukari", "yukarı" -> swipe(w / 2, h * 0.28f, w / 2, h * 0.72f, 200L)
                      "left", "sola" -> swipe(w * 0.85f, h / 2, w * 0.15f, h / 2, 200L)
                      "right", "saga", "sağa" -> swipe(w * 0.15f, h / 2, w * 0.85f, h / 2, 200L)
                      else -> false
                  }
              }

              private fun gesture(p: Path, dur: Long): Boolean {
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0L, dur)).build()
                  val onMain = Looper.myLooper() == Looper.getMainLooper()
                  val latch = CountDownLatch(1)
                  val okFlag = BooleanArray(1)
                  val cb = object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          okFlag[0] = true
                          latch.countDown()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          latch.countDown()
                      }
                  }
                  if (!dispatchGesture(g, cb, null)) return false
                  if (onMain) return true
                  latch.await(dur + 2500L, TimeUnit.MILLISECONDS)
                  return okFlag[0]
              }

              fun focusedInput(): AccessibilityNodeInfo? {
                  for (r in appRoots()) {
                      val f = r.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                      if (f != null && f.isEditable) return f
                  }
                  val holder = arrayOfNulls<AccessibilityNodeInfo>(1)
                  for (r in appRoots()) {
                      walkTree(r, 0) { n, _ ->
                          if (holder[0] == null && n.isEditable && n.isVisibleToUser) holder[0] = n
                          true
                      }
                  }
                  return holder[0]
              }

              fun typeText(text: String, append: Boolean = false): Boolean {
                  val node = focusedInput() ?: return false
                  val cur = if (append) (node.text?.toString() ?: "") else ""
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, cur + text)
                  if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) return true
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("novax", text))
                  node.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  return node.performAction(AccessibilityNodeInfo.ACTION_PASTE)
              }

              fun pressEnter(): Boolean {
                  val node = focusedInput() ?: return false
                  if (Build.VERSION.SDK_INT >= 30) {
                      if (node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)) return true
                  }
                  return clickText("ara", true) || clickText("search", true) || clickText("git", true) || clickText("gonder", true)
              }

              fun global(name: String): Boolean {
                  val a: Int = when (name.lowercase().trim()) {
                      "back", "geri" -> GLOBAL_ACTION_BACK
                      "home", "ana ekran" -> GLOBAL_ACTION_HOME
                      "recents", "son uygulamalar" -> GLOBAL_ACTION_RECENTS
                      "notifications", "bildirimler" -> GLOBAL_ACTION_NOTIFICATIONS
                      "quick_settings", "hizli ayarlar" -> GLOBAL_ACTION_QUICK_SETTINGS
                      "power", "guc" -> GLOBAL_ACTION_POWER_DIALOG
                      "lock", "kilit" -> GLOBAL_ACTION_LOCK_SCREEN
                      "screenshot" -> GLOBAL_ACTION_TAKE_SCREENSHOT
                      else -> -1
                  }
                  if (a == -1) return false
                  return performGlobalAction(a)
              }

              fun scrollContainer(forward: Boolean): Boolean {
                  val holder = arrayOfNulls<AccessibilityNodeInfo>(1)
                  for (r in appRoots()) {
                      walkTree(r, 0) { n, _ ->
                          if (holder[0] == null && n.isScrollable && n.isVisibleToUser) holder[0] = n
                          true
                      }
                  }
                  val t = holder[0] ?: return false
                  return t.performAction(if (forward) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD)
              }

              fun waitForText(q: String, timeoutMs: Long): Boolean {
                  val end = SystemClock.uptimeMillis() + timeoutMs
                  while (SystemClock.uptimeMillis() < end) {
                      if (findAll(q).isNotEmpty()) return true
                      Thread.sleep(250)
                  }
                  return false
              }

              fun waitForPackage(pkg: String, timeoutMs: Long): Boolean {
                  val end = SystemClock.uptimeMillis() + timeoutMs
                  while (SystemClock.uptimeMillis() < end) {
                      if (rootInActiveWindow?.packageName?.toString() == pkg || lastPackage == pkg) return true
                      Thread.sleep(200)
                  }
                  return false
              }

              fun activePackage(): String = rootInActiveWindow?.packageName?.toString() ?: lastPackage

              // ------------------------------------------------------------------ ekran görüntüsü (ham)
              fun takeScreenshotRaw(): ShotResult {
                  if (Build.VERSION.SDK_INT < 30) return ShotResult(null, -100)
                  val latch = CountDownLatch(1)
                  val holder = arrayOfNulls<Bitmap>(1)
                  val err = IntArray(1)
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                          override fun onSuccess(result: ScreenshotResult) {
                              try {
                                  val hb = result.hardwareBuffer
                                  val b = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                                  holder[0] = b?.copy(Bitmap.Config.ARGB_8888, false)
                                  hb.close()
                              } catch (e: Exception) {
                                  err[0] = 1
                              }
                              latch.countDown()
                          }

                          override fun onFailure(errorCode: Int) {
                              err[0] = errorCode
                              latch.countDown()
                          }
                      })
                  } catch (e: Exception) {
                      AppLog.e("acc", "takeScreenshot istisna", e)
                      return ShotResult(null, 1)
                  }
                  latch.await(6, TimeUnit.SECONDS)
                  return ShotResult(holder[0], err[0])
              }
          }
          NOVAX_EOF

