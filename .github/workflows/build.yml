          cat > app/src/main/java/com/novax/assistant/Search.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /** Web araması: Gemini ise Google grounding, değilse DuckDuckGo + model özeti. */
          object Search {
              fun web(query: String): String {
                  val c = Llm.client()
                  if (c is GeminiClient) return c.searchGrounded(query)
                  val raw = Web.duck(query)
                  if (raw.startsWith("HATA") || raw.startsWith("Sonuç")) return raw
                  return raw
              }

              /** Kısa, sesli okunacak cevap. */
              fun answer(query: String): String {
                  val c = Llm.client()
                  if (c is GeminiClient) return c.searchGrounded(query)
                  val raw = Web.duck(query)
                  if (raw.startsWith("HATA") || raw.startsWith("Sonuç")) return raw
                  return Llm.simple(
                      "Aşağıdaki arama sonuçlarına dayanarak soruyu Türkçe, en fazla 4 cümleyle, markdown kullanmadan cevapla.",
                      "Soru: " + query + "\n\nSonuçlar:\n" + raw
                  )
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/SecureStore.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/SecureStore.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          /** Android Keystore (AES-GCM) ile şifreli küçük sırlar: telefon PIN'i gibi. */
          object SecureStore {
              private const val ALIAS = "novax_secure_key"
              private const val PREFS = "novax_secure"

              private fun key(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore")
                  ks.load(null)
                  val existing = ks.getKey(ALIAS, null)
                  if (existing != null) return existing as SecretKey
                  val kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  val spec = KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                      .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                      .setKeySize(256)
                      .build()
                  kg.init(spec)
                  return kg.generateKey()
              }

              private fun sp() = NovaxApp.instance.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun put(name: String, value: String) {
                  try {
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.ENCRYPT_MODE, key())
                      val ct = c.doFinal(value.toByteArray(Charsets.UTF_8))
                      val iv = c.iv
                      val packed = Base64.encodeToString(iv, Base64.NO_WRAP) + ":" + Base64.encodeToString(ct, Base64.NO_WRAP)
                      sp().edit().putString(name, packed).apply()
                  } catch (e: Exception) {
                      AppLog.e("secure", "put başarısız", e)
                  }
              }

              fun get(name: String): String {
                  val packed = sp().getString(name, null) ?: return ""
                  return try {
                      val parts = packed.split(":")
                      if (parts.size != 2) return ""
                      val iv = Base64.decode(parts[0], Base64.NO_WRAP)
                      val ct = Base64.decode(parts[1], Base64.NO_WRAP)
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, iv))
                      String(c.doFinal(ct), Charsets.UTF_8)
                  } catch (e: Exception) {
                      AppLog.e("secure", "get başarısız", e)
                      ""
                  }
              }

              fun has(name: String): Boolean = sp().contains(name)

              fun remove(name: String) {
                  sp().edit().remove(name).apply()
              }
          }
          NOVAX_EOF

