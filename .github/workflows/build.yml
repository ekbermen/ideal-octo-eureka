      - name: Yaz app/src/main/java/com/novax/assistant/Ui.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Ui.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.text.InputType
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          /** HUD temalı hazır bileşenler (XML yok, her şey kodla). */
          object Ui {
              val CYAN: Int = Color.parseColor("#00E5FF")
              val CYAN_DIM: Int = Color.parseColor("#0097A7")
              val AMBER: Int = Color.parseColor("#FFB300")
              val RED: Int = Color.parseColor("#FF3D3D")
              val GREEN: Int = Color.parseColor("#00E676")
              val PANEL: Int = Color.parseColor("#0A1B2A")
              val MONO: Typeface = Typeface.MONOSPACE

              fun dp(ctx: Context, v: Float): Int = (v * ctx.resources.displayMetrics.density + 0.5f).toInt()

              fun box(ctx: Context, fill: Int, stroke: Int, radiusDp: Float = 10f, strokeDp: Float = 1f): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dp(ctx, radiusDp).toFloat()
                  g.setStroke(dp(ctx, strokeDp), stroke)
                  return g
              }

              fun text(ctx: Context, s: String, sizeSp: Float = 14f, color: Int = CYAN, bold: Boolean = false): TextView {
                  val t = TextView(ctx)
                  t.text = s
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sizeSp)
                  t.setTextColor(color)
                  t.typeface = if (bold) Typeface.create(MONO, Typeface.BOLD) else MONO
                  return t
              }

              fun button(ctx: Context, label: String, color: Int = CYAN, onClick: (View) -> Unit): Button {
                  val b = Button(ctx)
                  b.text = label
                  b.isAllCaps = false
                  b.setTextColor(color)
                  b.typeface = MONO
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                  b.background = box(ctx, Color.parseColor("#0B2233"), color, 8f)
                  b.minHeight = 0
                  b.minimumHeight = 0
                  b.setPadding(dp(ctx, 14f), dp(ctx, 8f), dp(ctx, 14f), dp(ctx, 8f))
                  b.stateListAnimator = null
                  b.setOnClickListener { v -> onClick(v) }
                  return b
              }

              fun edit(ctx: Context, hint: String, value: String = "", password: Boolean = false): EditText {
                  val e = EditText(ctx)
                  e.hint = hint
                  e.setText(value)
                  e.setTextColor(CYAN)
                  e.setHintTextColor(Color.parseColor("#4400E5FF"))
                  e.typeface = MONO
                  e.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                  e.background = box(ctx, Color.parseColor("#06121C"), CYAN_DIM, 8f)
                  e.setPadding(dp(ctx, 12f), dp(ctx, 10f), dp(ctx, 12f), dp(ctx, 10f))
                  e.isSingleLine = true
                  if (password) e.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  return e
              }

              fun lp(w: Int = ViewGroup.LayoutParams.MATCH_PARENT, h: Int = ViewGroup.LayoutParams.WRAP_CONTENT, weight: Float = 0f): LinearLayout.LayoutParams =
                  LinearLayout.LayoutParams(w, h, weight)

              fun margins(p: LinearLayout.LayoutParams, ctx: Context, l: Float, t: Float, r: Float, b: Float): LinearLayout.LayoutParams {
                  p.setMargins(dp(ctx, l), dp(ctx, t), dp(ctx, r), dp(ctx, b))
                  return p
              }

              fun section(ctx: Context, title: String): TextView {
                  val t = text(ctx, "◤ $title", 12f, AMBER, true)
                  t.letterSpacing = 0.15f
                  t.setPadding(0, dp(ctx, 18f), 0, dp(ctx, 6f))
                  return t
              }

              fun panel(ctx: Context): LinearLayout {
                  val l = LinearLayout(ctx)
                  l.orientation = LinearLayout.VERTICAL
                  l.background = box(ctx, Color.parseColor("#0A1B2A"), Color.parseColor("#33005F73"), 10f)
                  l.setPadding(dp(ctx, 12f), dp(ctx, 10f), dp(ctx, 12f), dp(ctx, 10f))
                  return l
              }

              fun center(v: View): View {
                  (v as? TextView)?.gravity = Gravity.CENTER
                  return v
              }

              fun check(ctx: Context, label: String, on: Boolean): android.widget.CheckBox {
                  val c = android.widget.CheckBox(ctx)
                  c.text = label
                  c.isChecked = on
                  c.setTextColor(CYAN)
                  c.typeface = MONO
                  c.buttonTintList = android.content.res.ColorStateList.valueOf(CYAN)
                  return c
              }

              fun hint(ctx: Context, s: String): TextView {
                  val t = text(ctx, s, 11f, CYAN_DIM)
                  t.setPadding(0, dp(ctx, 2f), 0, dp(ctx, 6f))
                  return t
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Voice.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Voice.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioAttributes
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import java.io.File
          import java.util.Locale
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /**
           * Ses motoru: uyandırma kelimesi, komut dinleme, tek seferlik yakalama (CAPTURE), TTS ve TTS->dosya.
           * Tanıma ve TTS çağrıları ana thread'de çalışır; bekleyen yardımcılar (speakAndWait, captureOnce) iş parçacığında bloklar.
           */
          object Voice : RecognitionListener {
              enum class Mode { OFF, WAKE, COMMAND, CAPTURE }

              private lateinit var app: Context
              private val main = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var rec: SpeechRecognizer? = null
              private var inited = false
              private var afterSpeech: (() -> Unit)? = null
              private var errorStreak = 0
              private val fileLatches = ConcurrentHashMap<String, CountDownLatch>()
              private var fileCounter = 0

              // CAPTURE durumu
              private var prevMode: Mode = Mode.OFF
              private var capLatch: CountDownLatch? = null
              private val capHolder = arrayOfNulls<String>(1)
              @Volatile private var capActive = false
              @Volatile private var capDeadline = 0L

              @Volatile
              var mode: Mode = Mode.OFF

              @Volatile
              var speaking: Boolean = false

              fun init(ctx: Context) {
                  if (inited) return
                  inited = true
                  app = ctx.applicationContext
                  tts = TextToSpeech(app) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          ttsReady = true
                          applyLanguage()
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}

                              override fun onDone(utteranceId: String?) {
                                  handleUtteranceEnd(utteranceId)
                              }

                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) {
                                  handleUtteranceEnd(utteranceId)
                              }
                          })
                      } else {
                          Bus.log("TTS başlatılamadı")
                      }
                  }
              }

              private fun handleUtteranceEnd(id: String?) {
                  if (id == null) return
                  if (id.startsWith("last")) {
                      finishSpeech()
                  } else if (id.startsWith("file")) {
                      val l = fileLatches.remove(id)
                      if (l != null) l.countDown()
                  }
              }

              fun applyLanguage() {
                  val loc = Locale.forLanguageTag(Prefs.lang)
                  val r = tts?.setLanguage(loc)
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) Bus.log("TTS dili desteklenmiyor: " + Prefs.lang)
                  tts?.setSpeechRate(Prefs.rate)
                  tts?.setPitch(Prefs.pitch)
              }

              /** Görüşme sırasında sesi iletişim kanalına verir; normalde medya kanalı. */
              fun setCallAudio(on: Boolean) {
                  val usage = if (on) AudioAttributes.USAGE_VOICE_COMMUNICATION else AudioAttributes.USAGE_MEDIA
                  val aa = AudioAttributes.Builder().setUsage(usage).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build()
                  tts?.setAudioAttributes(aa)
              }

              // ------------------------------------------------------------------ konuşma
              fun speak(text: String, then: (() -> Unit)? = null) {
                  val clean = Text.stripMarkdown(text).replace(Regex("https?://\\S+"), "bağlantı").trim()
                  if (clean.isEmpty()) {
                      then?.invoke()
                      return
                  }
                  if (!Prefs.ttsOn || !ttsReady) {
                      Bus.setState(OrbState.IDLE)
                      then?.invoke()
                      main.post { resume() }
                      return
                  }
                  main.post {
                      destroyRec()
                      speaking = true
                      afterSpeech = then
                      Bus.setState(OrbState.SPEAKING)
                      val parts = splitForTts(clean)
                      for (i in parts.indices) {
                          val id = if (i == parts.lastIndex) "last" + i else "part" + i
                          val queueMode = if (i == 0) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD
                          tts?.speak(parts[i], queueMode, null, id)
                      }
                  }
              }

              /** Konuşma bitene kadar bloklar (ana thread dışında çağır). */
              fun speakAndWait(text: String, maxMs: Long = 60000L) {
                  val latch = CountDownLatch(1)
                  speak(text) { latch.countDown() }
                  try {
                      latch.await(maxMs, TimeUnit.MILLISECONDS)
                  } catch (_: InterruptedException) {
                  }
              }

              private fun splitForTts(s: String): List<String> {
                  val out = ArrayList<String>()
                  val sb = StringBuilder()
                  for (sentence in s.split(Regex("(?<=[.!?\\n])\\s+"))) {
                      if (sb.length + sentence.length > 1200 && sb.isNotEmpty()) {
                          out.add(sb.toString())
                          sb.setLength(0)
                      }
                      sb.append(sentence).append(' ')
                  }
                  if (sb.isNotBlank()) out.add(sb.toString().trim())
                  return if (out.isEmpty()) listOf(s) else out
              }

              private fun finishSpeech() {
                  main.post {
                      speaking = false
                      Bus.setState(OrbState.IDLE)
                      val cb = afterSpeech
                      afterSpeech = null
                      cb?.invoke()
                      resume()
                  }
              }

              fun stopSpeaking() {
                  main.post {
                      tts?.stop()
                      if (speaking) finishSpeech()
                  }
              }

              /** Metni ses dosyasına çevirir (WhatsApp sesli mesajı için). Başarılıysa true. */
              fun synthToFile(text: String, file: File, timeoutMs: Long): Boolean {
                  if (!ttsReady) return false
                  val t = tts ?: return false
                  val id = "file" + (fileCounter++)
                  val latch = CountDownLatch(1)
                  fileLatches[id] = latch
                  val r = t.synthesizeToFile(Text.stripMarkdown(text), null, file, id)
                  if (r != TextToSpeech.SUCCESS) {
                      fileLatches.remove(id)
                      return false
                  }
                  try {
                      latch.await(timeoutMs, TimeUnit.MILLISECONDS)
                  } catch (_: InterruptedException) {
                  }
                  fileLatches.remove(id)
                  return file.exists() && file.length() > 1000L
              }

              // ------------------------------------------------------------------ dinleme
              fun startWake() {
                  main.post {
                      if (mode != Mode.COMMAND && mode != Mode.CAPTURE) {
                          mode = Mode.WAKE
                          errorStreak = 0
                          startRec()
                      }
                  }
              }

              fun listenOnce() {
                  main.post {
                      tts?.stop()
                      speaking = false
                      afterSpeech = null
                      mode = Mode.COMMAND
                      errorStreak = 0
                      startRec()
                  }
              }

              /**
               * Tek cümle dinleyip metni döner (ana thread dışında çağır). timeoutMs içinde konuşma olmazsa "" döner.
               * Uyandırma döngüsünü geçici olarak durdurur ve sonra geri getirir.
               */
              fun captureOnce(timeoutMs: Long): String {
                  val latch = CountDownLatch(1)
                  synchronized(capHolder) { capHolder[0] = "" }
                  main.post {
                      if (mode != Mode.CAPTURE) prevMode = mode
                      mode = Mode.CAPTURE
                      capLatch = latch
                      capActive = true
                      capDeadline = SystemClock.uptimeMillis() + timeoutMs
                      errorStreak = 0
                      startRec()
                  }
                  try {
                      latch.await(timeoutMs + 2000L, TimeUnit.MILLISECONDS)
                  } catch (_: InterruptedException) {
                  }
                  main.post {
                      capActive = false
                      capLatch = null
                      if (mode == Mode.CAPTURE) {
                          mode = prevMode
                          destroyRec()
                          Bus.setState(OrbState.IDLE)
                          if (mode == Mode.WAKE) resume()
                      }
                  }
                  var res = ""
                  synchronized(capHolder) { res = capHolder[0] ?: "" }
                  return res
              }

              private fun finishCapture(text: String) {
                  synchronized(capHolder) { capHolder[0] = text }
                  capActive = false
                  val l = capLatch
                  if (l != null) l.countDown()
              }

              fun stopAll() {
                  main.post {
                      mode = Mode.OFF
                      if (capActive) finishCapture("")
                      destroyRec()
                      Bus.setState(OrbState.IDLE)
                  }
              }

              private fun resume() {
                  if (mode == Mode.WAKE) main.postDelayed({ startRec() }, 350L)
              }

              private fun backToIdleMode() {
                  mode = if (Prefs.wakeOn && NovaxService.running) Mode.WAKE else Mode.OFF
              }

              private fun startRec() {
                  main.post {
                      if (speaking || mode == Mode.OFF) return@post
                      if (mode == Mode.CAPTURE && !capActive) return@post
                      if (app.checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          Bus.log("Mikrofon izni yok")
                          if (capActive) finishCapture("")
                          mode = Mode.OFF
                          return@post
                      }
                      if (!SpeechRecognizer.isRecognitionAvailable(app)) {
                          Bus.log("Cihazda konuşma tanıma servisi yok")
                          if (capActive) finishCapture("")
                          mode = Mode.OFF
                          return@post
                      }
                      destroyRec()
                      val r = SpeechRecognizer.createSpeechRecognizer(app)
                      r.setRecognitionListener(Voice)
                      rec = r
                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Prefs.lang)
                      i.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      i.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      i.putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, app.packageName)
                      try {
                          r.startListening(i)
                          Bus.setState(OrbState.LISTENING)
                      } catch (e: Exception) {
                          Bus.log("Dinleme başlatılamadı: " + e.message)
                          retry(1500L)
                      }
                  }
              }

              private fun destroyRec() {
                  try { rec?.cancel() } catch (_: Exception) {}
                  try { rec?.destroy() } catch (_: Exception) {}
                  rec = null
              }

              private fun retry(delay: Long) {
                  errorStreak++
                  val d = if (errorStreak > 5) 5000L else delay
                  main.postDelayed({
                      if (mode != Mode.OFF && !speaking) startRec()
                  }, d)
              }

              // ------------------------------------------------------------------ uyandırma kelimesi
              private fun wakeRegex(): Regex {
                  val w = Prefs.wakeWord.trim().lowercase()
                  val body = if (w == "novax" || w == "nova") "no+\\s?v[ae]+\\s?(?:x|ks|cks)?"
                  else Regex.escape(w).replace(" ", "\\s+")
                  return Regex("(?i)\\b" + body + "\\b")
              }

              private fun handleHeard(raw: String) {
                  val t = raw.trim()
                  if (mode == Mode.CAPTURE) {
                      if (t.isEmpty() && SystemClock.uptimeMillis() < capDeadline) {
                          retry(150L)
                      } else {
                          finishCapture(t)
                      }
                      return
                  }
                  if (t.isEmpty()) {
                      errorStreak = 0
                      if (mode == Mode.COMMAND) {
                          backToIdleMode()
                          Bus.setState(OrbState.IDLE)
                      }
                      resume()
                      return
                  }
                  errorStreak = 0
                  when (mode) {
                      Mode.COMMAND -> {
                          backToIdleMode()
                          Brain.handle(t)
                      }
                      Mode.WAKE -> {
                          val m = wakeRegex().find(t)
                          if (m == null) {
                              startRec()
                              return
                          }
                          val rest = t.substring(m.range.last + 1).trim().trimStart(',', '.', ':', ' ')
                          val before = t.substring(0, m.range.first).replace(Regex("(?i)\\b(hey|ey|tamam|merhaba|selam)\\b"), "").trim()
                          val cmd = if (rest.length >= 2) rest else before
                          if (cmd.length >= 2) {
                              Brain.handle(cmd)
                          } else {
                              mode = Mode.COMMAND
                              speak("Efendim?") { startRec() }
                          }
                      }
                      else -> {}
                  }
              }

              override fun onResults(results: Bundle?) {
                  val list = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                  handleHeard(list?.firstOrNull() ?: "")
              }

              override fun onPartialResults(partialResults: Bundle?) {
                  val p = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: return
                  if (mode == Mode.COMMAND || mode == Mode.CAPTURE) Bus.partial(p)
              }

              override fun onError(error: Int) {
                  when (error) {
                      SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> {
                          if (capActive) finishCapture("")
                          mode = Mode.OFF
                          Bus.log("Mikrofon izni verilmemiş")
                          Bus.setState(OrbState.ERROR)
                      }
                      SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> retry(1200L)
                      SpeechRecognizer.ERROR_CLIENT -> retry(600L)
                      SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> {
                          if (mode == Mode.CAPTURE) {
                              if (SystemClock.uptimeMillis() < capDeadline) retry(150L) else finishCapture("")
                          } else if (mode == Mode.COMMAND) {
                              backToIdleMode()
                              Bus.setState(OrbState.IDLE)
                              Bus.partial("")
                              resume()
                          } else {
                              errorStreak = 0
                              retry(150L)
                          }
                      }
                      else -> retry(1500L)
                  }
              }

              override fun onRmsChanged(rmsdB: Float) { Bus.level(((rmsdB + 2f) / 12f).coerceIn(0f, 1f)) }
              override fun onReadyForSpeech(params: Bundle?) {}
              override fun onBeginningOfSpeech() {}
              override fun onBufferReceived(buffer: ByteArray?) {}
              override fun onEndOfSpeech() { Bus.level(0f) }
              override fun onEvent(eventType: Int, params: Bundle?) {}
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/WaveView.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/WaveView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.sin

          /** Konuşma/dinleme sırasında hareket eden ses çubukları. */
          class WaveView(ctx: Context) : View(ctx) {
              var state: OrbState = OrbState.IDLE
              var level: Float = 0f
              private val dn = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bars = 36
              private val hs = FloatArray(bars)
              private var t = 0f
              private var last = 0L

              override fun onDraw(c: Canvas) {
                  val now = System.nanoTime()
                  val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.05f)
                  last = now
                  t += dt
                  val amp = when (state) {
                      OrbState.LISTENING -> 0.15f + level * 0.85f
                      OrbState.SPEAKING -> 0.55f
                      OrbState.THINKING -> 0.25f
                      OrbState.ERROR -> 0.1f
                      OrbState.IDLE -> 0.06f
                  }
                  val bw = width / bars.toFloat()
                  p.style = Paint.Style.FILL
                  p.color = when (state) {
                      OrbState.THINKING -> 0xFFFFB300.toInt()
                      OrbState.ERROR -> 0xFFFF3D3D.toInt()
                      else -> 0xFF00E5FF.toInt()
                  }
                  for (i in 0 until bars) {
                      val env = 0.35f + 0.65f * (1f - abs(i - bars / 2f) / (bars / 2f))
                      val v = abs(sin(t * 6f + i * 0.7f) * 0.6f + sin(t * 3.3f + i * 1.3f) * 0.4f)
                      hs[i] += (amp * env * v - hs[i]) * 0.3f
                      val bh = (height * (0.06f + hs[i] * 0.94f)).coerceAtLeast(2f * dn)
                      val x = i * bw + bw * 0.2f
                      c.drawRoundRect(x, (height - bh) / 2f, x + bw * 0.6f, (height + bh) / 2f, 2f * dn, 2f * dn, p)
                  }
                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Web.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Web.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.net.URLDecoder
          import java.net.URLEncoder

          object Web {
              private const val UA = "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36"

              fun fetchText(url: String, max: Int = 6000): String {
                  if (!url.startsWith("http")) return "HATA: geçersiz adres"
                  val r = Http.get(url, mapOf("User-Agent" to UA), 20000)
                  if (!r.ok) return "HATA: HTTP " + r.code + " " + Text.clip(r.body, 100)
                  val txt = r.body.replace(Regex("(?is)<(script|style|noscript)[^>]*>.*?</\\1>"), " ")
                      .replace(Regex("(?s)<[^>]+>"), " ")
                      .replace("&nbsp;", " ").replace("&amp;", "&").replace("&quot;", "\"").replace("&#39;", "'")
                      .replace(Regex("\\s+"), " ").trim()
                  return Text.clip(txt, max)
              }

              /** DuckDuckGo HTML sonuçlarından başlık + özet listesi. */
              fun duck(query: String, max: Int = 6): String {
                  val url = "https://html.duckduckgo.com/html/?q=" + URLEncoder.encode(query, "UTF-8")
                  val r = Http.get(url, mapOf("User-Agent" to UA), 20000)
                  if (!r.ok) return "HATA: arama başarısız (" + r.code + ")"
                  val titleRe = Regex("(?is)<a[^>]*class=\"result__a\"[^>]*href=\"([^\"]+)\"[^>]*>(.*?)</a>")
                  val snipRe = Regex("(?is)<a[^>]*class=\"result__snippet\"[^>]*>(.*?)</a>")
                  val titles = titleRe.findAll(r.body).toList()
                  val snips = snipRe.findAll(r.body).toList()
                  val sb = StringBuilder()
                  var n = 0
                  for (i in titles.indices) {
                      if (n >= max) break
                      var link = titles[i].groupValues[1]
                      val idx = link.indexOf("uddg=")
                      if (idx >= 0) {
                          link = link.substring(idx + 5)
                          val amp = link.indexOf('&')
                          if (amp > 0) link = link.substring(0, amp)
                          try {
                              link = URLDecoder.decode(link, "UTF-8")
                          } catch (_: Exception) {
                          }
                      }
                      val title = clean(titles[i].groupValues[2])
                      val snip = if (i < snips.size) clean(snips[i].groupValues[1]) else ""
                      sb.append(n + 1).append(". ").append(title).append(" — ").append(snip).append(" (").append(link).append(")\n")
                      n++
                  }
                  return if (sb.isEmpty()) "Sonuç bulunamadı." else sb.toString()
              }

              private fun clean(s: String): String =
                  s.replace(Regex("(?s)<[^>]+>"), "").replace("&amp;", "&").replace("&quot;", "\"").replace("&#x27;", "'").replace("&nbsp;", " ").trim()
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/WhatsAppVoice.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/WhatsAppVoice.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.Rect
          import android.media.AudioAttributes
          import android.media.MediaMetadataRetriever
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import java.io.File
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /**
           * WhatsApp sesli mesajı: metni TTS ile sese çevirir ve (1) 'hold' modunda mikrofon düğmesine basılı tutup
           * hoparlörden okutarak gerçek sesli mesaj olarak, ya da (2) 'file' modunda ses dosyası olarak gönderir.
           */
          object WhatsAppVoice {
              private val MIC = listOf("sesli mesaj", "voice message", "mikrofon", "microphone", "ses kaydı", "kaydet")

              private fun svc(): NovaxAccessibilityService? = NovaxAccessibilityService.instance

              private fun durationMs(f: File): Long {
                  val r = MediaMetadataRetriever()
                  return try {
                      r.setDataSource(f.absolutePath)
                      r.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                  } catch (_: Exception) {
                      0L
                  } finally {
                      try {
                          r.release()
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun playBlocking(f: File, maxMs: Long) {
                  val mp = MediaPlayer()
                  try {
                      mp.setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                      mp.setDataSource(f.absolutePath)
                      mp.prepare()
                      val latch = CountDownLatch(1)
                      mp.setOnCompletionListener { latch.countDown() }
                      mp.start()
                      latch.await(maxMs, TimeUnit.MILLISECONDS)
                  } catch (e: Exception) {
                      AppLog.e("wavoice", "oynatma hatası", e)
                  } finally {
                      try {
                          mp.release()
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun findMicRect(s: NovaxAccessibilityService): Rect? {
                  for (l in MIC) {
                      for (n in s.findAll(l, false)) {
                          if (n.isEditable) continue
                          val r = Rect()
                          n.getBoundsInScreen(r)
                          if (!r.isEmpty) return r
                      }
                  }
                  return null
              }

              private fun openChat(c: Contacts.C, pkg: String): Boolean {
                  val s = svc() ?: return false
                  if (!Messaging.openWhatsAppChat(c, "")) return false
                  s.waitForPackage(pkg, 6000L)
                  ScreenOps.idle(3000L, 350L)
                  return true
              }

              fun send(to: String, text: String, modeIn: String): String {
                  val s = svc() ?: return ScreenOps.NEED
                  if (text.isBlank()) return "HATA: mesaj metni boş"
                  val c = Contacts.find(to) ?: return "HATA: '" + to + "' rehberde bulunamadı."
                  val pkg = Messaging.waPackage() ?: return "HATA: WhatsApp yüklü değil."
                  val mode = modeIn.ifBlank { Prefs.voiceNoteMode }
                  val f = File(NovaxApp.instance.cacheDir, "vn_" + System.currentTimeMillis() + ".wav")
                  if (!Voice.synthToFile(text, f, 25000L)) return "HATA: metin ses dosyasına çevrilemedi (TTS motoru hazır değil)."
                  val dur = durationMs(f)
                  if (mode == "file") return sendAsFile(c, pkg, f)

                  if (!openChat(c, pkg)) return "HATA: WhatsApp sohbeti açılamadı."
                  val mic = findMicRect(s) ?: return "HATA: Mikrofon düğmesi bulunamadı. Mesaj kutusu doluysa temizle ya da mode=file dene."
                  Act.setVolume(90, "music")
                  val holdMs = (if (dur > 0L) dur else (text.length * 90L)) + 2600L
                  val cx = mic.exactCenterX()
                  val cy = mic.exactCenterY()
                  val holder = Thread { s.longPress(cx, cy, holdMs) }
                  holder.start()
                  try {
                      Thread.sleep(1100)
                  } catch (_: InterruptedException) {
                  }
                  playBlocking(f, holdMs)
                  try {
                      holder.join(holdMs + 4000L)
                      Thread.sleep(900)
                  } catch (_: InterruptedException) {
                  }
                  try {
                      f.delete()
                  } catch (_: Exception) {
                  }
                  val who = if (c.name.isBlank()) c.number else c.name
                  return "WhatsApp'ta " + who + " kişisine sesli mesaj bıraktım (kaydı hoparlörden okuttum). Gönderildiğini sohbetten doğrula."
              }

              /** Kullanıcı kendi sesiyle konuşur; mikrofon düğmesi 'seconds' saniye basılı tutulup bırakılır. */
              fun live(to: String, seconds: Int): String {
                  val s = svc() ?: return ScreenOps.NEED
                  val c = Contacts.find(to) ?: return "HATA: '" + to + "' rehberde bulunamadı."
                  val pkg = Messaging.waPackage() ?: return "HATA: WhatsApp yüklü değil."
                  if (!openChat(c, pkg)) return "HATA: WhatsApp sohbeti açılamadı."
                  val mic = findMicRect(s) ?: return "HATA: Mikrofon düğmesi bulunamadı."
                  val sec = seconds.coerceIn(2, 55)
                  Voice.speakAndWait("Konuş, " + sec + " saniye kaydediyorum.", 6000L)
                  val ok = s.longPress(mic.exactCenterX(), mic.exactCenterY(), sec * 1000L)
                  ScreenOps.nap(800L)
                  return if (ok) "Sesli mesajını kaydedip gönderdim." else "HATA: kayıt hareketi tamamlanamadı."
              }

              private fun saveToMediaStore(f: File): Uri? {
                  return try {
                      val cr = NovaxApp.instance.contentResolver
                      val cv = ContentValues()
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, f.name)
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "audio/wav")
                      if (Build.VERSION.SDK_INT >= 29) {
                          cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Music/Novax")
                          cv.put(MediaStore.MediaColumns.IS_PENDING, 1)
                      }
                      val uri = cr.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                      val os = cr.openOutputStream(uri) ?: return null
                      os.use { out -> f.inputStream().use { inp -> inp.copyTo(out) } }
                      if (Build.VERSION.SDK_INT >= 29) {
                          val done = ContentValues()
                          done.put(MediaStore.MediaColumns.IS_PENDING, 0)
                          cr.update(uri, done, null, null)
                      }
                      uri
                  } catch (e: Exception) {
                      AppLog.e("wavoice", "MediaStore yazılamadı", e)
                      null
                  }
              }

              private fun sendAsFile(c: Contacts.C, pkg: String, f: File): String {
                  val s = svc() ?: return ScreenOps.NEED
                  if (c.name.isBlank()) return "HATA: Dosya modunda kişi rehberde adıyla kayıtlı olmalı."
                  val uri = saveToMediaStore(f) ?: return "HATA: ses dosyası paylaşılabilir hale getirilemedi."
                  val i = Intent(Intent.ACTION_SEND)
                      .setType("audio/wav")
                      .putExtra(Intent.EXTRA_STREAM, uri)
                      .setPackage(pkg)
                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  if (!Act.start(i)) return "HATA: WhatsApp paylaşım ekranı açılamadı."
                  s.waitForPackage(pkg, 6000L)
                  ScreenOps.idle(2500L, 350L)
                  if (!(s.clickText("ara", true) || s.clickText("search", true))) {
                      Bus.log("Arama simgesi bulunamadı, listeden denenecek")
                  } else {
                      ScreenOps.idle(800L, 150L)
                      ScreenOps.typeSet(c.name, false, false)
                      ScreenOps.idle(1500L, 250L)
                  }
                  var picked = false
                  for (n in s.findAll(c.name, false)) {
                      if (n.isEditable) continue
                      if (s.clickNode(n)) {
                          picked = true
                          break
                      }
                  }
                  if (!picked) return "HATA: WhatsApp kişi listesinde '" + c.name + "' bulunamadı."
                  ScreenOps.idle(1500L, 250L)
                  var sent = false
                  for (l in listOf("gönder", "send")) {
                      if (s.clickText(l, true)) {
                          sent = true
                          break
                      }
                  }
                  if (!sent) {
                      val byId = s.findByViewId(pkg + ":id/send")
                      if (byId.isNotEmpty()) sent = s.clickNode(byId[0])
                  }
                  ScreenOps.nap(900L)
                  return if (sent) "Ses dosyasını " + c.name + " kişisine gönderdim." else "Dosyayı seçtim ama Gönder düğmesine basamadım; ekrana bak."
              }
          }
          NOVAX_EOF

