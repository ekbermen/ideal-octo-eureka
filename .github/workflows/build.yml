          package com.novax.assistant

          /** Araçların ve yönlendiricinin kullandığı ince ekran katmanı. */
          object Screen {
              private fun acc(): NovaxAccessibilityService? = NovaxAccessibilityService.instance

              fun read(): String = ScreenOps.readIndexed()

              fun describe(question: String): String {
                  if (acc() == null) return ScreenOps.NEED
                  val b64 = ScreenshotOps.jpegBase64(1280)
                  if (b64 == null) return "Ekran görüntüsü alınamadı; metin okuma: " + ScreenOps.readIndexed(60)
                  return try {
                      val client = Llm.visionClient()
                      val msg = LlmMsg.userParts(listOf(LlmPart.ofText(question), LlmPart.ofImage(b64)))
                      val reply = client.chat("Bu bir Android ekran görüntüsü. Türkçe, kısa ve net cevap ver. Düğme ve metinleri adlarıyla an.", listOf(msg), null)
                      reply.text.ifBlank { "Görüntü yorumlanamadı." }
                  } catch (e: Exception) {
                      "HATA: " + Llm.describeError(e)
                  }
              }

              fun tapText(text: String, exact: Boolean): String = ScreenOps.tapText(text, exact, 0)

              fun tapXY(x: Float, y: Float): String {
                  val a = acc() ?: return ScreenOps.NEED
                  return if (a.tap(x, y)) "Dokundum (" + x + "," + y + ")" else "HATA: dokunma başarısız"
              }

              fun swipe(dir: String): String {
                  val a = acc() ?: return ScreenOps.NEED
                  return if (a.scroll(dir)) "Kaydırdım: " + dir else "HATA: kaydırılamadı (" + dir + ")"
              }

              fun type(text: String, append: Boolean, enter: Boolean): String = ScreenOps.typeSet(text, append, enter)

              fun key(k: String): String = ScreenOps.pressKey(k)

              fun waitFor(text: String, seconds: Int): String {
