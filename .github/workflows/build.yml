      - name: Yaz v4 dosyaları (HudFeed, HudLayer, V4)
        run: |
          D=app/src/main/java/com/novax/assistant
          mkdir -p $D

          cat > $D/HudFeed.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.concurrent.Executors

          /** Jarvis görsel modu verisi: Vikipedi/Commons fotoğrafları, Google Haberler başlıkları, YouTube videoları (anahtarsız). */
          object HudFeed {
              class Item(val kind: String, val title: String, val url: String, val thumb: String)

              private val pool = Executors.newCachedThreadPool()
              private const val UA = "NovaxHUD/1.0 (Android personal assistant) Mozilla/5.0"

              private fun enc(s: String): String = URLEncoder.encode(s, "UTF-8")
              private fun hdr(): Map<String, String> = mapOf("User-Agent" to UA, "Accept-Language" to "tr,en;q=0.8")

              fun start(queryIn: String, force: Boolean = false) {
                  if (!force && !Prefs.hudOn) return
                  if (NovaxApp.visible <= 0) return
                  var q = queryIn.replace(Regex("(?i)\\b(hakkında|hakkinda|bilgi|araştır|arastir|nedir|kimdir|kaç|kaç eder|son dakika|haberler|haberleri|bugün|güncel)\\b"), " ").replace(Regex("\\s+"), " ").trim()
                  if (q.isBlank()) q = queryIn.trim()
                  if (q.isBlank()) return
                  val nq = queryIn
                  Bus.hudReset(queryIn)
                  pool.execute {
                      try { images(q) } catch (e: Exception) { AppLog.e("hud", "görsel", e) }
                  }
                  pool.execute {
                      try {
                          val h = headlines(nq)
                          if (h.isNotEmpty()) Bus.hud(h)
                      } catch (e: Exception) { AppLog.e("hud", "haber", e) }
                  }
                  if (Prefs.hudVideo) {
                      pool.execute {
                          try { videos(q) } catch (e: Exception) { AppLog.e("hud", "video", e) }
                      }
                  }
              }

              private fun pages(body: String): List<JSONObject> {
                  val res = ArrayList<JSONObject>()
                  try {
                      val pg = JSONObject(body).optJSONObject("query")?.optJSONObject("pages") ?: return res
                      val keys = pg.keys()
                      while (keys.hasNext()) {
                          val o = pg.optJSONObject(keys.next())
                          if (o != null) res.add(o)
                      }
                  } catch (_: Exception) {
                  }
                  return res.sortedBy { it.optInt("index", 99) }
              }

              private fun images(q: String) {
                  val out = ArrayList<Item>()
                  val wp = Http.get("https://tr.wikipedia.org/w/api.php?action=query&format=json&generator=search&gsrlimit=6&gsrsearch=" + enc(q) + "&prop=pageimages&piprop=thumbnail&pithumbsize=640", hdr(), 12000)
                  if (wp.ok) {
                      for (p in pages(wp.body)) {
                          val th = p.optJSONObject("thumbnail")?.optString("source", "") ?: ""
                          if (th.isNotEmpty()) out.add(Item("img", p.optString("title", ""), th, th))
                      }
                  }
                  val cm = Http.get("https://commons.wikimedia.org/w/api.php?action=query&format=json&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch=" + enc(q) + "&prop=imageinfo&iiprop=url&iiurlwidth=640", hdr(), 12000)
                  if (cm.ok) {
                      for (p in pages(cm.body)) {
                          val title = p.optString("title", "")
                          val low = title.lowercase()
                          if (!(low.endsWith(".jpg") || low.endsWith(".jpeg") || low.endsWith(".png") || low.endsWith(".webp"))) continue
                          val th = p.optJSONArray("imageinfo")?.optJSONObject(0)?.optString("thumburl", "") ?: ""
                          if (th.isNotEmpty()) out.add(Item("img", title.removePrefix("File:").substringBeforeLast('.'), th, th))
                      }
                  }
                  if (out.isNotEmpty()) Bus.hud(out)
              }

              private fun clean(s: String): String =
                  s.replace("<![CDATA[", "").replace("]]>", "").replace("&amp;", "&").replace("&quot;", "\"")
                      .replace("&#39;", "'").replace("&lt;", "<").replace("&gt;", ">").trim()

              fun headlines(q: String): List<Item> {
                  val out = ArrayList<Item>()
                  val r = Http.get("https://news.google.com/rss/search?hl=tr&gl=TR&ceid=TR:tr&q=" + enc(q), hdr(), 12000)
                  if (!r.ok) return out
                  for (m in Regex("(?s)<item>.*?<title>(.*?)</title>.*?<link>(.*?)</link>").findAll(r.body)) {
                      out.add(Item("news", clean(m.groupValues[1]), m.groupValues[2].trim(), ""))
                      if (out.size >= 8) break
                  }
                  return out
              }

              private fun videos(q: String) {
                  val h = mapOf(
                      "User-Agent" to "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/124 Mobile Safari/537.36",
                      "Cookie" to "CONSENT=YES+1",
                      "Accept-Language" to "tr"
                  )
                  val r = Http.get("https://www.youtube.com/results?hl=tr&search_query=" + enc(q), h, 15000)
                  if (!r.ok) return
                  val re = Regex("\"videoRenderer\":\\{\"videoId\":\"([A-Za-z0-9_-]{11})\".{0,1500}?\"title\":\\{\"runs\":\\[\\{\"text\":\"(.*?)\"\\}")
                  val seen = HashSet<String>()
                  val out = ArrayList<Item>()
                  for (m in re.findAll(r.body)) {
                      val id = m.groupValues[1]
                      if (!seen.add(id)) continue
                      val title = m.groupValues[2].replace("\\u0026", "&").replace("\\\"", "\"")
                      out.add(Item("vid", title, "https://www.youtube.com/watch?v=" + id, "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg"))
                      if (out.size >= 4) break
                  }
                  if (out.isNotEmpty()) Bus.hud(out)
              }

              fun bitmap(url: String, maxW: Int): Bitmap? {
                  try {
                      val c = URL(url).openConnection() as HttpURLConnection
                      try {
                          c.connectTimeout = 10000
                          c.readTimeout = 15000
                          c.setRequestProperty("User-Agent", UA)
                          if (c.responseCode !in 200..299) return null
                          val bytes = c.inputStream.use { it.readBytes() }
                          if (bytes.size > 6000000) return null
                          val o = BitmapFactory.Options()
                          o.inJustDecodeBounds = true
                          BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o)
                          var s = 1
                          while (o.outWidth / s > maxW * 2) s *= 2
                          val o2 = BitmapFactory.Options()
                          o2.inSampleSize = s
                          return BitmapFactory.decodeByteArray(bytes, 0, bytes.size, o2)
                      } finally {
                          c.disconnect()
                      }
                  } catch (e: Exception) {
                      return null
                  }
              }
          }
          NOVAX_EOF

          cat > $D/HudLayer.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.webkit.WebView
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.TextView
          import java.util.concurrent.Executors

          /**
           * Jarvis görsel katmanı: fotoğraf kartları süzülür (Ken Burns), haber başlıkları daktilo gibi yazılır,
           * video küçük pencerede sessiz oynar. Dokunuşları alttaki arayüze geçirir (yalnızca video penceresi dokunulur).
           */
          class HudLayer(private val ctx: Context) : FrameLayout(ctx) {
              private val main = Handler(Looper.getMainLooper())
              private val dn = ctx.resources.displayMetrics.density
              private val pool = Executors.newFixedThreadPool(3)
              private val imgs = ArrayList<HudFeed.Item>()
              private val news = ArrayList<HudFeed.Item>()
              private var gen = 0
              private var showing = 0
              private var imgIdx = 0
              private var slotIdx = 0
              private var newsIdx = 0
              private var tickerRunning = false
              private var videoStarted = false
              private var video: FrameLayout? = null
              private var web: WebView? = null
              private val ticker = TextView(ctx)
              private val slots = listOf(0.02f to 0.10f, 0.98f to 0.13f, 0.0f to 0.42f, 1.0f to 0.47f, 0.04f to 0.70f, 0.96f to 0.68f)
              private val autoClear = Runnable { clear() }

              private fun dp(v: Float): Int = (v * dn + 0.5f).toInt()

              init {
                  clipChildren = false
                  ticker.typeface = Ui.MONO
                  ticker.textSize = 12f
                  ticker.setTextColor(Ui.CYAN)
                  ticker.background = Ui.box(ctx, Color.parseColor("#99000000"), Ui.CYAN_DIM, 6f)
                  ticker.setPadding(dp(10f), dp(6f), dp(10f), dp(6f))
                  ticker.visibility = View.GONE
                  val lp = FrameLayout.LayoutParams(-1, -2, Gravity.TOP)
                  lp.setMargins(dp(14f), dp(78f), dp(14f), 0)
                  addView(ticker, lp)
              }

              fun reset(q: String) {
                  clear()
                  ticker.text = "◤ ARANIYOR: " + Text.clip(q.uppercase(), 40)
                  ticker.visibility = View.VISIBLE
                  main.postDelayed(autoClear, 45000L)
              }

              fun clear() {
                  main.removeCallbacks(autoClear)
                  gen++
                  imgs.clear()
                  news.clear()
                  showing = 0
                  imgIdx = 0
                  newsIdx = 0
                  tickerRunning = false
                  videoStarted = false
                  closeVideo()
                  ticker.visibility = View.GONE
                  for (i in childCount - 1 downTo 0) {
                      val v = getChildAt(i)
                      if (v !== ticker) removeViewAt(i)
                  }
              }

              fun add(items: List<HudFeed.Item>) {
                  for (x in items) {
                      if (x.kind == "news") {
                          news.add(x)
                      } else {
                          imgs.add(x)
                          if (x.kind == "vid" && Prefs.hudVideo && !videoStarted) {
                              videoStarted = true
                              playVideo(x)
                          }
                      }
                  }
                  if (news.isNotEmpty() && !tickerRunning) {
                      tickerRunning = true
                      nextHeadline(gen)
                  }
                  pump()
              }

              private fun pump() {
                  if (imgs.isEmpty() || width == 0) return
                  if (showing >= 3) return
                  if (imgIdx >= imgs.size * 3) return
                  val my = gen
                  val item = imgs[imgIdx % imgs.size]
                  imgIdx++
                  showing++
                  pool.execute {
                      val b = HudFeed.bitmap(item.thumb, 640)
                      main.post {
                          if (my != gen) return@post
                          if (b == null) {
                              showing--
                              pump()
                              return@post
                          }
                          spawn(b, item)
                          main.postDelayed({ if (my == gen) pump() }, 1100L)
                      }
                  }
              }

              private fun spawn(b: Bitmap, item: HudFeed.Item) {
                  val my = gen
                  val w = (width * 0.42f).toInt()
                  val h = (w * 0.66f).toInt()
                  val s = slots[slotIdx % slots.size]
                  slotIdx++
                  val card = FrameLayout(ctx)
                  card.background = Ui.box(ctx, Color.parseColor("#CC06121C"), Ui.CYAN, 6f, 1.2f)
                  card.setPadding(dp(3f), dp(3f), dp(3f), dp(3f))
                  val iv = ImageView(ctx)
                  iv.scaleType = ImageView.ScaleType.CENTER_CROP
                  iv.setImageBitmap(b)
                  card.addView(iv, FrameLayout.LayoutParams(-1, -1))
                  val cap = TextView(ctx)
                  cap.typeface = Ui.MONO
                  cap.textSize = 9f
                  cap.setTextColor(Ui.CYAN)
                  cap.text = (if (item.kind == "vid") "▶ " else "◈ ") + Text.clip(item.title, 38)
                  cap.setBackgroundColor(Color.parseColor("#AA000000"))
                  cap.setPadding(dp(4f), dp(2f), dp(4f), dp(2f))
                  card.addView(cap, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                  val lp = FrameLayout.LayoutParams(w, h)
                  lp.leftMargin = (s.first * (width - w)).toInt()
                  lp.topMargin = (s.second * (height - h)).toInt()
                  card.alpha = 0f
                  card.scaleX = 0.75f
                  card.scaleY = 0.75f
                  addView(card, lp)
                  card.animate().alpha(0.45f).scaleX(1f).scaleY(1f).setDuration(700L).start()
                  iv.animate().scaleX(1.2f).scaleY(1.2f).setDuration(9000L).start()
                  main.postDelayed({
                      if (my != gen || card.parent == null) return@postDelayed
                      card.animate().alpha(0f).scaleX(1.12f).scaleY(1.12f).setDuration(700L).withEndAction {
                          removeView(card)
                          showing--
                          if (my == gen) pump()
                      }.start()
                  }, 8500L)
              }

              private fun nextHeadline(my: Int) {
                  if (my != gen || news.isEmpty()) return
                  val h = news[newsIdx % news.size]
                  newsIdx++
                  val text = "◤ BAŞLIK ◢ " + Text.clip(h.title, 90)
                  ticker.visibility = View.VISIBLE
                  var i = 0
                  val r = object : Runnable {
                      override fun run() {
                          if (my != gen) return
                          i += 2
                          if (i >= text.length) {
                              ticker.text = text
                              main.postDelayed({ nextHeadline(my) }, 3800L)
                              return
                          }
                          ticker.text = text.substring(0, i) + "▌"
                          main.postDelayed(this, 30L)
                      }
                  }
                  main.post(r)
              }

              private fun playVideo(v: HudFeed.Item) {
                  val id = v.url.substringAfter("v=", "")
                  if (id.length != 11 || width == 0) return
                  val w = (width * 0.56f).toInt()
                  val h = (w * 9f / 16f).toInt()
                  val card = FrameLayout(ctx)
                  card.background = Ui.box(ctx, Color.BLACK, Ui.CYAN, 6f, 1.5f)
                  card.setPadding(dp(2f), dp(2f), dp(2f), dp(2f))
                  val wv = WebView(ctx)
                  wv.settings.javaScriptEnabled = true
                  wv.settings.domStorageEnabled = true
                  wv.settings.mediaPlaybackRequiresUserGesture = false
                  wv.setBackgroundColor(Color.BLACK)
                  val html = "<html><body style='margin:0;background:#000'><iframe width='100%' height='100%' src='https://www.youtube.com/embed/" + id +
                      "?autoplay=1&mute=1&playsinline=1&controls=0&loop=1&playlist=" + id + "' frameborder='0' allow='autoplay; encrypted-media'></iframe></body></html>"
                  wv.loadDataWithBaseURL("https://www.youtube.com", html, "text/html", "utf-8", null)
                  card.addView(wv, FrameLayout.LayoutParams(-1, -1))
                  val x = TextView(ctx)
                  x.text = "✖"
                  x.setTextColor(Ui.RED)
                  x.textSize = 14f
                  x.setBackgroundColor(Color.parseColor("#AA000000"))
                  x.setPadding(dp(8f), dp(4f), dp(8f), dp(4f))
                  x.setOnClickListener { closeVideo() }
                  card.addView(x, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.END))
                  val open = TextView(ctx)
                  open.text = "↗"
                  open.setTextColor(Ui.CYAN)
                  open.textSize = 14f
                  open.setBackgroundColor(Color.parseColor("#AA000000"))
                  open.setPadding(dp(8f), dp(4f), dp(8f), dp(4f))
                  open.setOnClickListener {
                      try {
                          ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(v.url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      } catch (_: Exception) {
                      }
                  }
                  card.addView(open, FrameLayout.LayoutParams(-2, -2, Gravity.TOP or Gravity.START))
                  val lp = FrameLayout.LayoutParams(w, h, Gravity.TOP or Gravity.END)
                  lp.topMargin = dp(125f)
                  lp.rightMargin = dp(10f)
                  card.alpha = 0f
                  addView(card, lp)
                  card.animate().alpha(0.95f).setDuration(600L).start()
                  video = card
                  web = wv
                  main.postDelayed({ if (video === card) closeVideo() }, 40000L)
              }

              private fun closeVideo() {
                  val c = video
                  val w = web
                  video = null
                  web = null
                  if (c != null) removeView(c)
                  if (w != null) {
                      try {
                          w.loadUrl("about:blank")
                          w.destroy()
                      } catch (_: Exception) {
                      }
                  }
              }
          }
          NOVAX_EOF

          cat > $D/V4.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import org.json.JSONObject

          /** v4 araçları: Jarvis görsel modu. */
          object V4 {
              private fun s(n: String, d: String, r: Boolean = true) = Tools.P(n, "string", d, r)

              fun install(reg: (String, String, List<Tools.P>, (JSONObject, ToolCtx) -> String) -> Unit) {
                  reg("show_visuals", "Ekranda Jarvis tarzı görsel modu açar: konuyla ilgili fotoğraflar süzülür, video küçük pencerede oynar, haber başlıkları yazılır. Kullanıcı bir şeyi 'göster' dediğinde ya da araştırma yaparken kullan.",
                      listOf(s("query", "Konu / arama sözcüğü"))) { a, _ ->
                      if (NovaxApp.visible <= 0) {
                          "Novax ekranda açık değil; görseller gösterilemedi."
                      } else {
                          HudFeed.start(a.optString("query", "").trim(), true)
                          "Görsel mod başladı."
                      }
                  }
                  reg("news_headlines", "Konuyla ilgili güncel haber başlıklarını getirir ve ekranda gösterir (konu boşsa Türkiye gündemi).",
                      listOf(s("query", "Konu", false))) { a, _ ->
                      val q = a.optString("query", "").trim().ifBlank { "Türkiye" }
                      HudFeed.start(q, true)
                      val h = HudFeed.headlines(q)
                      if (h.isEmpty()) "Haber bulunamadı." else h.take(6).joinToString("\n") { "- " + it.title }
                  }
              }
          }
          NOVAX_EOF

      - name: Yama v4 (mevcut dosyaları düzenle)
        run: |
          python3 - <<'NOVAX_EOF'
          B = 'app/src/main/java/com/novax/assistant/'

          def patch(f, old, new):
              p = f if f.startswith('app/') else B + f
              s = open(p, encoding='utf-8').read()
              if old not in s:
                  raise SystemExit('YAMA BULUNAMADI: ' + f + ' :: ' + old[:70])
              s = s.replace(old, new, 1)
              open(p, 'w', encoding='utf-8').write(s)

          # Prefs
          patch('Prefs.kt', '// ---- v3',
                r"""// ---- v4
              var hudOn: Boolean
                  get() = gb("hud_on", true)
                  set(v) { pb("hud_on", v) }
              var hudVideo: Boolean
                  get() = gb("hud_video", true)
                  set(v) { pb("hud_video", v) }

              // ---- v3""")

          # Bus
          patch('Bus.kt', 'fun onFile(name: String, uri: String) {}',
                'fun onFile(name: String, uri: String) {}\n                  fun onHudReset(query: String) {}\n                  fun onHud(items: List<HudFeed.Item>) {}')
          patch('Bus.kt', 'fun file(name: String, uri: String) {',
                'fun hudReset(q: String) {\n                  each { it.onHudReset(q) }\n              }\n\n              fun hud(items: List<HudFeed.Item>) {\n                  each { it.onHud(items) }\n              }\n\n              fun file(name: String, uri: String) {')

          # Tetikleyiciler: her web araması görsel modu başlatır
          patch('Search.kt', 'if (!Prefs.webSearchOn) return "HATA: Web araması ayarlardan kapatılmış."',
                'if (!Prefs.webSearchOn) return "HATA: Web araması ayarlardan kapatılmış."\n                  HudFeed.start(query)')
          patch('Search.kt', 'if (!Prefs.webSearchOn) return "Web araması ayarlardan kapalı."',
                'if (!Prefs.webSearchOn) return "Web araması ayarlardan kapalı."\n                  HudFeed.start(query)')

          # Araçlar
          patch('Tools.kt', 'V3Tools.install { n, d, p, f -> reg(n, d, p, f) }',
                'V3Tools.install { n, d, p, f -> reg(n, d, p, f) }\n                  V4.install { n, d, p, f -> reg(n, d, p, f) }')
          patch('V3.kt', 'private val webTools = setOf("web_search", "fetch_url")',
                'private val webTools = setOf("web_search", "fetch_url", "news_headlines", "show_visuals")')
          patch('V3.kt', 'sb.append("INSTAGRAM\\n")',
                'sb.append("GÖRSEL MOD\\n")\n                  sb.append("- Kullanıcı bir şeyi görmek/izlemek isterse show_visuals, haber isterse news_headlines kullan. web_search zaten görsel modu otomatik başlatır.\\n\\n")\n                  sb.append("INSTAGRAM\\n")')

          # MainActivity
          patch('MainActivity.kt', 'private lateinit var dot: View', 'private lateinit var dot: View\n              private lateinit var hudLayer: HudLayer')
          patch('MainActivity.kt', 'root.addView(col, FrameLayout.LayoutParams(-1, -1))',
                'root.addView(col, FrameLayout.LayoutParams(-1, -1))\n                  hudLayer = HudLayer(this)\n                  root.addView(hudLayer, FrameLayout.LayoutParams(-1, -1))')
          patch('MainActivity.kt', 'Bus.remove(this)', 'Bus.remove(this)\n                  hudLayer.clear()')
          patch('MainActivity.kt', 'val fill = if (user) Color.parseColor("#12384D") else Color.parseColor("#0A1B2A")',
                'val fill = if (user) Color.parseColor("#C012384D") else Color.parseColor("#B00A1B2A")')
          patch('MainActivity.kt', 'override fun onFile(name: String, uri: String) {',
                'override fun onHudReset(query: String) { hudLayer.reset(query) }\n              override fun onHud(items: List<HudFeed.Item>) { hudLayer.add(items) }\n              override fun onFile(name: String, uri: String) {')

          # Ayarlar
          patch('SetupActivity.kt', 'private lateinit var adbPortEt: EditText',
                'private lateinit var adbPortEt: EditText\n              private lateinit var hudCb: CheckBox\n              private lateinit var hudVidCb: CheckBox')
          patch('SetupActivity.kt', 'col.addView(Ui.section(this, "INSTAGRAM"))',
                r"""col.addView(Ui.section(this, "JARVIS GÖRSEL MODU"))
                  col.addView(Ui.hint(this, "Arama ya da haber yapınca ekranın arkasında konuyla ilgili fotoğraflar süzülür, haber başlıkları yazılır ve küçük pencerede video oynar (internet gerekir)."))
                  hudCb = Ui.check(this, "Görsel modu aç (foto + haber başlıkları)", Prefs.hudOn)
                  hudVidCb = Ui.check(this, "Video otomatik oynasın (sessiz)", Prefs.hudVideo)
                  col.addView(hudCb)
                  col.addView(hudVidCb)

                  col.addView(Ui.section(this, "INSTAGRAM"))""")
          patch('SetupActivity.kt', 'Prefs.adbPort = adbPortEt.text.toString().toIntOrNull() ?: 5555',
                'Prefs.adbPort = adbPortEt.text.toString().toIntOrNull() ?: 5555\n                  Prefs.hudOn = hudCb.isChecked\n                  Prefs.hudVideo = hudVidCb.isChecked')
          print('v4 yama tamam')
          NOVAX_EOF

      - name: local.properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties

      - name: Derle (debug APK)
        run: |
          set +e
          gradle assembleDebug --console=plain --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo ""
            echo "=================== HATA ÖZETİ ==================="
            grep -nE "^e: |error:|What went wrong|Execution failed|Could not|Unresolved|not found|FAILED" build.log | head -80
            echo "=================================================="
            exit "$code"
          fi

      - name: Hata logunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Novax-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
