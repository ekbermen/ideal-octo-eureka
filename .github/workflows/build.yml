              override fun onResume() {
                  super.onResume()
                  renderPerms()
              }

              // ------------------------------------------------------------------ yapay zekâ
              private fun updateAiStatus() {
                  val p = Providers.byId(Prefs.providerId)
                  aiStatus.text = if (p == null) "Henüz şirket belirlenmedi." else "Şirket: " + p.company + "  ·  Model: " + Prefs.model.ifBlank { "(seçilmedi)" }
              }

              private fun appendLog(line: String) {
                  detectLog.append(line + "\n")
              }

              private fun detect() {
                  persist()
                  detectLog.text = ""
                  aiStatus.text = "Anahtar test ediliyor…"
                  val key = Prefs.apiKey
                  val base = Prefs.customBase
                  val th = Thread {
                      val res = ProviderDetector.detect(key, base) { line -> runOnUiThread { appendLog(line) } }
                      val p = res.provider
                      if (p != null) {
                          val changed = Prefs.providerId != p.id
                          Prefs.providerId = p.id
                          Prefs.modelList = res.models.joinToString("\n")
                          if (res.ranked.isNotEmpty() && (changed || Prefs.model.isBlank() || !res.models.contains(Prefs.model))) {
                              Prefs.model = res.ranked[0]
                          }
                          if (changed) Prefs.visionModel = ""
                          runOnUiThread { appendLog("Sohbet testi yapılıyor…") }
                          val test = try {
                              val r = Llm.simple("Sadece 'tamam' yaz.", "merhaba")
                              "Sohbet testi başarılı: " + Text.clip(r, 40)
                          } catch (e: Exception) {
                              "Sohbet testi başarısız: " + Llm.describeError(e)
                          }
                          runOnUiThread {
                              appendLog(test)
                              modelEt.setText(Prefs.model)
                              visionEt.setText(Prefs.visionModel)
                              updateAiStatus()
                          }
                      } else {
                          runOnUiThread { updateAiStatus() }
                      }
                  }
                  th.start()
              }

              private fun pickModel() {
                  val p = Providers.byId(Prefs.providerId)
                  if (p == null) {
                      Toast.makeText(this, "Önce 'Algıla ve test et' düğmesine bas", Toast.LENGTH_LONG).show()
                      return
                  }
                  val ids = Prefs.modelList.split("\n").filter { it.isNotBlank() }
                  val ranked = ModelPicker.rank(p, ids).take(80)
                  if (ranked.isEmpty()) {
                      Toast.makeText(this, "Model listesi boş; modeli elle yaz", Toast.LENGTH_LONG).show()
                      return
                  }
                  val arr = ranked.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle(p.company + " modelleri")
                      .setItems(arr) { _, which ->
                          Prefs.model = arr[which]
                          modelEt.setText(arr[which])
                          updateAiStatus()
                      }
                      .show()
              }

              // ------------------------------------------------------------------ telefon devri
              private fun savePin() {
                  val v = pinEt.text.toString().filter { it.isDigit() }
                  if (v.length < 4) {
                      Toast.makeText(this, "PIN en az 4 haneli olmalı", Toast.LENGTH_SHORT).show()
                      return
                  }
                  PhoneUnlock.setPin(v)
                  pinEt.setText("")
                  updatePinStatus()
                  Toast.makeText(this, "PIN şifreli olarak kaydedildi", Toast.LENGTH_SHORT).show()
              }

              private fun clearPin() {
                  PhoneUnlock.setPin("")
                  updatePinStatus()
              }

              private fun updatePinStatus() {
                  pinStatus.text = if (PhoneUnlock.hasPin()) "PIN kayıtlı ✔ (şifreli)" else "PIN kayıtlı değil"
              }

              private fun cycleWho() {
                  whoIdx = (whoIdx + 1) % whoValues.size
                  updateWhoText()
              }

              private fun updateWhoText() {
                  whoBtn.text = "Karşılanacak aramalar: " + whoLabels[whoIdx]
              }

              private fun cycleMode() {
                  modeIdx = (modeIdx + 1) % modeValues.size
                  updateModeText()
              }

              private fun updateModeText() {
                  noteModeBtn.text = modeLabels[modeIdx]
              }

              // ------------------------------------------------------------------ izinler
              private fun renderPerms() {
                  permBox.removeAllViews()
                  for (item in Perms.items()) {
                      val granted = item.ok(this)
                      val row = Ui.panel(this)
                      val title = (if (granted) "✔ " else "✖ ") + item.title + (if (item.critical) "  (gerekli)" else "")
                      row.addView(Ui.text(this, title, 14f, if (granted) Ui.GREEN else Ui.AMBER, true))
                      row.addView(Ui.text(this, item.why, 11f, Ui.CYAN_DIM))
                      if (!granted) {
                          val btn = Ui.button(this, "İzin ver", Ui.AMBER) { item.ask(this) }
                          row.addView(btn, Ui.margins(Ui.lp(-2, -2), this, 0f, 6f, 0f, 0f))
                      }
                      permBox.addView(row, Ui.margins(Ui.lp(), this, 0f, 0f, 0f, 6f))
                  }
              }

              // ------------------------------------------------------------------ kaydet
              private fun persist() {
                  Prefs.apiKey = keyEt.text.toString()
                  Prefs.customBase = baseEt.text.toString()
                  Prefs.model = modelEt.text.toString()
                  Prefs.visionModel = visionEt.text.toString()
                  Prefs.mediaGeminiKey = mediaKeyEt.text.toString()
                  Prefs.userName = nameEt.text.toString()
                  Prefs.wakeWord = wakeEt.text.toString()
                  Prefs.countryCode = ccEt.text.toString()
                  Prefs.lang = langEt.text.toString().ifBlank { "tr-TR" }
                  Prefs.wakeOn = wakeCb.isChecked
                  Prefs.ttsOn = ttsCb.isChecked
                  Prefs.overlayOn = overlayCb.isChecked
                  Prefs.fastMode = fastCb.isChecked
                  Prefs.confirmRisky = confirmCb.isChecked
                  Prefs.readNotifs = notifCb.isChecked
                  Prefs.liveFront = liveFrontCb.isChecked
                  Prefs.liveWatch = liveWatchCb.isChecked
                  Prefs.voiceNoteMode = modeValues[modeIdx]
                  Prefs.unlockEnabled = unlockCb.isChecked
                  Prefs.callDelegateOn = callCb.isChecked
                  Prefs.callWho = whoValues[whoIdx]
                  Prefs.callAnswerAfterSec = afterEt.text.toString().toIntOrNull() ?: 15
                  Prefs.callMaxSec = maxEt.text.toString().toIntOrNull() ?: 240
                  Prefs.callGreeting = greetEt.text.toString()
                  Prefs.callPersona = personaEt.text.toString()
                  Prefs.callEndAfter = callEndCb.isChecked
                  Voice.init(this)
                  Voice.applyLanguage()
              }

              private fun save() {
                  persist()
                  if (Perms.micGranted(this)) {
                      if (NovaxService.running) NovaxService.stop(this)
                      NovaxService.start(this)
                  } else {
                      requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO), Perms.REQ)
                      return
                  }
                  Toast.makeText(this, "Kaydedildi", Toast.LENGTH_SHORT).show()
                  finish()
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  Contacts.invalidate()
                  renderPerms()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/ShareReceiverActivity.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/ShareReceiverActivity.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.MimeTypeMap
          import android.widget.Toast
          import java.io.File

          /** Başka uygulamalardan 'Paylaş > Novax' ile gelen foto/ses/video/metni inceler. */
          class ShareReceiverActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  try {
                      handle(intent)
                  } catch (e: Exception) {
                      AppLog.e("share", "paylaşım işlenemedi", e)
                      Toast.makeText(this, "Paylaşım işlenemedi: " + e.message, Toast.LENGTH_LONG).show()
                  }
                  finish()
              }

              @Suppress("DEPRECATION")
              private fun uris(i: Intent): List<Uri> {
                  val out = ArrayList<Uri>()
                  if (i.action == Intent.ACTION_SEND_MULTIPLE) {
                      val l = i.getParcelableArrayListExtra<Uri>(Intent.EXTRA_STREAM)
                      if (l != null) out.addAll(l)
                  } else {
                      val u = i.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)
                      if (u != null) out.add(u)
                  }
                  return out
              }

              private fun extFor(type: String?, uri: Uri): String {
                  if (type != null) {
                      val e = MimeTypeMap.getSingleton().getExtensionFromMimeType(type)
                      if (!e.isNullOrBlank()) return e
                      if (type.contains("ogg") || type.contains("opus")) return "ogg"
                  }
                  val p = uri.lastPathSegment ?: return "bin"
                  val dot = p.lastIndexOf('.')
                  return if (dot >= 0 && dot < p.length - 1) p.substring(dot + 1) else "bin"
              }

              private fun handle(i: Intent) {
                  val text = i.getStringExtra(Intent.EXTRA_TEXT) ?: ""
                  val list = uris(i)
                  val appCtx = applicationContext
                  if (list.isEmpty()) {
                      if (text.isNotBlank()) {
                          Toast.makeText(this, "Novax'a gönderildi", Toast.LENGTH_SHORT).show()
                          Brain.handle(text)
                      }
                      return
                  }
                  Toast.makeText(this, "Novax inceliyor…", Toast.LENGTH_SHORT).show()
                  val resolver = contentResolver
                  val dir = File(cacheDir, "shared")
                  dir.mkdirs()
                  val files = ArrayList<File>()
                  var n = 0
                  for (u in list) {
                      val type = resolver.getType(u)
                      val f = File(dir, "share_" + System.currentTimeMillis() + "_" + n + "." + extFor(type, u))
                      n++
                      try {
                          val ins = resolver.openInputStream(u) ?: continue
                          ins.use { inp -> f.outputStream().use { out -> inp.copyTo(out) } }
                          files.add(f)
                      } catch (e: Exception) {
                          AppLog.e("share", "kopyalanamadı", e)
                      }
                  }
                  val question = text
                  Brain.runAsync(Runnable {
                      Voice.init(appCtx)
                      Bus.setState(OrbState.THINKING)
                      val sb = StringBuilder()
                      for (f in files) {
                          if (files.size > 1) sb.append(f.name).append(": ")
                          sb.append(MediaAnalyzer.analyze(f.absolutePath, question)).append('\n')
                      }
                      val answer = sb.toString().trim().ifBlank { "Paylaşılan dosya okunamadı." }
                      Bus.user("[Paylaşılan " + files.size + " dosya]" + (if (question.isNotBlank()) " " + question else ""))
                      MemoryStore.addTurn("user", "[paylaşılan dosya incelendi]")
                      MemoryStore.addTurn("model", answer)
                      Bus.novax(answer)
                      Voice.speak(answer)
                  })
              }
          }
          NOVAX_EOF

