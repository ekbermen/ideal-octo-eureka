          package com.novax.assistant

          import org.json.JSONArray
          import org.json.JSONObject

          /** Modelin çağırabildiği araçlar: tanımlar + çalıştırıcı. Tüm şirketler için nötr şemayla üretilir. */
          object Tools {
              class P(val n: String, val t: String, val d: String, val req: Boolean = true)

              class ToolDef(val name: String, val desc: String, val params: List<P>, val fn: (JSONObject, ToolCtx) -> String)

              private val defs = ArrayList<ToolDef>()
              private val byName = HashMap<String, ToolDef>()

              private fun ps(n: String, d: String, req: Boolean = true) = P(n, "string", d, req)
              private fun pi(n: String, d: String, req: Boolean = true) = P(n, "integer", d, req)
              private fun pb(n: String, d: String, req: Boolean = true) = P(n, "boolean", d, req)
              private fun pn(n: String, d: String, req: Boolean = true) = P(n, "number", d, req)

              private fun reg(name: String, desc: String, params: List<P>, fn: (JSONObject, ToolCtx) -> String) {
                  val d = ToolDef(name, desc, params, fn)
                  defs.add(d)
                  byName[name] = d
              }

              private fun JSONObject.s(k: String): String = optString(k, "").trim()

              fun declarations(): JSONArray {
                  val a = JSONArray()
                  for (d in defs) {
                      val o = JSONObject().put("name", d.name).put("description", d.desc)
                      if (d.params.isNotEmpty()) {
                          val props = JSONObject()
                          val req = JSONArray()
                          for (x in d.params) {
                              props.put(x.n, JSONObject().put("type", x.t).put("description", x.d))
                              if (x.req) req.put(x.n)
                          }
                          val schema = JSONObject().put("type", "object").put("properties", props)
                          if (req.length() > 0) schema.put("required", req)
                          o.put("parameters", schema)
                      }
                      a.put(o)
                  }
                  return a
              }

              fun count(): Int = defs.size

              fun execute(name: String, a: JSONObject, ctx: ToolCtx): String {
                  val d = byName[name] ?: return "HATA: bilinmeyen araç " + name
                  if (ctx.cancel.cancelled) return "İptal edildi."
                  Bus.log("▸ " + name)
                  return try {
                      d.fn(a, ctx)
                  } catch (e: Exception) {
                      AppLog.e("tools", name + " başarısız", e)
                      "HATA: " + e.javaClass.simpleName + ": " + (e.message ?: "")
                  }
              }

              init {
                  // ============================================================ uygulamalar & web
                  reg("open_app", "Telefondaki bir uygulamayı adıyla açar (WhatsApp, YouTube, Ayarlar, Chrome, Not defteri...).", listOf(ps("name", "Uygulama adı"))) { a, _ -> Act.openApp(a.s("name")) }
                  reg("list_apps", "Yüklü uygulamaları listeler; isme göre filtre verilebilir.", listOf(ps("filter", "Ad filtresi", false))) { a, _ -> Apps.listText(a.s("filter")) }
                  reg("open_url", "Bir web adresini tarayıcıda açar.", listOf(ps("url", "https://... adresi"))) { a, _ -> Act.openUrl(a.s("url")) }
                  reg("web_search", "İnternette arar ve özet cevap döndürür (güncel bilgi için).", listOf(ps("query", "Arama sorusu"))) { a, _ -> Search.web(a.s("query")) }
                  reg("fetch_url", "Bir web sayfasının metin içeriğini indirip döndürür.", listOf(ps("url", "https://... adresi"))) { a, _ -> Web.fetchText(a.s("url")) }
                  reg("play_youtube", "YouTube'da arama yapar, video veya müzik açar.", listOf(ps("query", "Aranacak şarkı/video"))) { a, _ -> Act.playYoutube(a.s("query")) }
                  reg("navigate", "Haritalarda yol tarifi başlatır.", listOf(ps("destination", "Hedef adres/yer"))) { a, _ -> Act.navigate(a.s("destination")) }
                  reg("install_app", "Play Store'dan uygulama/oyun indirip kurar (ücretli ise satın almaz). Uzun sürebilir; arka planda kullanmak en iyisidir.",
                      listOf(ps("name", "Uygulama/oyun adı (ör. eFootball)"), ps("package", "Biliniyorsa paket adı", false))) { a, c -> PlayStoreOps.install(a.s("name"), a.s("package"), c.cancel) }
                  reg("uninstall_app", "Yüklü bir uygulamayı kaldırır (önce kullanıcı onayı alınır).", listOf(ps("name", "Uygulama adı"))) { a, _ ->
                      val n = a.s("name")
                      if (!Confirm.gate(n + " uygulamasını kaldırayım mı?")) "Kullanıcı onaylamadı, kaldırmadım." else PlayStoreOps.uninstall(n)
                  }
                  reg("app_installed", "Bir uygulamanın yüklü olup olmadığını söyler.", listOf(ps("name", "Uygulama adı"))) { a, _ -> PlayStoreOps.installedText(a.s("name")) }
