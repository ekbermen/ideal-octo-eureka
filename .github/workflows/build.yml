        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/AppLog.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.CopyOnWriteArrayList

          /** Uygulama içi hafif günlük: Ayarlar > Günlük ekranında görünür. */
          object AppLog {
              private val lines = CopyOnWriteArrayList<String>()
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.US)

              @Synchronized
              private fun stamp(): String = fmt.format(Date())

              fun add(level: String, tag: String, msg: String) {
                  val line = stamp() + " " + level + "/" + tag + ": " + msg
                  lines.add(line)
                  while (lines.size > 500) lines.removeAt(0)
                  try {
                      android.util.Log.d("Novax", line)
                  } catch (_: Exception) {
                  }
              }

              fun i(tag: String, msg: String) {
                  add("I", tag, msg)
              }

              fun w(tag: String, msg: String) {
                  add("W", tag, msg)
              }

              fun e(tag: String, msg: String, t: Throwable? = null) {
                  if (t == null) {
                      add("E", tag, msg)
                  } else {
                      add("E", tag, msg + " :: " + t.javaClass.simpleName + ": " + (t.message ?: ""))
                  }
              }

              fun dump(): String = lines.joinToString("\n")

              fun clear() {
                  lines.clear()
              }
          }
          NOVAX_EOF

