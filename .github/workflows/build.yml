        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/NovaxReceiver.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          /** Zamanlayıcı tetiklemeleri ve bildirimden görev iptali. */
          class NovaxReceiver : BroadcastReceiver() {
              companion object {
                  const val ACTION_FIRE = "com.novax.assistant.FIRE"
                  const val ACTION_CANCEL_TASK = "com.novax.assistant.CANCEL_TASK"
              }

              override fun onReceive(ctx: Context, intent: Intent) {
                  val action = intent.action ?: return
                  val id = intent.getIntExtra("id", -1)
                  if (id < 0) return
                  if (action == ACTION_FIRE) {
                      val pending = goAsync()
                      Brain.runAsync(Runnable {
                          try {
                              Scheduler.fire(id)
                          } finally {
                              pending.finish()
                          }
                      })
                  } else if (action == ACTION_CANCEL_TASK) {
                      BgTasks.cancel(id)
                  }
              }
          }
