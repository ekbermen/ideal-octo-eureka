          package com.novax.assistant

          import android.app.Notification
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          /**
           * Android 14+, mikrofon türündeki foreground servisin açılışta arka plandan başlatılmasına izin vermez.
           * Bu yüzden açılışta tek dokunuşluk bir bildirim bırakırız.
           */
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  Prefs.init(ctx)
                  if (!Prefs.wakeOn || !Prefs.bootHint) return
                  NovaxApp.createChannels(ctx)
                  val pi = PendingIntent.getActivity(ctx, 7, Intent(ctx, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(ctx, NovaxApp.CH_ALERT)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("Novax hazır")
                      .setContentText("Dinlemeyi başlatmak için dokun")
                      .setContentIntent(pi).setAutoCancel(true).build()
                  (ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify(77, n)
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Brain.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Brain.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.util.concurrent.Executors

          /**
           * Beyin: '@Arkaplan' ile başlayanlar arka plan görevi olur; diğerleri önce yerel yönlendirici (anında),
           * olmazsa seçili yapay zekâ modeli (araç döngüsü) ile çalışır.
           */
          object Brain {
              private val pool = Executors.newCachedThreadPool()
              private val bgRe = Regex("^@\\s*(arkaplan|arka plan|arkaplanda|bg|background)\\b[:,\\-]?\\s*(.*)$", setOf(RegexOption.IGNORE_CASE, RegexOption.DOT_MATCHES_ALL))

              @Volatile
              private var currentToken: CancelToken? = null

              /** Metin '@Arkaplan ...' ise görev metnini, değilse null döner. */
              fun bgGoal(text: String): String? {
                  val m = bgRe.find(text.trim()) ?: return null
                  return m.groupValues[2].trim()
              }

              fun handle(text: String, speak: Boolean = true) {
                  pool.execute { process(text.trim(), speak, null) }
              }

              /** Medya (görüntü/ses) ekli istek: paylaşım menüsü, canlı analiz vb. */
              fun handleParts(label: String, parts: List<LlmPart>, speak: Boolean = true) {
                  pool.execute { process(label, speak, parts) }
              }

              fun cancelCurrent() {
                  currentToken?.cancelled = true
              }

              fun runAsync(r: Runnable) {
                  pool.execute(r)
              }

              private fun toHistory(): List<LlmMsg> {
                  val turns = MemoryStore.recentTurns(14)
                  val out = ArrayList<LlmMsg>()
                  for (t in turns) {
                      if (t.first == "user") {
                          out.add(LlmMsg.user(t.second))
                      } else if (out.isNotEmpty()) {
                          out.add(LlmMsg.assistantText(t.second))
                      }
                  }
                  return out
              }

              private fun process(text: String, speak: Boolean, parts: List<LlmPart>?) {
                  if (text.isEmpty() && parts == null) return
                  Voice.init(NovaxApp.instance)

                  if (parts == null) {
                      val goal = bgGoal(text)
                      if (goal != null) {
                          Bus.user(text)
                          val reply = if (goal.isEmpty()) "@Arkaplan yazdıktan sonra görevi de yaz. Örnek: @Arkaplan Play Store'dan eFootball indir." else BgTasks.start(goal)
                          Bus.novax(reply)
                          if (speak && Prefs.ttsOn) Voice.speak(reply) else Bus.setState(OrbState.IDLE)
                          return
                      }
                  }

                  Bus.user(text)
                  Bus.setState(OrbState.THINKING)
                  val history = toHistory()
                  MemoryStore.addTurn("user", text)
                  val token = CancelToken()
                  currentToken = token

                  var failed = false
                  var reply: String
                  try {
                      val local = if (parts == null) CommandRouter.tryHandle(text) else null
                      if (local != null) {
                          reply = local
                      } else {
                          val userParts: List<LlmPart> = parts ?: listOf(LlmPart.ofText(text))
                          val ctx = ToolCtx(false, token, 0)
                          reply = Agent.run(userParts, history, ctx, Prefs.maxSteps) { step -> Bus.log("⚙ " + step) }
                      }
                  } catch (e: Exception) {
                      failed = true
                      AppLog.e("brain", "istek başarısız", e)
                      reply = Llm.describeError(e)
                  }

                  if (reply.isBlank()) {
                      Bus.setState(OrbState.IDLE)
                      return
                  }
                  MemoryStore.addTurn("model", reply)
                  Bus.novax(reply)
                  if (failed) Bus.setState(OrbState.ERROR)
                  if (speak) {
                      Voice.speak(reply)
                  } else if (!failed) {
                      Bus.setState(OrbState.IDLE)
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Bus.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Bus.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.os.Handler
          import android.os.Looper
          import java.util.concurrent.CopyOnWriteArrayList

          enum class OrbState { IDLE, LISTENING, THINKING, SPEAKING, ERROR }

          /** Servis, ses motoru, beyin ve arayüz arasındaki hafif olay yolu. Tüm geri çağrılar ana thread'de gelir. */
          object Bus {
              interface Listener {
                  fun onUser(text: String) {}
                  fun onNovax(text: String) {}
                  fun onState(s: OrbState) {}
                  fun onLog(line: String) {}
                  fun onLevel(v: Float) {}
                  fun onPartial(text: String) {}
              }

              private val listeners = CopyOnWriteArrayList<Listener>()
              private val main = Handler(Looper.getMainLooper())

              @Volatile
              var current: OrbState = OrbState.IDLE

              /** Arayüz yeniden oluşturulduğunda sohbeti geri yüklemek için (rol, metin). */
              val transcript = CopyOnWriteArrayList<Pair<String, String>>()

              fun add(l: Listener) {
                  listeners.addIfAbsent(l)
              }

              fun remove(l: Listener) {
                  listeners.remove(l)
              }

              private fun each(f: (Listener) -> Unit) {
                  main.post {
                      for (l in listeners) f(l)
                  }
              }

              fun user(t: String) {
                  keep("user", t)
                  each { it.onUser(t) }
              }

              fun novax(t: String) {
                  keep("novax", t)
                  each { it.onNovax(t) }
              }

              fun log(t: String) {
                  AppLog.i("bus", t)
                  each { it.onLog(t) }
              }

              fun level(v: Float) {
                  each { it.onLevel(v) }
              }

              fun partial(t: String) {
                  each { it.onPartial(t) }
              }

              fun setState(s: OrbState) {
                  current = s
                  each { it.onState(s) }
              }

              private fun keep(role: String, t: String) {
                  transcript.add(Pair(role, t))
                  while (transcript.size > 150) transcript.removeAt(0)
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Calc.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Calc.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /** Basit özyinelemeli ifade çözücü: artı, eksi, çarpı, bölü ve parantez. */
          object Calc {
              fun tryEval(raw: String): Double? {
                  var s = raw.lowercase()
                      .replace("artı", "+").replace("arti", "+").replace("eksi", "-")
                      .replace("çarpı", "*").replace("carpi", "*").replace("kere", "*").replace("×", "*")
                      .replace("bölü", "/").replace("bolu", "/").replace("÷", "/").replace(",", ".")
                  s = s.replace(Regex("(?<=\\d)\\s*x\\s*(?=\\d)"), "*")
                  if (!s.any { it.isDigit() }) return null
                  if (s.any { !(it.isDigit() || it in "+-*/(). ") }) return null
                  if (!s.any { it in "+-*/" }) return null
                  return try {
                      val p = Parser(s.replace(" ", ""))
                      val v = p.expr()
                      if (p.done() && !v.isNaN() && !v.isInfinite()) v else null
                  } catch (_: Exception) {
                      null
                  }
              }

              private class Parser(val s: String) {
                  var i = 0
                  fun done(): Boolean = i >= s.length

                  fun expr(): Double {
                      var v = term()
                      while (i < s.length && (s[i] == '+' || s[i] == '-')) {
                          val op = s[i++]
                          val t = term()
                          v = if (op == '+') v + t else v - t
                      }
                      return v
                  }

                  fun term(): Double {
                      var v = factor()
                      while (i < s.length && (s[i] == '*' || s[i] == '/')) {
                          val op = s[i++]
                          val f = factor()
                          v = if (op == '*') v * f else v / f
                      }
                      return v
                  }

                  fun factor(): Double {
                      if (i < s.length && s[i] == '-') {
                          i++
                          return -factor()
                      }
                      if (i < s.length && s[i] == '(') {
                          i++
                          val v = expr()
                          if (i < s.length && s[i] == ')') i++ else throw IllegalStateException("paren")
                          return v
                      }
                      val st = i
                      while (i < s.length && (s[i].isDigit() || s[i] == '.')) i++
                      if (st == i) throw IllegalStateException("num")
                      return s.substring(st, i).toDouble()
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/CallAgent.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/CallAgent.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationManager
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.telecom.TelecomManager
          import android.telephony.TelephonyManager

          /**
           * Telefon devri: gelen aramayı (ayarlandıysa) açıp sahibi adına, kendini yapay zekâ asistanı olarak tanıtarak konuşur;
           * ayrıca sahibi adına arama yapıp bir görevi konuşabilir. Konuşma özeti bildirim ve not olarak kaydedilir.
           * Not: Android uygulamaların görüşme sesine doğrudan ses vermesine izin vermez; hoparlör + mikrofon yöntemi kullanılır.
           */
          object CallAgent {
              @Volatile var busy: Boolean = false
              @Volatile private var lastState: String = TelephonyManager.EXTRA_STATE_IDLE
              @Volatile private var incomingNumber: String = ""

              private fun ctx(): Context = NovaxApp.instance

              fun onPhoneState(state: String, number: String) {
                  lastState = state
                  if (state == TelephonyManager.EXTRA_STATE_RINGING) {
                      if (number.isNotEmpty()) incomingNumber = number
                      if (!busy && Prefs.callDelegateOn) {
                          busy = true
                          val t = Thread {
                              try {
                                  incoming()
                              } catch (e: Exception) {
                                  AppLog.e("call", "gelen çağrı işlenemedi", e)
                              } finally {
                                  busy = false
                                  Act.speaker(false)
                              }
                          }
                          t.start()
                      }
                  } else if (state == TelephonyManager.EXTRA_STATE_IDLE) {
                      incomingNumber = ""
                  }
              }

              private fun allowed(name: String, number: String): Boolean {
                  return when (Prefs.callWho) {
                      "all" -> true
                      "contacts" -> name.isNotBlank()
                      else -> name.isBlank()
                  }
              }

              private fun hasAnswerPerm(): Boolean =
                  ctx().checkSelfPermission(Manifest.permission.ANSWER_PHONE_CALLS) == PackageManager.PERMISSION_GRANTED

              private fun answer(): Boolean {
                  if (Build.VERSION.SDK_INT < 26 || !hasAnswerPerm()) return false
                  return try {
                      val tm = ctx().getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                      tm.acceptRingingCall()
                      true
                  } catch (e: Exception) {
                      AppLog.e("call", "çağrı açılamadı", e)
                      false
                  }
              }

              private fun hangup() {
                  if (Build.VERSION.SDK_INT < 28 || !hasAnswerPerm()) return
                  try {
                      val tm = ctx().getSystemService(Context.TELECOM_SERVICE) as TelecomManager
                      tm.endCall()
                  } catch (e: Exception) {
                      AppLog.e("call", "çağrı kapatılamadı", e)
                  }
              }

              private fun incoming() {
                  Thread.sleep(1300)
                  val number = incomingNumber
                  val name = Contacts.nameOfNumber(number)
                  if (!allowed(name, number)) return
                  val deadline = System.currentTimeMillis() + Prefs.callAnswerAfterSec * 1000L
                  while (System.currentTimeMillis() < deadline) {
                      if (lastState != TelephonyManager.EXTRA_STATE_RINGING) return
                      Thread.sleep(400)
                  }
                  if (lastState != TelephonyManager.EXTRA_STATE_RINGING) return
                  if (!answer()) {
                      Bus.novax("Gelen çağrıyı otomatik açamadım (Telefon yanıtlama izni gerekli).")
                      return
                  }
                  Thread.sleep(900)
                  Act.speaker(true)
                  Act.setVolume(100, "music")
                  val who = if (name.isNotBlank()) name else if (number.isNotBlank()) number else "bilinmeyen numara"
                  Bus.novax("Çağrıyı karşıladım: " + who)
                  val summary = converse(who, "", false)
                  if (Prefs.callEndAfter) hangup()
                  finish(who, summary)
              }

              /** Sahibi adına arar ve görevi konuşur. */
              fun runOutgoing(to: String, goal: String): String {
                  val c = Contacts.find(to) ?: return "HATA: '" + to + "' rehberde yok."
                  if (busy) return "HATA: Zaten bir görüşme sürüyor."
                  busy = true
                  try {
                      val r = Messaging.call(to)
                      if (r.startsWith("HATA")) return r
                      val end = System.currentTimeMillis() + 10000L
                      while (System.currentTimeMillis() < end && lastState != TelephonyManager.EXTRA_STATE_OFFHOOK) Thread.sleep(300)
                      Thread.sleep(1500)
                      Act.speaker(true)
                      Act.setVolume(100, "music")
                      val who = if (c.name.isBlank()) c.number else c.name
                      val summary = converse(who, goal, true)
                      hangup()
                      finish(who, summary)
                      return "Görüşme bitti. Özet: " + summary
                  } catch (e: Exception) {
                      AppLog.e("call", "giden çağrı hatası", e)
                      return "HATA: " + Llm.describeError(e)
                  } finally {
                      busy = false
                      Act.speaker(false)
                  }
              }

              private fun converse(who: String, goal: String, outgoing: Boolean): String {
                  val owner = Prefs.userName.ifBlank { "sahibi" }
                  val system = Persona.callSystem(who, goal, outgoing)
                  val client = Llm.client()
                  val msgs = ArrayList<LlmMsg>()
                  val transcript = StringBuilder()
                  msgs.add(LlmMsg.user("(görüşme başladı)"))

                  if (outgoing) {
                      val first = Voice.captureOnce(25000L)
                      if (first.isNotBlank()) {
                          transcript.append("Karşı taraf: ").append(first).append('\n')
                          msgs.clear()
                          msgs.add(LlmMsg.user(first))
                      }
                  }
                  val greeting = if (Prefs.callGreeting.isNotBlank() && !outgoing) Prefs.callGreeting
                  else if (outgoing) "Merhaba, ben " + owner + " adına arayan yapay zekâ asistanı Novax. " + goal
                  else "Merhaba, ben " + owner + " adına çağrıları karşılayan yapay zekâ asistanı Novax. Şu an müsait değil, mesajınızı iletebilirim."
                  msgs.add(LlmMsg.assistantText(greeting))
                  transcript.append("Novax: ").append(greeting).append('\n')
                  Voice.speakAndWait(greeting, 25000L)

                  val start = System.currentTimeMillis()
                  var silent = 0
                  var turns = 0
                  while (System.currentTimeMillis() - start < Prefs.callMaxSec * 1000L && turns < 24) {
                      if (lastState != TelephonyManager.EXTRA_STATE_OFFHOOK) break
                      val heard = Voice.captureOnce(9000L)
                      if (heard.isBlank()) {
                          silent++
                          if (silent >= 3) {
                              Voice.speakAndWait("Sizi duyamıyorum, görüşmeyi sonlandırıyorum. İyi günler.", 15000L)
                              transcript.append("Novax: (sessizlik nedeniyle kapattı)\n")
                              break
                          }
                          Voice.speakAndWait("Efendim, sizi duyamadım.", 8000L)
                          continue
                      }
                      silent = 0
                      transcript.append("Karşı taraf: ").append(heard).append('\n')
                      msgs.add(LlmMsg.user(heard))
                      val reply = try {
                          client.chat(system, msgs, null).text
                      } catch (e: Exception) {
                          AppLog.e("call", "model hatası", e)
                          "Bir sorun oluştu, mesajınızı sahibine ileteceğim. İyi günler. [BITTI]"
                      }
                      val ended = reply.contains("[BITTI]")
                      val text = reply.replace("[BITTI]", "").trim()
                      if (text.isNotEmpty()) {
                          msgs.add(LlmMsg.assistantText(text))
                          transcript.append("Novax: ").append(text).append('\n')
                          Voice.speakAndWait(text, 30000L)
                      }
                      if (ended) break
                      turns++
                  }
                  return try {
                      Llm.simple(
                          "Bir telefon görüşmesinin dökümünü Türkçe, 2-3 cümleyle özetle: karşı tarafın kim olduğu, isteği, yapılması gereken işler.",
                          transcript.toString()
                      )
                  } catch (e: Exception) {
                      Text.clip(transcript.toString(), 400)
                  } finally {
                      lastTranscript = transcript.toString()
                  }
              }

              @Volatile private var lastTranscript: String = ""

              private fun finish(who: String, summary: String) {
                  MemoryStore.addNote("Çağrı: " + who, summary + "\n\n" + lastTranscript)
                  Bus.novax("Görüşme özeti (" + who + "): " + summary)
                  try {
                      val c = ctx()
                      val n = Notification.Builder(c, NovaxApp.CH_ALERT)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle("Novax çağrı özeti: " + who)
                          .setContentText(Text.clip(summary, 120))
                          .setStyle(Notification.BigTextStyle().bigText(Text.clip(summary, 900)))
                          .setAutoCancel(true)
                          .build()
                      (c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify(9100 + (System.currentTimeMillis() % 500).toInt(), n)
                  } catch (e: Exception) {
                      AppLog.e("call", "bildirim gönderilemedi", e)
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/CameraController.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/CameraController.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.graphics.SurfaceTexture
          import android.hardware.camera2.CameraCaptureSession
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraDevice
          import android.hardware.camera2.CameraManager
          import android.hardware.camera2.CaptureRequest
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.Looper
          import android.view.Surface
          import android.view.TextureView
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /** Camera2 ile TextureView'e canlı önizleme; kareyi önizlemeden JPEG olarak verir. */
          class CameraController(private val ctx: Context, private val tv: TextureView) {
              private val mgr = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
              private val main = Handler(Looper.getMainLooper())
              private var device: CameraDevice? = null
              private var session: CameraCaptureSession? = null
              private var thread: HandlerThread? = null
              private var handler: Handler? = null
              private var front = true
              private var previewW = 1280
              private var previewH = 720

              val isFront: Boolean get() = front

              private val listener = object : TextureView.SurfaceTextureListener {
                  override fun onSurfaceTextureAvailable(surface: SurfaceTexture, width: Int, height: Int) {
                      openCamera()
                  }

                  override fun onSurfaceTextureSizeChanged(surface: SurfaceTexture, width: Int, height: Int) {
                      applyTransform()
                  }

                  override fun onSurfaceTextureDestroyed(surface: SurfaceTexture): Boolean = true

                  override fun onSurfaceTextureUpdated(surface: SurfaceTexture) {}
              }

              fun start(useFront: Boolean) {
                  front = useFront
                  if (thread == null) {
                      val t = HandlerThread("novax-cam")
                      t.start()
                      thread = t
                      handler = Handler(t.looper)
                  }
                  if (tv.isAvailable) {
                      openCamera()
                  } else {
                      tv.surfaceTextureListener = listener
                  }
              }

              fun switchCamera() {
                  closeCamera()
                  front = !front
                  if (tv.isAvailable) openCamera()
              }

              fun stop() {
                  closeCamera()
                  try {
                      thread?.quitSafely()
                  } catch (_: Exception) {
                  }
                  thread = null
                  handler = null
              }

              private fun closeCamera() {
                  try {
                      session?.close()
                  } catch (_: Exception) {
                  }
                  session = null
                  try {
                      device?.close()
                  } catch (_: Exception) {
                  }
                  device = null
              }

              private fun pickCameraId(): String? {
                  val want = if (front) CameraCharacteristics.LENS_FACING_FRONT else CameraCharacteristics.LENS_FACING_BACK
                  for (id in mgr.cameraIdList) {
                      val ch = mgr.getCameraCharacteristics(id)
                      if (ch.get(CameraCharacteristics.LENS_FACING) == want) return id
                  }
                  return if (mgr.cameraIdList.isNotEmpty()) mgr.cameraIdList[0] else null
              }

              private fun openCamera() {
                  if (ctx.checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      Bus.log("Kamera izni yok")
                      return
                  }
                  val h = handler ?: return
                  try {
                      closeCamera()
                      val id = pickCameraId() ?: return
                      val ch = mgr.getCameraCharacteristics(id)
                      val map = ch.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP)
                      val sizes = map?.getOutputSizes(SurfaceTexture::class.java)
                      if (sizes != null && sizes.isNotEmpty()) {
                          var best = sizes[0]
                          var bestArea = -1L
                          for (s in sizes) {
                              val area = s.width.toLong() * s.height.toLong()
                              if (s.width <= 1280 && s.height <= 720 && area > bestArea) {
                                  best = s
                                  bestArea = area
                              }
                          }
                          previewW = best.width
                          previewH = best.height
                      }
                      mgr.openCamera(id, object : CameraDevice.StateCallback() {
                          override fun onOpened(camera: CameraDevice) {
                              device = camera
                              createSession(camera)
                          }

                          override fun onDisconnected(camera: CameraDevice) {
                              camera.close()
                              device = null
                          }

                          override fun onError(camera: CameraDevice, error: Int) {
                              AppLog.e("cam", "kamera hatası kodu " + error)
                              camera.close()
                              device = null
                          }
                      }, h)
                  } catch (e: Exception) {
                      AppLog.e("cam", "kamera açılamadı", e)
                  }
              }

              @Suppress("DEPRECATION")
              private fun createSession(camera: CameraDevice) {
                  val h = handler ?: return
                  try {
                      val st = tv.surfaceTexture ?: return
                      st.setDefaultBufferSize(previewW, previewH)
                      val surface = Surface(st)
                      val b = camera.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                      b.addTarget(surface)
                      b.set(CaptureRequest.CONTROL_AF_MODE, CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_PICTURE)
                      camera.createCaptureSession(listOf(surface), object : CameraCaptureSession.StateCallback() {
                          override fun onConfigured(s: CameraCaptureSession) {
                              session = s
                              try {
                                  s.setRepeatingRequest(b.build(), null, h)
                              } catch (e: Exception) {
                                  AppLog.e("cam", "önizleme başlatılamadı", e)
                              }
                          }

                          override fun onConfigureFailed(s: CameraCaptureSession) {
                              AppLog.e("cam", "oturum yapılandırılamadı")
                          }
                      }, h)
                      main.post { applyTransform() }
                  } catch (e: Exception) {
                      AppLog.e("cam", "oturum oluşturulamadı", e)
                  }
              }

              /** Dikey ekranda önizlemeyi ortalayıp doldurur (center-crop); ön kamerada ayna görüntüsü. */
              private fun applyTransform() {
                  val vw = tv.width.toFloat()
                  val vh = tv.height.toFloat()
                  if (vw <= 0f || vh <= 0f) return
                  val a = contentAspect()
                  val v = vw / vh
                  var sx = 1f
                  var sy = 1f
                  if (a > v) sx = (vh * a) / vw else sy = (vw / a) / vh
                  val m = Matrix()
                  m.setScale(if (front) -sx else sx, sy, vw / 2f, vh / 2f)
                  tv.setTransform(m)
              }

              /** Önizleme içeriğinin (döndürülmüş) en/boy oranı. */
              private fun contentAspect(): Float {
                  val portrait = tv.height >= tv.width
                  return if (portrait) previewH.toFloat() / previewW.toFloat() else previewW.toFloat() / previewH.toFloat()
              }

              /** Anlık kareyi JPEG base64 olarak döner (en çok maxSide piksel). */
              fun frameBase64(maxSide: Int): String? {
                  val latch = CountDownLatch(1)
                  val holder = arrayOfNulls<Bitmap>(1)
                  main.post {
                      try {
                          if (tv.isAvailable) {
                              val a = contentAspect()
                              val w: Int
                              val h: Int
                              if (a < 1f) {
                                  h = maxSide
                                  w = (maxSide * a).toInt().coerceAtLeast(2)
                              } else {
                                  w = maxSide
                                  h = (maxSide / a).toInt().coerceAtLeast(2)
                              }
                              holder[0] = tv.getBitmap(w, h)
                          }
                      } catch (e: Exception) {
                          AppLog.e("cam", "kare alınamadı", e)
                      }
                      latch.countDown()
                  }
                  try {
                      latch.await(3, TimeUnit.SECONDS)
                  } catch (_: InterruptedException) {
                  }
                  val b = holder[0] ?: return null
                  return MediaAnalyzer.bitmapBase64(b, maxSide, 78)
              }
          }
