                      sb.append(owner()).append(" şu an telefona bakamıyor; arayan: ").append(who).append(". Çağrıyı onun adına karşıladın.\n")
                  }
                  sb.append("KURALLAR\n")
                  sb.append("- İlk cümlede yapay zekâ asistanı olduğunu açıkça söyle; asla insan taklidi yapma.\n")
