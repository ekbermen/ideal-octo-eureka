                  r("(?:(.+?)\\s+)?ayarlar\\w*\\s+(?:sayfas\\w*\\s+)?(?:aç|ac|göster|goster|git)") { m -> Act.openSettings(m.g(1).ifBlank { "ayarlar" }) }
                  r("(wifi|wi-fi|bluetooth|mobil veri|uçak modu|ucak modu|konum|otomatik döndürme|otomatik dondurme|hotspot|pil tasarrufu|nfc|rahatsız etme|rahatsiz etme)\\w*\\s+(?:modunu\\s+|özelliğini\\s+|ozelligini\\s+)?(aç|ac|kapat|çalıştır|calistir|devre dışı bırak|etkinleştir)") { m ->
                      if (!acc()) Act.openSettings(m.g(1)) + " Doğrudan çevirmek için erişilebilirlik gerekir."
                      else Act.quickToggle(m.g(1), isOnWord.containsMatchIn(m.g(2)))
                  }
                  r("(?:fotoğraf|fotograf|foto|resim)\\s+çek|(?:selfie)\\s+(?:çek|cek)|fotoğraf çek") { m -> Act.takePhoto(m.value.contains("selfie", true)) }
                  r("(?:kamerayı|kamerayi)\\s+aç") { Act.openApp("kamera") }

                  // ============================================================ uygulama aç
                  r("(.+?)\\s+(?:uygulamas\\w*\\s+|programı\\s+|app\\s+)?" + OPEN) { m -> if (Apps.find(m.g(1)) == null) null else Act.openApp(m.g(1)) }
                  r(OPEN + "\\s+(.+?)(?:\\s+uygulamas\\w*)?") { m -> if (Apps.find(m.g(1)) == null) null else Act.openApp(m.g(1)) }
                  r("(.+?)\\s+(?:uygulamas\\w*|app)\\s*(?:a|e|ya|ye|na|ne)?\\s*(?:gir|git)") { m -> if (Apps.find(m.g(1)) == null) null else Act.openApp(m.g(1)) }
                  r("(.+?)(?:'?(?:a|e|ya|ye))?\\s+gir") { m -> if (Apps.find(m.g(1)) == null) null else Act.openApp(m.g(1)) }

                  // ============================================================ hafıza & notlar
                  r("(?:bunu\\s+|şunu\\s+|sunu\\s+)?(?:hatırla|hatirla|aklında tut|aklinda tut|kaydet|unutma)\\s*[:,]?\\s+(.+)") { m ->
                      val v = m.g(1)
                      val key = v.split(" ").take(4).joinToString(" ")
                      MemoryStore.remember(key, v)
                      pick("Kaydettim.", "Aklımda tutacağım.", "Tamam, unutmayacağım.")
                  }
                  r("(?:benim\\s+)?(?:adım|adim|ismim)\\s+(.+)|bana\\s+(.+?)\\s+(?:de|diye hitap et|diye seslen)") { m ->
                      val n = Text.cap((m.g(1).ifBlank { m.g(2) }).trim())
                      Prefs.userName = n
                      MemoryStore.remember("kullanıcı adı", n)
                      "Memnun oldum $n."
                  }
                  r("(?:ne hatırlıyorsun|neler hatırlıyorsun|hafızanda ne var|beni tanıyor musun|benim hakkımda ne biliyorsun|hafızanı oku)") {
                      val f = MemoryStore.recall("")
                      if (f.isEmpty()) "Henüz senin hakkında bir şey kaydetmedim."
                      else "Şunları biliyorum: " + f.take(12).joinToString(". ") { it.first + ": " + it.second }
                  }
                  r("(.+?)\\s+neydi") { m ->
                      val f = MemoryStore.recall(m.g(1).split(" ").first())
                      if (f.isEmpty()) null else f.take(3).joinToString(". ") { it.first + ": " + it.second }
                  }
                  r("(.+?)\\s+(?:unut|sil|hafızadan sil|hafizadan sil)") { m ->
                      if (MemoryStore.recall(m.g(1)).isEmpty()) {
                          null
                      } else {
                          MemoryStore.forget(m.g(1))
                          "Unuttum."
                      }
                  }
                  r("(?:konuşmayı|konusmayi|sohbeti|geçmişi|gecmisi)\\s+(?:temizle|sil|sıfırla|sifirla)") {
                      MemoryStore.clearTurns()
                      "Konuşma geçmişini temizledim."
                  }
                  r("(?:not\\s+(?:al|yaz|et|kaydet)|notlara?\\s+(?:ekle|yaz))\\s*[:,]?\\s+(.+)") { m ->
                      val v = m.g(1)
                      Act.createNote(v.take(28), v)
                  }
                  r("notlarım\\w*\\s*(?:oku|göster|listele|ne|neler)?|notlari\\s+(?:oku|göster|listele)") {
                      val n = MemoryStore.notes(5)
                      if (n.isEmpty()) "Hiç notun yok." else n.joinToString(". ")
                  }

                  // ============================================================ hesap makinesi
                  r("(?:hesapla\\s+|kaç eder\\s+)?(.+?)(?:\\s+(?:kaç eder|kaçtır|kac eder|eşittir|eder))?") { m ->
                      val v = Calc.tryEval(m.g(1))
                      if (v == null) {
                          null
                      } else {
                          val s = if (v == Math.floor(v) && Math.abs(v) < 1e15) {
                              v.toLong().toString()
                          } else {
                              String.format(java.util.Locale.US, "%.4f", v).trimEnd('0').trimEnd('.').replace('.', ',')
                          }
                          "Sonuç $s."
                      }
                  }

                  // ============================================================ kontrol
                  r("(?:sus|dur|yeter|tamam sus|sessiz ol|kapa çeneni)") {
                      Voice.stopSpeaking()
                      Brain.cancelCurrent()
                      ""
                  }
                  r("(?:uyu|uyku moduna geç|dinlemeyi bırak|dinleme|beni dinleme)") {
                      Prefs.wakeOn = false
                      Voice.stopAll()
                      "Uyku modundayım. Bildirimden Dinle'ye basarak beni uyandırabilirsin."
                  }
                  r("(?:beni dinle|dinlemeye başla|uyan|hep dinle)") {
                      Prefs.wakeOn = true
                      Voice.startWake()
                      "Dinliyorum."
                  }
                  r("(?:kendini kapat|çıkış yap|cikis yap|novax kapan|servisi durdur)") {
                      NovaxService.stop(NovaxApp.instance)
                      "Görüşürüz ${who()}."
                  }
                  r("(türkçe|turkce|ingilizce|english|almanca|fransızca|ispanyolca)\\s+(?:konuş|konus|moduna geç|moduna gec)") { m ->
                      val code = when (Text.norm(m.g(1))) {
                          "ingilizce", "english" -> "en-US"
                          "almanca" -> "de-DE"
                          "fransizca" -> "fr-FR"
                          "ispanyolca" -> "es-ES"
                          else -> "tr-TR"
                      }
                      Prefs.lang = code
                      Voice.applyLanguage()
                      if (code == "tr-TR") "Türkçe konuşuyorum." else "Language changed."
                  }
              }

              // ------------------------------------------------------------------ yardımcılar
              private fun sendMsg(rest: String, whole: String): String? {
                  if (!Contacts.granted()) return null
                  val split = Messaging.splitNameText(rest) ?: return null
                  val c = split.first
                  val text = split.second
                  val useSms = Regex("(?i)\\bsms\\b").containsMatchIn(whole)
                  val dest = c.name.ifBlank { c.number }
                  return if (useSms) Messaging.sms(dest, text) else Messaging.whatsapp(dest, text)
              }

              private fun callIfContact(name: String): String? {
                  if (!Contacts.granted()) return null
                  if (Contacts.find(name) == null) return null
                  return Messaging.call(name)
              }
          }
          NOVAX_EOF

