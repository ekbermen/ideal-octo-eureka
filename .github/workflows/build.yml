                  ttsCb = Ui.check(this, "Sesli cevap ver", Prefs.ttsOn)
                  overlayCb = Ui.check(this, "Yüzen orb göster (Üstte göster izni)", Prefs.overlayOn)
                  fastCb = Ui.check(this, "Hızlı ekran modu (beklemeler kısalır)", Prefs.fastMode)
