          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import org.json.JSONArray
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream

          /** Dosya/kod oluşturma: Download/Novax içine kaydeder ve sohbete indirme düğmesi koyar. */
          object FileOps {
              private fun safe(n: String): String =
                  n.replace(Regex("[\\\\:*?\"<>|]"), "_").trim().trimStart('/').ifBlank { "dosya.txt" }

              fun save(nameIn: String, bytes: ByteArray, mime: String): Pair<String, String>? {
                  val name = safe(nameIn).substringAfterLast('/')
                  val ctx = NovaxApp.instance
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          val cv = ContentValues()
                          cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                          cv.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                          cv.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/Novax")
                          val cr = ctx.contentResolver
                          val uri = cr.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv) ?: return null
                          val os = cr.openOutputStream(uri) ?: return null
                          os.use { it.write(bytes) }
                          return Pair("Download/Novax/" + name, uri.toString())
                      }
                      val dir = File(ctx.getExternalFilesDir(null), "files")
                      dir.mkdirs()
                      val f = File(dir, name)
                      f.writeBytes(bytes)
                      return Pair(f.absolutePath, Uri.fromFile(f).toString())
                  } catch (e: Exception) {
                      AppLog.e("file", "kaydedilemedi", e)
                      return null
                  }
              }

              fun writeText(name: String, content: String): String {
                  if (content.isEmpty()) return "HATA: içerik boş"
                  val r = save(name, content.toByteArray(Charsets.UTF_8), "application/octet-stream")
                      ?: return "HATA: dosya kaydedilemedi"
                  Bus.file(r.first.substringAfterLast('/'), r.second)
                  return "Dosya hazır: " + r.first + " (" + content.length + " karakter). Sohbette indirme düğmesi çıktı."
              }

              /** files: [{"path":"src/main.py","content":"..."}] */
              fun zip(name: String, filesJson: String): String {
                  val arr = try {
                      JSONArray(filesJson)
                  } catch (e: Exception) {
                      return "HATA: files geçerli JSON dizisi olmalı: " + e.message
                  }
                  if (arr.length() == 0) return "HATA: dosya listesi boş"
                  val bos = ByteArrayOutputStream()
                  ZipOutputStream(bos).use { z ->
                      for (i in 0 until arr.length()) {
                          val o = arr.optJSONObject(i) ?: continue
                          val p = o.optString("path", "dosya" + i + ".txt").trimStart('/').replace("..", "_")
                          z.putNextEntry(ZipEntry(p))
                          z.write(o.optString("content", "").toByteArray(Charsets.UTF_8))
                          z.closeEntry()
                      }
                  }
                  val zn = if (name.endsWith(".zip")) name else name + ".zip"
                  val r = save(zn, bos.toByteArray(), "application/zip") ?: return "HATA: zip kaydedilemedi"
                  Bus.file(r.first.substringAfterLast('/'), r.second)
                  return "Proje zip hazır: " + r.first + " (" + arr.length() + " dosya)."
              }

              private fun resolve(path: String): File {
                  val f = File(path)
                  if (f.isAbsolute) return f
                  return File(File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "Novax"), path)
              }

              fun read(path: String): String {
                  val f = resolve(path)
                  if (!f.exists()) return "HATA: dosya yok: " + f.absolutePath
                  return try {
                      Text.clip(f.readText(), 8000)
                  } catch (e: Exception) {
                      "HATA: okunamadı: " + e.message + " (Tüm dosyalara erişim izni gerekebilir)"
                  }
              }

              fun list(dir: String): String {
                  val d = if (dir.isBlank()) resolve("") else resolve(dir)
                  val l = d.listFiles() ?: return "Klasör boş ya da okunamıyor: " + d.absolutePath
                  return l.sortedByDescending { it.lastModified() }.take(60).joinToString("\n") { (if (it.isDirectory) "[klasör] " else "") + it.name + " (" + it.length() / 1024L + " KB)" }
              }
          }
          NOVAX_EOF

          cat > $D/Adb.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.graphics.BitmapFactory
          import android.util.Base64
          import dadb.AdbKeyPair
          import dadb.Dadb
          import java.io.File

          /**
           * Uzak cihaz yönetimi (ADB). Bilgisayar USB ile telefona bağlıyken 'adb forward' + 'adb reverse'
           * ile Novax telefonundan localhost:PORT üzerinden hedef cihazın adbd'sine ulaşılır.
           */
          object Adb {
              const val NEED = "HATA: Uzak cihaza bağlı değilim. Önce adb_connect çağır (Ayarlar > Bilgisayar / USB)."

              @Volatile private var dadb: Dadb? = null
              private class N(val label: String, val x: Int, val y: Int)
              private var cache: List<N> = emptyList()

              private fun keys(): AdbKeyPair {
                  val dir = NovaxApp.instance.filesDir
                  val priv = File(dir, "adbkey")
                  val pub = File(dir, "adbkey.pub")
                  if (!priv.exists() || !pub.exists()) AdbKeyPair.generate(priv, pub)
                  return AdbKeyPair.read(priv, pub)
              }

              @Synchronized
              fun connect(hostIn: String, portIn: Int): String {
                  close()
                  val host = hostIn.ifBlank { Prefs.adbHost }
                  val port = if (portIn > 0) portIn else Prefs.adbPort
                  return try {
                      val x = Dadb.create(host, port, keys())
                      val model = x.shell("getprop ro.product.model").output.trim()
                      dadb = x
                      "Uzak cihaza bağlandı: " + model + " (" + host + ":" + port + ")"
                  } catch (e: Exception) {
                      AppLog.e("adb", "bağlanamadı", e)
                      "HATA: ADB bağlantısı kurulamadı (" + e.javaClass.simpleName + "). Hedef telefonda USB hata ayıklama açık ve 'USB hata ayıklamasına izin ver' penceresi onaylı olmalı."
                  }
              }

              @Synchronized
              fun close() {
                  try {
                      dadb?.close()
                  } catch (_: Exception) {
                  }
                  dadb = null
              }

              fun connected(): Boolean = dadb != null

              fun sh(cmd: String): String {
                  val d = dadb ?: return NEED
                  return try {
                      val r = d.shell(cmd)
                      (r.output + r.errorOutput).trim()
                  } catch (e: Exception) {
                      "HATA: " + e.javaClass.simpleName + ": " + (e.message ?: "")
                  }
              }

              private val risky = Regex("(?i)(rm\\s+-|pm\\s+uninstall|pm\\s+clear|wipe|reboot|factory|format|dd\\s+if|settings\\s+put\\s+global\\s+adb)")

              fun shell(cmd: String): String {
                  if (!connected()) return NEED
                  if (risky.containsMatchIn(cmd) && !Confirm.gate("Uzak cihazda şu komutu çalıştırayım mı: " + Text.clip(cmd, 80))) return "Kullanıcı onaylamadı."
                  return Text.clip(sh(cmd), 5000)
              }

              fun tap(x: Int, y: Int): String {
                  val r = sh("input tap " + x + " " + y)
                  return if (r.startsWith("HATA")) r else "Uzak cihazda dokundum (" + x + "," + y + ")"
              }

              fun swipe(x1: Int, y1: Int, x2: Int, y2: Int, ms: Int): String {
                  val r = sh("input swipe " + x1 + " " + y1 + " " + x2 + " " + y2 + " " + ms)
                  return if (r.startsWith("HATA")) r else "Kaydırdım"
              }

              private fun ascii(s: String): String {
                  val sb = StringBuilder()
                  for (c in s) {
                      sb.append(
                          when (c) {
                              'ı' -> 'i'; 'İ' -> 'I'; 'ş' -> 's'; 'Ş' -> 'S'; 'ğ' -> 'g'; 'Ğ' -> 'G'
                              'ü' -> 'u'; 'Ü' -> 'U'; 'ö' -> 'o'; 'Ö' -> 'O'; 'ç' -> 'c'; 'Ç' -> 'C'
                              else -> c
                          }
                      )
                  }
                  return sb.toString()
              }

              fun text(t: String): String {
                  val clean = ascii(t).replace("\n", " ").replace(Regex("[^A-Za-z0-9 ._,@:/+=-]"), "")
                  if (clean.isBlank()) return "HATA: yazılacak ASCII metin yok (ADB 'input text' Türkçe/özel karakterleri yazamaz)."
                  val r = sh("input text '" + clean.replace(" ", "%s") + "'")
                  return if (r.startsWith("HATA")) r else "Yazdım (Türkçe harfler ASCII'ye çevrildi)."
              }

              fun key(k: String): String {
                  val code = when (k.lowercase().trim()) {
                      "back", "geri" -> 4
                      "home", "ana ekran" -> 3
                      "recents", "son uygulamalar" -> 187
                      "enter", "gonder" -> 66
                      "power", "guc" -> 26
                      "wake" -> 224
                      "volup" -> 24
                      "voldown" -> 25
                      "delete", "sil" -> 67
                      "tab" -> 61
                      else -> -1
                  }
                  if (code < 0) return "HATA: bilinmeyen tuş " + k
                  val r = sh("input keyevent " + code)
                  return if (r.startsWith("HATA")) r else "Bastım: " + k
              }

              fun open(nameOrPkg: String): String {
                  val pkg = if (nameOrPkg.contains(".")) nameOrPkg.trim() else (Apps.pkgOf(nameOrPkg) ?: return "HATA: paket bulunamadı; paket adını ver.")
                  if (!Regex("[A-Za-z0-9._]+").matches(pkg)) return "HATA: geçersiz paket adı"
                  val r = sh("monkey -p " + pkg + " -c android.intent.category.LAUNCHER 1")
                  return if (r.startsWith("HATA")) r else "Uzak cihazda açıldı: " + pkg
              }

              private fun attr(n: String, name: String): String =
                  Regex("(?:^|\\s)" + name + "=\"([^\"]*)\"").find(n)?.groupValues?.get(1)
                      ?.replace("&amp;", "&")?.replace("&quot;", "\"")?.replace("&lt;", "<")?.replace("&gt;", ">")?.replace("&#10;", " ") ?: ""

              fun read(): String {
                  if (!connected()) return NEED
                  val xml = sh("uiautomator dump /dev/tty")
                  if (xml.startsWith("HATA")) return xml
                  val list = ArrayList<N>()
                  val sb = StringBuilder("Uzak ekran:\n")
                  for (m in Regex("<node [^>]*>").findAll(xml)) {
                      if (list.size >= 80) break
                      val n = m.value
                      val t = attr(n, "text")
                      val d = attr(n, "content-desc")
                      val label = if (t.isNotEmpty()) t else d
                      val click = attr(n, "clickable") == "true"
                      if (label.isEmpty() && !click) continue
                      val b = Regex("\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]").find(attr(n, "bounds")) ?: continue
                      val l = b.groupValues[1].toInt()
                      val tp = b.groupValues[2].toInt()
                      val r = b.groupValues[3].toInt()
                      val bt = b.groupValues[4].toInt()
                      val cx = (l + r) / 2
                      val cy = (tp + bt) / 2
                      sb.append('[').append(list.size).append("] \"").append(Text.clip(label, 60)).append('"')
                      if (click) sb.append(" [tıklanır]")
                      sb.append(" @").append(cx).append(',').append(cy).append('\n')
                      list.add(N(label, cx, cy))
                  }
                  cache = list
                  if (list.isEmpty()) sb.append("(öğe okunamadı; adb_screen_describe dene)")
                  return sb.toString()
              }

              fun tapIndex(i: Int): String {
                  if (i < 0 || i >= cache.size) return "HATA: [" + i + "] yok. Önce adb_screen_read çağır."
                  val n = cache[i]
                  return tap(n.x, n.y)
              }

              fun describe(question: String): String {
                  if (!connected()) return NEED
                  val out = sh("screencap -p | base64")
                  if (out.startsWith("HATA")) return out
                  return try {
                      val bytes = Base64.decode(out, Base64.DEFAULT)
                      val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size) ?: return "HATA: ekran görüntüsü çözülemedi"
                      val b64 = MediaAnalyzer.bitmapBase64(bmp, 1280, 72)
                      val msg = LlmMsg.userParts(listOf(LlmPart.ofText(question), LlmPart.ofImage(b64)))
                      Llm.visionClient().chat("Bu uzak bir Android cihazın ekranı. Türkçe, kısa ve net cevap ver.", listOf(msg), null).text.ifBlank { "Yorumlanamadı." }
                  } catch (e: Exception) {
                      "HATA: " + Llm.describeError(e)
                  }
              }
          }
          NOVAX_EOF

          cat > $D/IgBot.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /**
           * Instagram DM: kullanıcı Instagram uygulamasında zaten girişli olduğu için ŞİFRE GEREKMEZ.
           * Instagram bildirimlerindeki "yanıtla" alanı (RemoteInput) üzerinden cevap yazar.
           */
          object IgBot {
              const val PKG = "com.instagram.android"
              private val done = HashSet<String>()
              private val cool = HashMap<String, Long>()
              private val hourly = ArrayList<Long>()

              private fun system(): String {
                  val owner = Prefs.userName.ifBlank { "hesap sahibi" }
                  val sb = StringBuilder()
                  sb.append("Sen ").append(owner).append(" adına Instagram mesajlarına cevap yazan yapay zekâ asistanısın.\n")
                  sb.append("- Kısa (1-3 cümle), samimi, doğal Türkçe yaz; markdown/emoji abartısı yok.\n")
                  sb.append("- Biri sorarsa yapay zekâ asistanı olduğunu söyle; insan taklidi yapma.\n")
                  sb.append("- Para, ödeme, şifre, adres, söz verme, randevu onayı gibi şeylerde karar verme; 'sahibine ileteceğim' de.\n")
                  sb.append("- Tehdit, dolandırıcılık, taciz ya da reklam gibi görünen mesajlara cevap verme; sadece SKIP yaz.\n")
                  sb.append("- Cevaba sadece gönderilecek metni yaz, başka açıklama ekleme.\n")
                  if (Prefs.igAccount.isNotBlank()) sb.append("Hesap: ").append(Prefs.igAccount).append("\n")
                  if (Prefs.igRules.isNotBlank()) sb.append("Sahibinin özel talimatı: ").append(Prefs.igRules).append("\n")
                  return sb.toString()
              }

              fun onNotif(e: NotifStore.Entry) {
                  if (!Prefs.igAuto || e.pkg != PKG || !e.canReply) return
                  Brain.runAsync(Runnable {
                      try {
                          Thread.sleep(3000L + (Math.random() * 5000.0).toLong())
                          val r = handle(e)
                          AppLog.i("ig", "otomatik: " + r)
                      } catch (ex: Exception) {
                          AppLog.e("ig", "otomatik cevap hatası", ex)
                      }
                  })
              }

              private fun handle(e: NotifStore.Entry): String {
                  val id = e.key + ":" + e.time
                  synchronized(this) {
                      if (!done.add(id)) return "zaten işlendi"
                      val now = System.currentTimeMillis()
                      hourly.removeAll { now - it > 3600000L }
                      if (hourly.size >= 30) return "saatlik sınır (30) doldu"
                      val last = cool[e.title] ?: 0L
                      if (now - last < 15000L) return "çok sık (aynı kişi)"
                      cool[e.title] = now
                      hourly.add(now)
                  }
                  if (e.text.isBlank()) return "mesaj boş"
                  val reply = try {
                      Llm.simple(system(), "Gönderen: " + e.title + "\nMesaj: " + e.text).trim()
                  } catch (ex: Exception) {
                      return "model hatası: " + Llm.describeError(ex)
                  }
                  if (reply.isBlank() || reply.uppercase().startsWith("SKIP")) return e.title + ": cevap verilmedi (SKIP)"
                  val items = NotifStore.recent(30, "instagram")
                  val idx = items.indexOfFirst { it.key == e.key } + 1
                  if (idx < 1) return "bildirim kayboldu"
                  val r = NotifStore.reply(idx, "instagram", reply)
                  return e.title + " -> \"" + Text.clip(reply, 80) + "\" : " + r
              }

              fun check(auto: Boolean): String {
                  if (NovaxNotifListener.instance == null) return "HATA: Bildirim erişimi kapalı (Ayarlar > İzinler > Bildirim erişimi)."
                  val items = NotifStore.recent(20, "instagram")
                  if (items.isEmpty()) return "Instagram'dan bekleyen bildirim yok. (Mesaj bildirimleri kapalıysa ya da bildirim temizlendiyse ekrandan bakmam gerekir.)"
                  val sb = StringBuilder()
                  for (i in items.indices) {
                      val e = items[i]
                      sb.append(i + 1).append(". ").append(e.title).append(": ").append(Text.clip(e.text, 120))
                      if (e.canReply) sb.append(" [yanıtlanabilir]")
                      sb.append('\n')
                      if (auto && e.canReply) sb.append("   → ").append(handle(e)).append('\n')
                  }
                  return sb.toString().trim()
              }
          }
          NOVAX_EOF

          cat > $D/V3Tools.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import org.json.JSONObject

          /** v3 araçları: dosya/kod, ADB (USB bilgisayar), Instagram, hesap makinesi. */
          object V3Tools {
              private fun s(n: String, d: String, r: Boolean = true) = Tools.P(n, "string", d, r)
              private fun i(n: String, d: String, r: Boolean = true) = Tools.P(n, "integer", d, r)
              private fun b(n: String, d: String, r: Boolean = true) = Tools.P(n, "boolean", d, r)
              private fun JSONObject.str(k: String): String = optString(k, "").trim()

              fun install(reg: (String, String, List<Tools.P>, (JSONObject, ToolCtx) -> String) -> Unit) {
                  // ---------------------------------------------------- dosya & kod
                  reg("write_file", "Gerçek bir dosya (kod, metin, html, json...) oluşturur; Download/Novax içine kaydeder ve sohbette indirme düğmesi gösterir.",
                      listOf(s("name", "Uzantılı dosya adı, ör. bot.py"), s("content", "Dosyanın tam içeriği"))) { a, _ -> FileOps.writeText(a.str("name"), a.optString("content")) }
                  reg("create_project_zip", "Çok dosyalı proje oluşturup zip yapar ve indirme düğmesi gösterir. files: JSON dizisi [{\"path\":\"src/a.py\",\"content\":\"...\"}].",
                      listOf(s("name", "Zip adı"), s("files", "JSON dizi metni"))) { a, _ -> FileOps.zip(a.str("name"), a.optString("files")) }
                  reg("read_file", "Bir dosyanın metnini okur (yol ya da Download/Novax içindeki ad).", listOf(s("path", "Dosya yolu/adı"))) { a, _ -> FileOps.read(a.str("path")) }
                  reg("list_files", "Download/Novax (ya da verilen klasör) içindeki dosyaları listeler.", listOf(s("dir", "Klasör", false))) { a, _ -> FileOps.list(a.str("dir")) }
                  reg("calculate", "Matematik ifadesini hesaplar (+ - * / parantez).", listOf(s("expression", "İfade"))) { a, _ ->
                      val v = Calc.tryEval(a.str("expression"))
                      if (v == null) "HATA: ifade çözülemedi" else v.toString()
                  }

                  // ---------------------------------------------------- Instagram
                  reg("instagram_check", "Instagram mesaj bildirimlerini kontrol eder. auto_reply=true ise yanıtlanabilir mesajlara sahibi adına cevap yazar. Şifre gerekmez; telefonda Instagram'a girişli olmalı.",
                      listOf(b("auto_reply", "true=cevapları da yaz", false))) { a, _ -> IgBot.check(a.optBoolean("auto_reply", true)) }

                  // ---------------------------------------------------- ADB (USB ile bağlı bilgisayar/telefon)
                  reg("adb_connect", "USB ile bağlı bilgisayar üzerinden (adb forward/reverse) ya da ağdan uzak Android cihaza bağlanır. host/port boşsa Ayarlar'daki değerler.",
                      listOf(s("host", "Adres (varsayılan localhost)", false), i("port", "Port", false))) { a, _ -> Adb.connect(a.str("host"), a.optInt("port", 0)) }
                  reg("adb_disconnect", "Uzak cihaz bağlantısını kapatır.", emptyList()) { _, _ -> Adb.close(); "Bağlantı kapatıldı." }
                  reg("adb_screen_read", "Uzak cihazın ekranını numaralı listeler (adb_tap_index için).", emptyList()) { _, _ -> Adb.read() }
                  reg("adb_screen_describe", "Uzak cihazın ekran görüntüsünü alıp görsel yapay zekâ ile soruyu cevaplar.", listOf(s("question", "Soru", false))) { a, _ ->
                      Adb.describe(a.str("question").ifBlank { "Ekranda ne var?" })
                  }
                  reg("adb_tap_index", "Uzak cihazda adb_screen_read listesindeki öğeye dokunur.", listOf(i("index", "Öğe numarası"))) { a, _ -> Adb.tapIndex(a.optInt("index", -1)) }
                  reg("adb_tap", "Uzak cihazda koordinata dokunur.", listOf(i("x", "X"), i("y", "Y"))) { a, _ -> Adb.tap(a.optInt("x"), a.optInt("y")) }
                  reg("adb_swipe", "Uzak cihazda kaydırır.", listOf(i("x1", "Başlangıç X"), i("y1", "Başlangıç Y"), i("x2", "Bitiş X"), i("y2", "Bitiş Y"), i("ms", "Süre ms", false))) { a, _ ->
                      Adb.swipe(a.optInt("x1"), a.optInt("y1"), a.optInt("x2"), a.optInt("y2"), a.optInt("ms", 250))
                  }
                  reg("adb_text", "Uzak cihazda odaktaki alana yazar (yalnızca ASCII).", listOf(s("text", "Metin"))) { a, _ -> Adb.text(a.optString("text")) }
                  reg("adb_key", "Uzak cihazda tuş: back, home, recents, enter, power, wake, volup, voldown, delete, tab.", listOf(s("key", "Tuş"))) { a, _ -> Adb.key(a.str("key")) }
                  reg("adb_open_app", "Uzak cihazda uygulama açar (ad ya da paket adı).", listOf(s("app", "Ad veya paket"))) { a, _ -> Adb.open(a.str("app")) }
                  reg("adb_shell", "Uzak cihazda kabuk komutu çalıştırır (riskli komutlar için onay istenir).", listOf(s("command", "Komut"))) { a, _ -> Adb.shell(a.str("command")) }
              }
          }
