      - name: Yama v3 (mevcut dosyaları düzenle)
        run: |
          python3 - <<'NOVAX_EOF'
          B = 'app/src/main/java/com/novax/assistant/'

          def patch(f, old, new):
              p = f if f.startswith('app/') else B + f
              s = open(p, encoding='utf-8').read()
              if old not in s:
                  raise SystemExit('YAMA BULUNAMADI: ' + f + ' :: ' + old[:70])
              s = s.replace(old, new, 1)
              open(p, 'w', encoding='utf-8').write(s)

          # --- gradle: ADB kütüphanesi
          patch('app/build.gradle',
                '// Bilerek bağımlılık yok: tüm arayüz programatik, ağ HttpURLConnection ile.',
                "implementation 'dev.mobile:dadb:1.2.10'")

          # --- Prefs: yeni ayarlar
          patch('Prefs.kt',
                '// ------------------------------------------------------------------ canlı kamera',
                r"""// ---- v3
              var webSearchOn: Boolean
                  get() = gb("web_on", true)
                  set(v) { pb("web_on", v) }
              var unlimitedSteps: Boolean
                  get() = gb("unlimited_steps", false)
                  set(v) { pb("unlimited_steps", v) }
              var bgAllowScreen: Boolean
                  get() = gb("bg_screen", false)
                  set(v) { pb("bg_screen", v) }
              var igAuto: Boolean
                  get() = gb("ig_auto", false)
                  set(v) { pb("ig_auto", v) }
              var igAccount: String
                  get() = gs("ig_account", "")
                  set(v) { ps("ig_account", v.trim()) }
              var igRules: String
                  get() = gs("ig_rules", "")
