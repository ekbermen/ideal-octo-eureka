                  col.addView(Ui.section(this, "TELEFON DEVRİ"))
                  col.addView(Ui.hint(this, "Novax senin yerine telefonu açabilir ve çağrılara bakabilir. PIN cihazda şifreli saklanır; modele ya da konuşmaya asla gönderilmez."))
                  unlockCb = Ui.check(this, "Novax telefonun kilidini PIN ile açabilsin", Prefs.unlockEnabled)
                  col.addView(unlockCb)
                  pinEt = Ui.edit(this, "Telefon PIN'i (rakamlar)", "", true)
                  pinEt.inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
