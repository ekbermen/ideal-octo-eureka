          cat > app/src/main/java/com/novax/assistant/PhoneStateReceiver.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.telephony.TelephonyManager

          /** Gelen/giden arama durumunu CallAgent'a iletir. */
          class PhoneStateReceiver : BroadcastReceiver() {
              @Suppress("DEPRECATION")
              override fun onReceive(ctx: Context, intent: Intent) {
                  if (intent.action != TelephonyManager.ACTION_PHONE_STATE_CHANGED) return
                  val state = intent.getStringExtra(TelephonyManager.EXTRA_STATE) ?: return
                  val number = intent.getStringExtra(TelephonyManager.EXTRA_INCOMING_NUMBER) ?: ""
                  CallAgent.onPhoneState(state, number)
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/PhoneUnlock.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/PhoneUnlock.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.KeyguardManager
          import android.content.Context
          import android.os.PowerManager

          /** Kullanıcının izniyle (Ayarlar > Telefon devri) ekranı PIN ile açar. PIN şifreli saklanır ve asla konuşulmaz/loglanmaz. */
          object PhoneUnlock {
              const val PIN_KEY = "phone_pin"

              fun isLocked(): Boolean {
                  val km = NovaxApp.instance.getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                  return km.isKeyguardLocked
              }

              fun screenOn(): Boolean {
                  val pm = NovaxApp.instance.getSystemService(Context.POWER_SERVICE) as PowerManager
                  return pm.isInteractive
              }

              fun hasPin(): Boolean = SecureStore.get(PIN_KEY).isNotEmpty()

              fun setPin(pin: String) {
                  val clean = pin.filter { it.isDigit() }
                  if (clean.isEmpty()) {
                      SecureStore.remove(PIN_KEY)
                  } else {
                      SecureStore.put(PIN_KEY, clean)
                  }
              }

              fun unlock(): String {
                  if (!Prefs.unlockEnabled) return "HATA: Telefon açma izni kapalı. Ayarlar > Telefon devri bölümünden aç."
                  val pin = SecureStore.get(PIN_KEY)
                  if (pin.isEmpty()) return "HATA: PIN kayıtlı değil. Ayarlar > Telefon devri."
                  val s = NovaxAccessibilityService.instance ?: return ScreenOps.NEED
                  if (!screenOn()) {
                      Act.wakeScreen()
                      ScreenOps.nap(900L)
                  }
                  if (!isLocked()) return "Telefon zaten açık."
                  // kilit ekranını yukarı kaydır
                  s.swipe(s.screenW() / 2, s.screenH() * 0.88f, s.screenW() / 2, s.screenH() * 0.2f, 260L)
                  ScreenOps.idle(1500L, 250L)
                  var typed = 0
                  for (ch in pin) {
                      val d = ch.toString()
                      var node = s.findAll(d, true).firstOrNull()
                      if (node == null) {
                          val byId = s.findByViewId("com.android.systemui:id/key" + d)
                          if (byId.isNotEmpty()) node = byId[0]
                      }
                      if (node == null) {
                          // klavye bir kez daha ortaya çıksın diye kısa kaydırma ve yeniden dene
                          s.swipe(s.screenW() / 2, s.screenH() * 0.8f, s.screenW() / 2, s.screenH() * 0.3f, 220L)
                          ScreenOps.idle(900L, 200L)
                          node = s.findAll(d, true).firstOrNull()
                      }
                      if (node == null) return "HATA: PIN tuş takımı bulunamadı (" + typed + " hane girildi). Desen/parmak izi kilidi olabilir."
                      s.clickNode(node)
                      typed++
                      ScreenOps.nap(110L)
                  }
                  for (l in listOf("enter", "gir", "ok", "tamam")) {
                      if (s.clickText(l, true)) break
                  }
                  ScreenOps.nap(1200L)
                  return if (!isLocked()) "Telefonun kilidi açıldı." else "PIN girildi ama kilit hâlâ açık görünüyor (PIN yanlış olabilir)."
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/PlayStoreOps.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/PlayStoreOps.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Intent
          import android.net.Uri

          /** Play Store'dan uygulama/oyun indirme ve kaldırma (erişilebilirlik ile). Ücretli içeriği asla satın almaz. */
          object PlayStoreOps {
              private const val VENDING = "com.android.vending"
              private val INSTALL = listOf("yükle", "install", "indir", "get", "kur")
              private val OPEN = listOf("aç", "open", "oyna", "play")
              private val BENIGN = listOf("kabul et", "accept", "devam", "continue", "tamam", "ok", "atla", "skip", "şimdi değil", "not now", "hayır teşekkürler", "no thanks", "anladım", "got it")

              private fun svc(): NovaxAccessibilityService? = NovaxAccessibilityService.instance

              private fun openDetails(pkg: String): Boolean {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + pkg)).setPackage(VENDING)
                  return Act.start(i)
              }

              private fun openSearch(q: String): Boolean {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("market://search?q=" + Uri.encode(q) + "&c=apps")).setPackage(VENDING)
                  return Act.start(i)
              }

              private fun tapResult(name: String): Boolean {
                  val s = svc() ?: return false
                  for (n in s.findAll(name, false)) {
                      if (n.isEditable) continue
                      val cls = n.className?.toString() ?: ""
                      if (cls.contains("EditText")) continue
                      if (s.clickNode(n)) return true
                  }
                  return false
              }

              private fun anyExact(s: NovaxAccessibilityService, labels: List<String>): String? {
                  for (l in labels) {
                      if (s.findAll(l, true).isNotEmpty()) return l
                  }
                  return null
              }

              fun install(name: String, pkgIn: String, cancel: CancelToken?): String {
                  val s = svc() ?: return ScreenOps.NEED
                  var pkg = pkgIn.trim()
                  if (pkg.isEmpty()) pkg = Apps.pkgOf(name) ?: ""
                  if (pkg.isNotEmpty() && Apps.isInstalled(pkg)) return name + " zaten yüklü."
                  val before = Apps.installedPackages()

                  val opened = if (pkg.isNotEmpty()) openDetails(pkg) else openSearch(name)
                  if (!opened) return "HATA: Play Store açılamadı."
                  s.waitForPackage(VENDING, 7000L)
                  ScreenOps.idle(3500L, 350L)

                  if (pkg.isEmpty()) {
                      if (!tapResult(name)) return "HATA: Play Store aramasında '" + name + "' bulunamadı."
                      ScreenOps.idle(3500L, 350L)
                  }

                  // Yükle düğmesini bul
                  var clicked = false
                  val findEnd = System.currentTimeMillis() + 28000L
                  while (System.currentTimeMillis() < findEnd) {
                      if (cancel != null && cancel.cancelled) return "İptal edildi."
                      if (anyExact(s, OPEN) != null && anyExact(s, INSTALL) == null) return name + " zaten yüklü görünüyor (Aç düğmesi var)."
                      val l = anyExact(s, INSTALL)
                      if (l != null) {
                          clicked = s.clickText(l, true)
                          if (clicked) break
                      }
                      ScreenOps.nap(900L)
                  }
                  if (!clicked) {
                      if (ScreenOps.exists("satın al", false) || ScreenOps.exists("₺", false)) {
                          return "HATA: Bu uygulama ücretli görünüyor; satın alma yapmam. Kullanıcı onayı gerekir."
                      }
                      return "HATA: 'Yükle' düğmesi bulunamadı (ön kayıt, bölge kısıtı ya da farklı sayfa olabilir)."
                  }
                  Bus.log("Yükleme başladı: " + name)

                  // İndirme/yükleme takibi
                  val end = System.currentTimeMillis() + 25L * 60L * 1000L
                  var lastLog = 0L
                  while (System.currentTimeMillis() < end) {
                      if (cancel != null && cancel.cancelled) return "İptal edildi (indirme Play Store'da sürebilir)."
                      if (pkg.isNotEmpty() && Apps.isInstalled(pkg)) return name + " yüklendi (" + pkg + ")."
                      if (pkg.isEmpty()) {
                          val diff = Apps.installedPackages() - before
                          if (diff.isNotEmpty()) return name + " yüklendi (" + diff.first() + ")."
                      }
                      val ap = s.activePackage()
                      if (ap == VENDING || ap.contains("packageinstaller")) {
                          if (ScreenOps.exists("şifre", false) || ScreenOps.exists("password", false) || ScreenOps.exists("kimlik doğrulama", false)) {
                              return "HATA: Play Store kimlik doğrulaması istiyor; kullanıcı onaylamalı."
                          }
                          val b = anyExact(s, BENIGN)
                          if (b != null) s.clickText(b, true)
                          if (anyExact(s, OPEN) != null && anyExact(s, INSTALL) == null && pkg.isEmpty()) {
                              return name + " yüklendi (Aç düğmesi göründü)."
                          }
                      }
                      val now = System.currentTimeMillis()
                      if (now - lastLog > 30000L) {
                          lastLog = now
                          Bus.log("İndiriliyor: " + name)
                      }
                      ScreenOps.nap(3000L)
                      Apps.refresh()
                  }
                  return "Zaman aşımı: " + name + " 25 dakikada yüklenmedi (Play Store'da sürüyor olabilir)."
              }

              fun uninstall(name: String): String {
                  val app = Apps.find(name) ?: return "HATA: '" + name + "' yüklü değil."
                  val i = Intent(Intent.ACTION_DELETE, Uri.parse("package:" + app.pkg))
                  if (!Act.start(i)) return "HATA: kaldırma ekranı açılamadı."
                  val s = svc() ?: return "Kaldırma onay ekranını açtım; erişilebilirlik kapalı, elle onayla."
                  ScreenOps.idle(2500L, 300L)
                  for (l in listOf("tamam", "ok", "kaldır", "uninstall", "sil")) {
                      if (s.clickText(l, true)) break
                  }
                  ScreenOps.nap(1500L)
                  Apps.refresh()
                  return if (!Apps.isInstalled(app.pkg)) app.label + " kaldırıldı." else app.label + " için kaldırma onayı verildi; tamamlanmadıysa ekranı kontrol et."
              }

              fun installedText(name: String): String {
                  val pkg = Apps.pkgOf(name)
                  if (pkg != null && Apps.isInstalled(pkg)) return name + " yüklü (" + pkg + ")."
                  val app = Apps.find(name)
                  return if (app != null) app.label + " yüklü (" + app.pkg + ")." else name + " yüklü değil."
              }
          }
          NOVAX_EOF

