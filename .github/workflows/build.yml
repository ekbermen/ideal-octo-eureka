name: Build Novax APK

# Novax v2 - tek dosya: bütün proje (Kotlin, manifest, kaynaklar, Gradle) bu workflow içinde gömülü.
# Kullanım: bunu repoda .github/workflows/build.yml olarak kaydet, Actions > Run workflow.
# Opsiyonel secret: GEMINI_API_KEY (boşsa API anahtarını uygulama içinden girersin; şirketi otomatik algılar).
#
# v2 özellikleri:
#  - Canlı kamera (görüntülü sohbet), '@Arkaplan' ile arka plan görevleri, telefon PIN + çağrı devri
#  - Her API anahtarı için önce şirket testi/algılama, sonra model seçimi (Gemini, OpenAI, Claude, Groq, OpenRouter, xAI, DeepSeek, Mistral ...)
#  - WhatsApp sesli mesaj, sesli mesaj/foto/video analizi, Play Store'dan oyun indirme, klavye ile yazma
#  - Hızlı ekran kontrolü (toplu eylem), düzeltilmiş ekran görüntüsü, bildirim okuma/yanıtlama, zamanlanmış görevler

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: SDK paketleri (runner'daki hazır SDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "$ANDROID_HOME/platforms" || true


      - name: Yaz app/build.gradle
        run: |
          mkdir -p app
          cat > app/build.gradle <<'NOVAX_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          def localProps = new Properties()
          def lp = rootProject.file("local.properties")
          if (lp.exists()) { lp.withInputStream { localProps.load(it) } }
          def geminiKey = (localProps.getProperty("GEMINI_API_KEY") ?: System.getenv("GEMINI_API_KEY") ?: "").trim()

          android {
              namespace 'com.novax.assistant'
              compileSdk 34

              defaultConfig {
                  applicationId "com.novax.assistant"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              buildFeatures { buildConfig true }
              lint { abortOnError false }
          }

          dependencies {
              // Bilerek bağımlılık yok: tüm arayüz programatik, ağ HttpURLConnection ile.
          }
          NOVAX_EOF

      - name: Yaz app/src/main/AndroidManifest.xml
        run: |
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'NOVAX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" tools:ignore="ProtectedPermissions" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:name=".NovaxApp"
                  android:allowBackup="false"
                  android:icon="@drawable/ic_novax"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Novax"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SetupActivity"
                      android:exported="false"
                      android:windowSoftInputMode="adjustResize" />

                  <activity
                      android:name=".LiveActivity"
                      android:exported="false"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden" />

                  <activity
                      android:name=".TasksActivity"
                      android:exported="false" />

                  <activity
                      android:name=".LogActivity"
                      android:exported="false" />

                  <activity
                      android:name=".ShareReceiverActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NovaxService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".NovaxAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <service
                      android:name=".NovaxNotifListener"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".NovaxReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.novax.assistant.FIRE" />
                          <action android:name="com.novax.assistant.CANCEL_TASK" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".PhoneStateReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.PHONE_STATE" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          NOVAX_EOF

      - name: Yaz app/src/main/res/drawable/ic_notif.xml
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_notif.xml <<'NOVAX_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:strokeColor="#FFFFFF" android:strokeWidth="3" android:fillColor="#00000000"
                  android:pathData="M24,5 L40.5,14.5 L40.5,33.5 L24,43 L7.5,33.5 L7.5,14.5 Z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="3.5" android:fillColor="#00000000"
                  android:pathData="M17,32 L17,16 L31,32 L31,16" />
          </vector>
          NOVAX_EOF

      - name: Yaz app/src/main/res/drawable/ic_novax.xml
        run: |
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_novax.xml <<'NOVAX_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#02070D" android:pathData="M0,0h48v48h-48z" />
              <path android:strokeColor="#00E5FF" android:strokeWidth="2.5" android:fillColor="#00000000"
                  android:pathData="M24,5 L40.5,14.5 L40.5,33.5 L24,43 L7.5,33.5 L7.5,14.5 Z" />
              <path android:strokeColor="#00E5FF" android:strokeWidth="3" android:fillColor="#00000000"
                  android:pathData="M17,32 L17,16 L31,32 L31,16" />
          </vector>
          NOVAX_EOF

      - name: Yaz app/src/main/res/values/colors.xml
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'NOVAX_EOF'
          <resources>
              <color name="bg">#02070D</color>
              <color name="cyan">#00E5FF</color>
              <color name="cyan_dim">#0097A7</color>
              <color name="amber">#FFB300</color>
              <color name="red">#FF3D3D</color>
          </resources>
          NOVAX_EOF

      - name: Yaz app/src/main/res/values/strings.xml
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'NOVAX_EOF'
          <resources>
              <string name="app_name">Novax</string>
              <string name="accessibility_desc">Novax, ekranı okumak, dokunmak, yazmak ve uygulamalar arası komutları çalıştırmak için erişilebilirlik hizmetini kullanır.</string>
          </resources>
          NOVAX_EOF

      - name: Yaz app/src/main/res/values/styles.xml
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'NOVAX_EOF'
          <resources>
              <style name="Theme.Novax" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:colorAccent">@color/cyan</item>
                  <item name="android:textColor">@color/cyan</item>
                  <item name="android:textColorHint">#5500E5FF</item>
              </style>
          </resources>
          NOVAX_EOF

      - name: Yaz app/src/main/res/xml/accessibility_config.xml
        run: |
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_config.xml <<'NOVAX_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeWindowsChanged|typeViewScrolled|typeViewClicked"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="50" />
          NOVAX_EOF

      - name: Yaz build.gradle
        run: |
          cat > build.gradle <<'NOVAX_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          NOVAX_EOF

      - name: Yaz gradle.properties
        run: |
          cat > gradle.properties <<'NOVAX_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          NOVAX_EOF

      - name: Yaz settings.gradle
        run: |
          cat > settings.gradle <<'NOVAX_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Novax"
          include(":app")
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Act.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Act.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.app.ActivityManager
          import android.app.Notification
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.location.Geocoder
          import android.location.LocationManager
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Environment
          import android.os.PowerManager
          import android.os.StatFs
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.AlarmClock
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.KeyEvent
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** Telefon seviyesindeki tüm hazır eylemler. Her fonksiyon kullanıcıya/modele okunabilir bir sonuç metni döndürür. */
          object Act {
              private val ctx: Context get() = NovaxApp.instance
              private var ringtone: Ringtone? = null

              // ------------------------------------------------------------------ başlatıcı
              fun start(i: Intent): Boolean {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val direct = NovaxApp.visible > 0 || Settings.canDrawOverlays(ctx)
                  return try {
                      ctx.startActivity(i)
                      if (!direct) fullScreenFallback(i)
                      true
                  } catch (e: Exception) {
                      Bus.log("Başlatılamadı: " + e.message)
                      false
                  }
              }

              private fun fullScreenFallback(i: Intent) {
                  val pi = PendingIntent.getActivity(ctx, (System.nanoTime() % 100000).toInt(), i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(ctx, NovaxApp.CH_ALERT)
                      .setSmallIcon(R.drawable.ic_notif).setContentTitle("Novax").setContentText("Açmak için dokun")
                      .setContentIntent(pi).setFullScreenIntent(pi, true).setAutoCancel(true).build()
                  (ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).notify((System.nanoTime() % 100000).toInt(), n)
              }

              // ------------------------------------------------------------------ uygulama / web
              fun openApp(name: String): String {
                  if (name.isBlank()) return "HATA: uygulama adı boş"
                  val app = Apps.find(name) ?: return "HATA: '" + name + "' adında uygulama bulunamadı."
                  val i = ctx.packageManager.getLaunchIntentForPackage(app.pkg) ?: return "HATA: " + app.label + " açılamıyor."
                  if (!start(i)) return "HATA: " + app.label + " başlatılamadı."
                  val acc = NovaxAccessibilityService.instance
                  if (acc != null) {
                      acc.waitForPackage(app.pkg, 4000L)
                      ScreenOps.idle(1200L, 200L)
                  }
                  return app.label + " açıldı."
              }

              fun openUrl(url: String): String {
                  val u = if (url.startsWith("http")) url else "https://" + url
                  return if (start(Intent(Intent.ACTION_VIEW, Uri.parse(u)))) "Açıldı: " + u else "HATA: açılamadı"
              }

              fun playYoutube(q: String): String {
                  val yt = "com.google.android.youtube"
                  val i = Intent(Intent.ACTION_SEARCH).setPackage(yt).putExtra("query", q)
                  val ok = try { start(i) } catch (_: Exception) { false }
                  val acc = NovaxAccessibilityService.instance
                  if (ok && acc != null) {
                      acc.waitForPackage(yt, 4000L)
                      ScreenOps.idle(2500L, 300L)
                      val dm = ctx.resources.displayMetrics
                      acc.tap(dm.widthPixels / 2f, dm.heightPixels * 0.34f)
                      return "YouTube'da '" + q + "' açıldı."
                  }
                  return openUrl("https://www.youtube.com/results?search_query=" + Uri.encode(q))
              }

              fun navigate(dest: String): String {
                  val i = Intent(Intent.ACTION_VIEW, Uri.parse("google.navigation:q=" + Uri.encode(dest)))
                  return if (start(i)) dest + " için yol tarifi başladı." else openUrl("https://maps.google.com/?q=" + Uri.encode(dest))
              }

              fun openLive(front: Boolean): String {
                  val i = Intent(ctx, LiveActivity::class.java).putExtra("front", front)
                  return if (start(i)) "Canlı kamera açıldı." else "HATA: canlı kamera açılamadı"
              }

              // ------------------------------------------------------------------ alarm & zamanlayıcı
              fun setAlarm(h: Int, m: Int, label: String): String {
                  val i = Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, h.coerceIn(0, 23)).putExtra(AlarmClock.EXTRA_MINUTES, m.coerceIn(0, 59))
                      .putExtra(AlarmClock.EXTRA_MESSAGE, label.ifBlank { "Novax" }).putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  return if (start(i)) "Alarm kuruldu: %02d:%02d".format(h, m) else "HATA: alarm kurulamadı"
              }

              fun setTimer(sec: Int, label: String): String {
                  if (sec <= 0) return "HATA: süre geçersiz"
                  val i = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, sec).putExtra(AlarmClock.EXTRA_MESSAGE, label.ifBlank { "Novax" })
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  val mm = sec / 60
                  val ss = sec % 60
                  val txt = (if (mm > 0) "$mm dakika " else "") + (if (ss > 0) "$ss saniye" else "")
                  return if (start(i)) "Zamanlayıcı başladı: " + txt.trim() else "HATA: zamanlayıcı kurulamadı"
              }

              // ------------------------------------------------------------------ donanım
              fun flashlight(on: Boolean): String {
                  return try {
                      val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      var id: String? = null
                      for (cid in cm.cameraIdList) {
                          if (cm.getCameraCharacteristics(cid).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true) {
                              id = cid
                              break
                          }
                      }
                      if (id == null) {
                          "HATA: cihazda flaş yok"
                      } else {
                          cm.setTorchMode(id, on)
                          if (on) "Fener açıldı." else "Fener kapandı."
                      }
                  } catch (e: Exception) {
                      "HATA: fener: " + e.message
                  }
              }

              fun setVolume(level: Int, stream: String): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val st = when (stream.lowercase()) {
                      "ring" -> AudioManager.STREAM_RING
                      "alarm" -> AudioManager.STREAM_ALARM
                      "notification" -> AudioManager.STREAM_NOTIFICATION
                      "call" -> AudioManager.STREAM_VOICE_CALL
                      else -> AudioManager.STREAM_MUSIC
                  }
                  val mx = am.getStreamMaxVolume(st)
                  val pct = level.coerceIn(0, 100)
                  val v = (mx * pct / 100f).toInt()
                  return try {
                      am.setStreamVolume(st, v, AudioManager.FLAG_SHOW_UI)
                      "Ses yüzde " + pct + " yapıldı."
                  } catch (e: Exception) {
                      "HATA: ses ayarlanamadı: " + e.message
                  }
              }

              fun adjustVolume(up: Boolean): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, if (up) AudioManager.ADJUST_RAISE else AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                  return if (up) "Sesi artırdım." else "Sesi kıstım."
              }

              fun mute(): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.setStreamVolume(AudioManager.STREAM_MUSIC, 0, AudioManager.FLAG_SHOW_UI)
                  return "Ses kapatıldı."
              }

              fun setBrightness(level: Int): String {
                  if (!Settings.System.canWrite(ctx)) {
                      start(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + ctx.packageName)))
                      return "HATA: 'Sistem ayarlarını değiştir' izni gerekli; ayar sayfasını açtım."
                  }
                  val pct = level.coerceIn(1, 100)
                  val v = (255 * pct / 100f).toInt()
                  Settings.System.putInt(ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL)
                  Settings.System.putInt(ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS, v)
                  return "Parlaklık yüzde " + pct + " yapıldı."
              }

              fun adjustBrightness(up: Boolean): String {
                  val cur = try { Settings.System.getInt(ctx.contentResolver, Settings.System.SCREEN_BRIGHTNESS) } catch (_: Exception) { 128 }
                  val pct = (cur * 100 / 255 + (if (up) 20 else -20)).coerceIn(1, 100)
                  return setBrightness(pct)
              }

              fun media(action: String): String {
                  val code: Int = when (action.lowercase()) {
                      "play", "resume" -> KeyEvent.KEYCODE_MEDIA_PLAY
                      "pause" -> KeyEvent.KEYCODE_MEDIA_PAUSE
                      "next" -> KeyEvent.KEYCODE_MEDIA_NEXT
                      "previous", "prev" -> KeyEvent.KEYCODE_MEDIA_PREVIOUS
                      "stop" -> KeyEvent.KEYCODE_MEDIA_STOP
                      "toggle" -> KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE
                      else -> -1
                  }
                  if (code == -1) return "HATA: bilinmeyen medya komutu " + action
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                  return "Medya: " + action
              }

              fun vibrate(ms: Long = 400L): String {
                  val v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                  return "Titreştim."
              }

              @Suppress("DEPRECATION")
              fun speaker(on: Boolean): String {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.isSpeakerphoneOn = on
                  return if (on) "Hoparlör açıldı." else "Hoparlör kapandı."
              }

              fun findPhone(on: Boolean): String {
                  if (!on) {
                      try {
                          ringtone?.stop()
                      } catch (_: Exception) {
                      }
                      ringtone = null
                      return "Telefon bulma alarmı durduruldu."
                  }
                  return try {
                      val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.setStreamVolume(AudioManager.STREAM_ALARM, am.getStreamMaxVolume(AudioManager.STREAM_ALARM), 0)
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      val r = RingtoneManager.getRingtone(ctx, uri)
                      r.audioAttributes = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build()
                      if (Build.VERSION.SDK_INT >= 28) r.isLooping = true
                      r.play()
                      ringtone = r
                      vibrate(1500L)
                      "Telefon en yüksek sesle çalıyor. Durdurmak için 'telefon bulmayı durdur' de."
                  } catch (e: Exception) {
                      "HATA: alarm çalınamadı: " + e.message
                  }
              }

              @Suppress("DEPRECATION")
              fun wakeScreen(): String {
                  val pm = ctx.getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (pm.isInteractive) return "Ekran zaten açık."
                  val wl = pm.newWakeLock(PowerManager.FULL_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP or PowerManager.ON_AFTER_RELEASE, "novax:wake")
                  wl.acquire(4000L)
                  return "Ekran uyandırıldı."
              }

              fun lockScreen(): String {
                  val s = NovaxAccessibilityService.instance ?: return ScreenOps.NEED
                  return if (s.global("lock")) "Ekran kilitlendi." else "HATA: ekran kilitlenemedi (Android 9+ gerekir)"
              }

              // ------------------------------------------------------------------ hızlı ayarlar & ayar sayfaları
              private val tileNames: Map<String, List<String>> = mapOf(
                  "wifi" to listOf("wi-fi", "wifi", "internet"), "wi-fi" to listOf("wi-fi", "wifi", "internet"),
                  "bluetooth" to listOf("bluetooth"), "ucak modu" to listOf("uçak modu", "ucak modu", "airplane", "flight mode"),
                  "uçak modu" to listOf("uçak modu", "ucak modu", "airplane", "flight mode"),
                  "fener" to listOf("fener", "flashlight", "torch"), "mobil veri" to listOf("mobil veri", "mobile data"),
                  "konum" to listOf("konum", "location"), "otomatik dondurme" to listOf("otomatik döndür", "auto-rotate", "auto rotate"),
                  "rahatsiz etme" to listOf("rahatsız etme", "do not disturb", "dnd"), "hotspot" to listOf("hotspot", "mobil hotspot", "internet paylaşımı"),
                  "pil tasarrufu" to listOf("pil tasarrufu", "battery saver"), "nfc" to listOf("nfc")
              )

              private fun findTile(acc: NovaxAccessibilityService, labels: List<String>): android.view.accessibility.AccessibilityNodeInfo? {
                  for (l in labels) {
                      val f = acc.findAll(l).firstOrNull()
                      if (f != null) return f
                  }
                  return null
              }

              fun quickToggle(name: String, want: Boolean?): String {
                  val acc = NovaxAccessibilityService.instance ?: return "HATA: Erişilebilirlik kapalı; kutucuğa dokunamam."
                  val key = Text.norm(name)
                  var labels: List<String>? = tileNames[key]
                  if (labels == null) {
                      for (e in tileNames.entries) {
                          if (key.contains(Text.norm(e.key))) {
                              labels = e.value
                              break
                          }
                      }
                  }
                  val useLabels: List<String> = labels ?: listOf(name)
                  acc.global("quick_settings")
                  ScreenOps.idle(1500L, 250L)
                  var node = findTile(acc, useLabels)
                  if (node == null) {
                      acc.scroll("left")
                      ScreenOps.idle(800L, 150L)
                      node = findTile(acc, useLabels)
                  }
                  if (node == null) {
                      acc.global("back")
                      return "HATA: '" + name + "' kutucuğu hızlı ayarlarda yok."
                  }
                  val target: android.view.accessibility.AccessibilityNodeInfo = node
                  if (want != null && Build.VERSION.SDK_INT >= 30) {
                      var cur: android.view.accessibility.AccessibilityNodeInfo? = target
                      var state = ""
                      var hops = 0
                      while (cur != null && hops < 4 && state.isEmpty()) {
                          state = Text.norm(cur.stateDescription?.toString() ?: "")
                          cur = cur.parent
                          hops++
                      }
                      val isOn = state.contains("acik") || state == "on"
                      val isOff = state.contains("kapali") || state.contains("off")
                      if ((want && isOn && !isOff) || (!want && isOff)) {
                          acc.global("back")
                          return name + " zaten " + (if (want) "açık" else "kapalı") + "."
                      }
                  }
                  val ok = acc.clickNode(target)
                  ScreenOps.nap(400L)
                  acc.global("back")
                  return if (ok) name + " kutucuğuna dokundum." else "HATA: '" + name + "' kutucuğuna dokunulamadı."
              }

              fun openSettings(page: String): String {
                  val a: String = when (Text.norm(page)) {
                      "wifi", "wi fi", "internet" -> if (Build.VERSION.SDK_INT >= 29) Settings.Panel.ACTION_INTERNET_CONNECTIVITY else Settings.ACTION_WIFI_SETTINGS
                      "bluetooth" -> Settings.ACTION_BLUETOOTH_SETTINGS
                      "display", "ekran", "parlaklik" -> Settings.ACTION_DISPLAY_SETTINGS
                      "sound", "ses" -> Settings.ACTION_SOUND_SETTINGS
                      "battery", "pil" -> Intent.ACTION_POWER_USAGE_SUMMARY
                      "apps", "uygulamalar" -> Settings.ACTION_APPLICATION_SETTINGS
                      "location", "konum" -> Settings.ACTION_LOCATION_SOURCE_SETTINGS
                      "accessibility", "erisilebilirlik" -> Settings.ACTION_ACCESSIBILITY_SETTINGS
                      "notifications", "bildirimler" -> Settings.ACTION_APP_NOTIFICATION_SETTINGS
                      "storage", "depolama" -> Settings.ACTION_INTERNAL_STORAGE_SETTINGS
                      "date", "tarih", "saat" -> Settings.ACTION_DATE_SETTINGS
                      "language", "dil" -> Settings.ACTION_LOCALE_SETTINGS
                      "airplane", "ucak modu" -> Settings.ACTION_AIRPLANE_MODE_SETTINGS
                      "nfc" -> Settings.ACTION_NFC_SETTINGS
                      "vpn" -> Settings.ACTION_VPN_SETTINGS
                      else -> Settings.ACTION_SETTINGS
                  }
                  val i = Intent(a)
                  if (a == Settings.ACTION_APP_NOTIFICATION_SETTINGS) i.putExtra(Settings.EXTRA_APP_PACKAGE, ctx.packageName)
                  return if (start(i)) "Ayar sayfası açıldı: " + page else "HATA: ayar sayfası açılamadı"
              }

              // ------------------------------------------------------------------ bilgi
              fun battery(): String {
                  val i = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val lvl = i?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
                  val scale = i?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
                  val st = i?.getIntExtra(BatteryManager.EXTRA_STATUS, -1) ?: -1
                  val charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
                  val temp = (i?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  val pct = if (scale > 0) lvl * 100 / scale else lvl
                  val chargeTxt = if (charging) "şarj oluyor" else "şarjda değil"
                  val tempTxt = String.format(Locale.US, "%.1f", temp)
                  return "Pil yüzde $pct, $chargeTxt, sıcaklık $tempTxt derece."
              }

              fun timeNow(): String = SimpleDateFormat("d MMMM yyyy EEEE, HH:mm", Locale("tr")).format(Date())
              fun clock(): String = "Saat " + SimpleDateFormat("HH:mm", Locale("tr")).format(Date())
              fun dateToday(): String = "Bugün " + SimpleDateFormat("d MMMM yyyy EEEE", Locale("tr")).format(Date())

              fun deviceInfo(): String {
                  val sb = StringBuilder()
                  sb.append(Build.MANUFACTURER).append(' ').append(Build.MODEL).append(", Android ").append(Build.VERSION.RELEASE)
                  sb.append(" (SDK ").append(Build.VERSION.SDK_INT).append(")\n")
                  try {
                      val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      val mi = ActivityManager.MemoryInfo()
                      am.getMemoryInfo(mi)
                      sb.append("RAM boş: ").append(mi.availMem / 1048576L).append(" MB / ").append(mi.totalMem / 1048576L).append(" MB\n")
                      val st = StatFs(Environment.getDataDirectory().path)
                      sb.append("Depolama boş: ").append(st.availableBytes / 1048576L).append(" MB / ").append(st.totalBytes / 1048576L).append(" MB\n")
                      val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val n = cm.activeNetwork
                      val caps = if (n != null) cm.getNetworkCapabilities(n) else null
                      val net = if (caps == null) "bağlantı yok" else if (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) "Wi-Fi" else if (caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)) "mobil veri" else "diğer"
                      sb.append("Ağ: ").append(net).append('\n')
                      val dm = ctx.resources.displayMetrics
                      sb.append("Ekran: ").append(dm.widthPixels).append('x').append(dm.heightPixels).append(" @").append(dm.densityDpi).append("dpi\n")
                  } catch (e: Exception) {
                      sb.append("(bazı bilgiler okunamadı)\n")
                  }
                  sb.append(battery())
                  return sb.toString()
              }

              fun location(): String {
                  val fine = ctx.checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  val coarse = ctx.checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
                  if (!fine && !coarse) return "HATA: Konum izni yok. Ayarlar > İzinler'den ver."
                  return try {
                      val lm = ctx.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                      var best: android.location.Location? = null
                      for (p in listOf(LocationManager.GPS_PROVIDER, LocationManager.NETWORK_PROVIDER, LocationManager.PASSIVE_PROVIDER)) {
                          val l = try { lm.getLastKnownLocation(p) } catch (_: SecurityException) { null }
                          if (l != null) {
                              val b = best
                              if (b == null || l.time > b.time) best = l
                          }
                      }
                      val loc = best ?: return "Konum bilinmiyor (konum servisini aç)."
                      var addr = ""
                      try {
                          @Suppress("DEPRECATION")
                          val list = Geocoder(ctx, Locale("tr")).getFromLocation(loc.latitude, loc.longitude, 1)
                          if (list != null && list.isNotEmpty()) addr = list[0].getAddressLine(0) ?: ""
                      } catch (_: Exception) {
                      }
                      "Konum: " + loc.latitude + ", " + loc.longitude + (if (addr.isNotEmpty()) " (" + addr + ")" else "") +
                          " https://maps.google.com/?q=" + loc.latitude + "," + loc.longitude
                  } catch (e: Exception) {
                      "HATA: konum alınamadı: " + e.message
                  }
              }

              // ------------------------------------------------------------------ pano, paylaşım, kamera, not
              fun copy(text: String): String {
                  val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("novax", text))
                  return "Panoya kopyalandı."
              }

              fun readClipboard(): String {
                  val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val clip = cm.primaryClip
                  if (clip == null || clip.itemCount == 0) return "Pano boş ya da arka planda okunamıyor (Android kısıtı)."
                  val t = clip.getItemAt(0).coerceToText(ctx)?.toString() ?: ""
                  return if (t.isBlank()) "Pano boş." else Text.clip(t, 2000)
              }

              fun share(text: String): String {
                  val i = Intent.createChooser(Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, text), "Paylaş")
                  return if (start(i)) "Paylaşım menüsü açıldı." else "HATA: paylaşılamadı"
              }

              fun takePhoto(front: Boolean): String {
                  val i = Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA)
                  if (front) {
                      i.putExtra("android.intent.extras.CAMERA_FACING", 1)
                      i.putExtra("android.intent.extra.USE_FRONT_CAMERA", true)
                  }
                  if (!start(i)) return "HATA: kamera açılamadı"
                  val acc = NovaxAccessibilityService.instance ?: return "Kamerayı açtım; erişilebilirlik kapalı, deklanşöre elle bas."
                  ScreenOps.idle(2500L, 300L)
                  if (front) {
                      val sw = acc.clickText("ön kamera") || acc.clickText("selfie") || acc.clickText("switch camera")
                      if (!sw) Bus.log("Ön kamera düğmesi bulunamadı")
                  }
                  val shutter = listOf("deklanşör", "shutter", "fotoğraf çek", "take photo", "capture")
                  for (s in shutter) {
                      if (acc.clickText(s)) return "Fotoğraf çekildi."
                  }
                  val dm = ctx.resources.displayMetrics
                  return if (acc.tap(dm.widthPixels / 2f, dm.heightPixels * 0.9f)) "Deklanşöre dokundum." else "HATA: deklanşör bulunamadı"
              }

              fun createNote(title: String, content: String): String {
                  val id = MemoryStore.addNote(title, content)
                  val dir = ctx.getExternalFilesDir("notes") ?: ctx.filesDir
                  dir.mkdirs()
                  val safe = title.ifBlank { "not" }.replace(Regex("[^A-Za-z0-9ğüşöçıİĞÜŞÖÇ _-]"), "").trim().replace(' ', '_').take(40)
                  val f = File(dir, safe + "_" + id + ".txt")
                  f.writeText(title + "\n\n" + content)
                  return "Not kaydedildi: " + f.name
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Agent.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Agent.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /** Araç döngüsü: modele sor, araçları çalıştır, sonucu geri ver; bitene kadar tekrarla. */
          object Agent {
              fun run(userParts: List<LlmPart>, history: List<LlmMsg>, ctx: ToolCtx, maxSteps: Int, onStep: (String) -> Unit): String {
                  val client = Llm.client()
                  val msgs = ArrayList<LlmMsg>(history)
                  msgs.add(LlmMsg.userParts(userParts))
                  val tools = Tools.declarations()
                  var last = ""
                  var lastSig = ""
                  var sameCount = 0
                  for (step in 0 until maxSteps) {
                      if (ctx.cancel.cancelled) return "İptal edildi."
                      val system = Persona.system(ctx.bg)
                      val reply = client.chat(system, msgs, tools)
                      if (ctx.cancel.cancelled) return "İptal edildi."
                      if (reply.text.isNotBlank()) last = reply.text.trim()
                      if (reply.calls.isEmpty()) {
                          return if (last.isBlank()) "Tamam." else last
                      }
                      msgs.add(LlmMsg.assistant(reply.text, reply.calls, reply.raw))
                      val results = ArrayList<LlmToolResult>()
                      for (call in reply.calls) {
                          if (ctx.cancel.cancelled) return "İptal edildi."
                          val sig = call.name + call.args.toString()
                          if (sig == lastSig) sameCount++ else sameCount = 0
                          lastSig = sig
                          onStep(call.name + " " + Text.clip(call.args.toString(), 80))
                          val out: String
                          if (sameCount >= 3) {
                              out = "HATA: Aynı çağrıyı üst üste tekrarlıyorsun. Farklı bir yol dene ya da durumu kullanıcıya açıkla."
                          } else {
                              out = Tools.execute(call.name, call.args, ctx)
                          }
                          results.add(LlmToolResult(call.id, call.name, Text.clip(out, 6000)))
                      }
                      msgs.add(LlmMsg.tool(results))
                      compact(msgs)
                  }
                  return if (last.isBlank()) "Çok fazla adım gerekti, işi yarıda bıraktım." else last
              }

              private fun compact(msgs: MutableList<LlmMsg>) {
                  var total = 0
                  for (m in msgs) {
                      for (r in m.results) total += r.content.length
                      for (x in m.parts) total += x.text.length + x.b64.length / 8
                  }
                  if (total < 90000) return
                  val limit = msgs.size - 6
                  for (i in 0 until limit) {
                      val m = msgs[i]
                      if (m.role == LlmMsg.TOOL) {
                          val short = ArrayList<LlmToolResult>()
                          for (r in m.results) short.add(LlmToolResult(r.callId, r.name, Text.clip(r.content, 200)))
                          msgs[i] = LlmMsg.tool(short)
                      } else if (m.role == LlmMsg.USER) {
                          var hasMedia = false
                          for (x in m.parts) {
                              if (x.kind != LlmPart.TEXT) hasMedia = true
                          }
                          if (hasMedia) {
                              val keep = ArrayList<LlmPart>()
                              for (x in m.parts) {
                                  if (x.kind == LlmPart.TEXT) keep.add(x)
                              }
                              keep.add(LlmPart.ofText("[eski görüntü/ses kaldırıldı]"))
                              msgs[i] = LlmMsg.userParts(keep)
                          }
                      }
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/AnthropicClient.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/AnthropicClient.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import org.json.JSONArray
          import org.json.JSONObject

          /** Anthropic Claude (Messages API) istemcisi: araç çağırma ve görüntü desteği. */
          class AnthropicClient(private val p: Provider, private val key: String, val model: String) : LlmClient {
              override val label: String get() = p.company + " / " + model

              private fun userBlocks(m: LlmMsg): JSONArray {
                  val arr = JSONArray()
                  for (x in m.parts) {
                      if (x.kind == LlmPart.TEXT) {
                          if (x.text.isNotBlank()) arr.put(JSONObject().put("type", "text").put("text", x.text))
                      } else if (x.kind == LlmPart.IMAGE) {
                          val src = JSONObject().put("type", "base64").put("media_type", x.mime).put("data", x.b64)
                          arr.put(JSONObject().put("type", "image").put("source", src))
                      } else {
                          arr.put(JSONObject().put("type", "text").put("text", "[Bu sağlayıcı ses/video dosyalarını doğrudan alamıyor]"))
                      }
                  }
                  return arr
              }

              private fun assistantBlocks(m: LlmMsg): JSONArray {
                  val arr = JSONArray()
                  for (x in m.parts) {
                      if (x.kind == LlmPart.TEXT && x.text.isNotBlank()) arr.put(JSONObject().put("type", "text").put("text", x.text))
                  }
                  for (c in m.calls) {
                      arr.put(JSONObject().put("type", "tool_use").put("id", c.id).put("name", c.name).put("input", c.args))
                  }
                  if (arr.length() == 0) arr.put(JSONObject().put("type", "text").put("text", "..."))
                  return arr
              }

              private fun toolBlocks(m: LlmMsg): JSONArray {
                  val arr = JSONArray()
                  for (r in m.results) {
                      arr.put(JSONObject().put("type", "tool_result").put("tool_use_id", r.callId).put("content", if (r.content.isEmpty()) "(boş)" else r.content))
                  }
                  return arr
              }

              private fun buildMessages(msgs: List<LlmMsg>): JSONArray {
                  val out = JSONArray()
                  var lastRole = ""
                  var lastBlocks: JSONArray? = null
                  for (m in msgs) {
                      val role = if (m.role == LlmMsg.ASSISTANT) "assistant" else "user"
                      val blocks = when (m.role) {
                          LlmMsg.ASSISTANT -> assistantBlocks(m)
                          LlmMsg.TOOL -> toolBlocks(m)
                          else -> userBlocks(m)
                      }
                      if (blocks.length() == 0) continue
                      val lb = lastBlocks
                      if (role == lastRole && lb != null) {
                          for (i in 0 until blocks.length()) lb.put(blocks.get(i))
                      } else {
                          val block = JSONArray()
                          for (i in 0 until blocks.length()) block.put(blocks.get(i))
                          out.put(JSONObject().put("role", role).put("content", block))
                          lastRole = role
                          lastBlocks = block
                      }
                  }
                  return out
              }

              private fun toolDefs(tools: JSONArray): JSONArray {
                  val out = JSONArray()
                  for (i in 0 until tools.length()) {
                      val t = tools.getJSONObject(i)
                      var params = t.optJSONObject("parameters")
                      if (params == null) params = JSONObject().put("type", "object").put("properties", JSONObject())
                      out.put(JSONObject().put("name", t.getString("name")).put("description", t.optString("description", "")).put("input_schema", params))
                  }
                  return out
              }

              private fun errorText(r: Http.Resp): String {
                  if (r.code == -1) return "Ağ hatası: " + r.body
                  return try {
                      "Anthropic " + r.code + ": " + JSONObject(r.body).getJSONObject("error").optString("message", r.body).take(300)
                  } catch (_: Exception) {
                      "Anthropic " + r.code + ": " + r.body.take(300)
                  }
              }

              override fun chat(system: String, msgs: List<LlmMsg>, tools: JSONArray?): LlmReply {
                  val body = JSONObject().put("model", model).put("max_tokens", 4096).put("messages", buildMessages(msgs))
                  if (system.isNotBlank()) body.put("system", system)
                  if (tools != null && tools.length() > 0) body.put("tools", toolDefs(tools))
                  val r = Http.postJsonRetry(p.baseUrl + p.chatPath, Providers.authHeaders(p, key), body.toString())
                  if (!r.ok) throw LlmException(errorText(r), r.code)
                  val resp = JSONObject(r.body)
                  val content = resp.optJSONArray("content") ?: return LlmReply("", emptyList(), null, resp.optString("stop_reason", ""))
                  val sb = StringBuilder()
                  val calls = ArrayList<LlmToolCall>()
                  for (i in 0 until content.length()) {
                      val b = content.optJSONObject(i) ?: continue
                      val type = b.optString("type", "")
                      if (type == "text") {
                          sb.append(b.optString("text", ""))
                      } else if (type == "tool_use") {
                          calls.add(LlmToolCall(b.optString("id", "call_" + i), b.optString("name", ""), b.optJSONObject("input") ?: JSONObject()))
                      }
                  }
                  return LlmReply(sb.toString().trim(), calls, null, resp.optString("stop_reason", ""))
              }
          }
          NOVAX_EOF

