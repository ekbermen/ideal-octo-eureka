                  liveWatchCb = Ui.check(this, "Canlı kamera: gözlem modunu açık başlat", Prefs.liveWatch)
                  for (c in listOf(wakeCb, ttsCb, overlayCb, fastCb, confirmCb, notifCb, liveFrontCb, liveWatchCb)) col.addView(c)
                  modeIdx = modeValues.indexOf(Prefs.voiceNoteMode).coerceAtLeast(0)
