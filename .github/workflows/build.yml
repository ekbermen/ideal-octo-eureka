          cat > app/src/main/java/com/novax/assistant/TasksActivity.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Activity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** '@Arkaplan' görevleri ve zamanlanmış görevler: durum, günlük ve iptal. */
          class TasksActivity : Activity() {
              private lateinit var box: LinearLayout
              private val handler = Handler(Looper.getMainLooper())
              private val ticker = object : Runnable {
                  override fun run() {
                      render()
                      handler.postDelayed(this, 1500L)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val sv = ScrollView(this)
                  box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.fitsSystemWindows = true
                  box.setPadding(Ui.dp(this, 16f), Ui.dp(this, 8f), Ui.dp(this, 16f), Ui.dp(this, 32f))
                  sv.addView(box, ViewGroup.LayoutParams(-1, -2))
                  setContentView(sv)
              }

              override fun onResume() {
                  super.onResume()
                  handler.post(ticker)
              }

              override fun onPause() {
                  super.onPause()
                  handler.removeCallbacks(ticker)
              }

              private fun render() {
                  box.removeAllViews()
                  box.addView(Ui.text(this, "GÖREVLER", 20f, Ui.CYAN, true))
                  box.addView(Ui.hint(this, "Arka plan görevi başlatmak için mesajı @Arkaplan ile başlat. Örnek: @Arkaplan Play Store'dan eFootball indir"))
                  val fmt = SimpleDateFormat("HH:mm:ss", Locale("tr"))
                  if (BgTasks.tasks.isEmpty()) {
                      box.addView(Ui.text(this, "Henüz arka plan görevi yok.", 13f, Ui.CYAN_DIM))
                  }
                  for (t in BgTasks.tasks.reversed()) {
                      val p = Ui.panel(this)
                      val color = when (t.status) {
                          "çalışıyor", "iptal ediliyor" -> Ui.AMBER
                          "bitti" -> Ui.GREEN
                          else -> Ui.RED
                      }
                      p.addView(Ui.text(this, "#" + t.id + " [" + t.status + "] " + fmt.format(Date(t.startedAt)), 13f, color, true))
                      p.addView(Ui.text(this, Text.clip(t.goal, 160), 13f, Ui.CYAN))
                      val recent = t.log.toList().takeLast(4)
                      for (l in recent) p.addView(Ui.text(this, "  ▸ " + Text.clip(l, 90), 11f, Ui.CYAN_DIM))
                      if (t.result.isNotBlank()) p.addView(Ui.text(this, "Sonuç: " + Text.clip(t.result, 400), 12f, Ui.GREEN))
                      if (t.status == "çalışıyor") {
                          val id = t.id
                          p.addView(Ui.button(this, "İptal et", Ui.RED) { BgTasks.cancel(id) }, Ui.margins(Ui.lp(-2, -2), this, 0f, 6f, 0f, 0f))
                      }
                      box.addView(p, Ui.margins(Ui.lp(), this, 0f, 8f, 0f, 0f))
                  }
                  box.addView(Ui.section(this, "ZAMANLANMIŞ"))
                  box.addView(Ui.text(this, Scheduler.list(), 12f, Ui.CYAN))
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Text.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Text.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.util.Locale

          /** Metin yardımcıları: Türkçe-duyarlı normalizasyon, bulanık eşleşme, ek kırpma. */
          object Text {
              private val nonAlnum = Regex("[^a-z0-9 ]")
              private val spaces = Regex("\\s+")

              fun norm(s: String): String {
                  val sb = StringBuilder(s.length)
                  for (ch in s) sb.append(if (ch == 'İ' || ch == 'I' || ch == 'ı') 'i' else ch)
                  return sb.toString().lowercase(Locale.ROOT)
                      .replace('ş', 's').replace('ğ', 'g').replace('ü', 'u')
                      .replace('ö', 'o').replace('ç', 'c')
                      .replace(nonAlnum, " ")
                      .replace(spaces, " ").trim()
              }

              /** Komut metnini regex eşleşmesi için hazırlar: kesme işaretleri ve sondaki noktalama gider. */
              fun clean(s: String): String {
                  var t = s.trim().replace("'", "").replace("’", "").replace("`", "")
                  t = t.trimEnd('.', '!', '?', ',', ' ', ';')
                  t = t.replace(Regex("(?i)^(hey|ey|tamam)?\\s*novax\\s*[,.:]?\\s*"), "")
                  t = t.replace(Regex("(?i)\\s+(lütfen|lutfen|misin|mısın|musun|please)\\z"), "")
                  t = t.replace(Regex("(?i)^(lütfen|lutfen|please)\\s+"), "")
                  return t.trim()
              }

              fun lev(a: String, b: String): Int {
                  if (a == b) return 0
                  if (a.isEmpty()) return b.length
                  if (b.isEmpty()) return a.length
                  var prev = IntArray(b.length + 1) { it }
                  var cur = IntArray(b.length + 1)
                  for (i in 1..a.length) {
                      cur[0] = i
                      for (j in 1..b.length) {
                          val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                          cur[j] = minOf(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost)
                      }
                      val tmp = prev
                      prev = cur
                      cur = tmp
                  }
                  return prev[b.length]
              }

              /** "annemi" -> ["annemi","annem","anne","ann"]: Türkçe çekim eklerini kırparak aday üretir. */
              fun stems(word: String): List<String> {
                  val n = norm(word)
                  val out = ArrayList<String>()
                  if (n.isEmpty()) return out
                  out.add(n)
                  var i = 1
                  while (i <= 5 && n.length - i >= 3) {
                      out.add(n.dropLast(i))
                      i++
                  }
                  return out
              }

              fun clip(s: String, n: Int): String = if (s.length <= n) s else s.take(n) + "…"

              fun cap(s: String): String = if (s.isEmpty()) s else s.substring(0, 1).uppercase(Locale("tr")) + s.substring(1)

              /** 1 = evet, 0 = hayır, -1 = anlaşılmadı. */
              fun yesNo(s: String): Int {
                  val n = " " + norm(s) + " "
                  val no = listOf(" hayir ", " yapma ", " iptal ", " dur ", " olmaz ", " istemiyorum ", " vazgec ", " no ", " asla ")
                  val yes = listOf(" evet ", " tamam ", " olur ", " onay ", " yap ", " devam ", " tabi ", " tabii ", " peki ", " okey ", " ok ", " yes ", " aynen ", " kesinlikle ", " gonder ")
                  for (w in no) {
                      if (n.contains(w)) return 0
                  }
                  for (w in yes) {
                      if (n.contains(w)) return 1
                  }
                  return -1
              }

              fun stripMarkdown(s: String): String =
                  s.replace("**", "").replace("*", "").replace("`", "").replace("#", "").replace("_", " ").trim()

              fun jsonEscapeSafe(s: String): String = s.replace("\u0000", "")
          }
          NOVAX_EOF

