                  pinRow.addView(Ui.button(this, "PIN'i kaydet", Ui.GREEN) { savePin() })
                  pinRow.addView(Ui.button(this, "PIN'i sil", Ui.RED) { clearPin() }, Ui.margins(Ui.lp(-2, -2), this, 8f, 0f, 0f, 0f))
                  col.addView(pinRow, Ui.margins(Ui.lp(), this, 0f, 6f, 0f, 0f))
                  pinStatus = Ui.text(this, "", 12f, Ui.CYAN_DIM)
                  col.addView(pinStatus, Ui.lp())
                  updatePinStatus()

                  callCb = Ui.check(this, "Gelen aramaları Novax karşılasın (senin adına konuşsun)", Prefs.callDelegateOn)
                  col.addView(callCb, Ui.margins(Ui.lp(), this, 0f, 10f, 0f, 0f))
