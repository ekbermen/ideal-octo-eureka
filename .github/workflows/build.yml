          package com.novax.assistant

          /** Kullanıcıdan sesli evet/hayır onayı alır (araç döngüsünde bloklar). */
          object Confirm {
              fun ask(question: String, timeoutSec: Int = 25): String {
                  Bus.novax(question)
                  Voice.speakAndWait(question, 30000L)
                  val ans = Voice.captureOnce(timeoutSec * 1000L)
                  if (ans.isBlank()) return "CEVAP YOK (kullanıcı yanıt vermedi; riskli işlemi yapma)"
                  Bus.user(ans)
                  val yn = Text.yesNo(ans)
                  if (yn == 1) return "EVET: " + ans
                  if (yn == 0) return "HAYIR: " + ans
                  return "BELİRSİZ CEVAP: " + ans
              }

              /** Ayarlarda 'riskli işlemlerde onay' açıksa sorar; kapalıysa doğrudan izin verir. */
              fun gate(question: String): Boolean {
                  if (!Prefs.confirmRisky) return true
                  val r = ask(question)
                  return r.startsWith("EVET")
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Contacts.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Contacts.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.content.pm.PackageManager
          import android.provider.ContactsContract

          /** Rehber erişimi + Türkçe çekim eklerine dayanıklı isim çözümleme ("annemi", "babama"...). */
          object Contacts {
              data class C(val name: String, val number: String, val norm: String)

              private var cache: List<C> = emptyList()
              private var stamp = 0L

              fun granted(): Boolean =
                  NovaxApp.instance.checkSelfPermission(Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED

              @Synchronized
              fun all(): List<C> {
                  if (!granted()) return emptyList()
                  val now = System.currentTimeMillis()
                  if (cache.isNotEmpty() && now - stamp < 60000L) return cache
                  val out = ArrayList<C>()
                  val seen = HashSet<String>()
                  val cols = arrayOf(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER)
                  val cur = NovaxApp.instance.contentResolver.query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, cols, null, null, null)
                  if (cur != null) {
                      try {
                          while (cur.moveToNext()) {
                              val name = cur.getString(0)
                              val num = cur.getString(1)
                              if (name == null || num == null) continue
                              val key = name + "|" + num.filter { it.isDigit() }
                              if (seen.add(key)) out.add(C(name, num, Text.norm(name)))
                          }
                      } finally {
                          cur.close()
                      }
                  }
                  cache = out
                  stamp = now
                  return out
              }

              fun invalidate() {
                  stamp = 0L
              }

              /** Konuşulan adı rehberdeki kişiyle eşler; numara verilmişse doğrudan numara döner. */
              fun find(spoken: String): C? {
                  val s = spoken.trim()
                  val digits = s.filter { it.isDigit() || it == '+' }
                  if (digits.count { it.isDigit() } >= 7 && s.count { it.isLetter() } == 0) return C("", digits, "")
                  val list = all()
                  if (list.isEmpty()) return null
                  val stems = Text.stems(s)
                  for (cand in stems) {
                      val exact = list.firstOrNull { it.norm == cand }
                      if (exact != null) return exact
                      if (cand.length >= 3) {
                          val word = list.firstOrNull { n -> n.norm.split(" ").any { it == cand } }
                          if (word != null) return word
                      }
                  }
                  for (cand in stems) {
                      if (cand.length >= 4) {
                          val pre = list.filter { it.norm.startsWith(cand) }.minByOrNull { it.norm.length }
                          if (pre != null) return pre
                      }
                  }
                  for (cand in stems) {
                      if (cand.length >= 5) {
                          val fz = list.firstOrNull { n ->
                              val first = n.norm.substringBefore(' ')
                              Text.lev(first, cand) <= 1 || Text.lev(n.norm, cand) <= 1
                          }
                          if (fz != null) return fz
                      }
                  }
                  return null
              }

              /** Numaradan kişi adını bulur (arayan kimliği için). */
              fun nameOfNumber(number: String): String {
                  val d = number.filter { it.isDigit() }
                  if (d.length < 7) return ""
                  val tail = d.takeLast(9)
                  for (c in all()) {
                      if (c.number.filter { it.isDigit() }.endsWith(tail)) return c.name
                  }
                  return ""
              }

              fun search(q: String, limit: Int = 8): List<C> {
                  val n = Text.norm(q)
                  return all().filter { it.norm.contains(n) }.take(limit)
              }

              /** Telefon numarasını wa.me için sadece rakam ve ülke kodlu hale getirir. */
              fun intl(raw: String): String {
                  var d = raw.filter { it.isDigit() }
                  if (raw.trim().startsWith("+")) return d
                  if (d.startsWith("00")) return d.substring(2)
                  val cc = Prefs.countryCode
                  if (d.startsWith("0")) d = cc + d.substring(1)
                  else if (d.length <= 10 && !d.startsWith(cc)) d = cc + d
                  return d
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Downloads.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Downloads.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.DownloadManager
          import android.content.Context
          import android.net.Uri
          import android.os.Environment

          /** Doğrudan bağlantıdan dosya indirme (Android DownloadManager). */
          object Downloads {
              fun start(url: String, nameIn: String): String {
                  if (!url.startsWith("http")) return "HATA: geçersiz adres"
                  var name = nameIn.trim()
                  if (name.isEmpty()) {
                      name = url.substringBefore('?').substringAfterLast('/').ifBlank { "novax_indirme_" + System.currentTimeMillis() }
                  }
                  return try {
                      val dm = NovaxApp.instance.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                      val req = DownloadManager.Request(Uri.parse(url))
                      req.setTitle(name)
                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name)
                      val id = dm.enqueue(req)
                      "İndirme başladı (#" + id + "): İndirilenler/" + name
                  } catch (e: Exception) {
                      "HATA: indirme başlatılamadı: " + e.message
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/GeminiClient.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/GeminiClient.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import org.json.JSONArray
          import org.json.JSONObject

          /** Google Gemini (generateContent) istemcisi: araç çağırma, görüntü, ses, video ve Google Arama grounding. */
          class GeminiClient(private val p: Provider, private val key: String, val model: String) : LlmClient {
              override val label: String get() = p.company + " / " + model

              private fun modelUrl(): String {
                  val m = if (model.startsWith("models/")) model else "models/" + model
                  return p.baseUrl + "/" + m + ":generateContent"
              }

              private fun headers(): Map<String, String> = Providers.authHeaders(p, key)

              private fun partJson(x: LlmPart): JSONObject {
                  if (x.kind == LlmPart.TEXT) return JSONObject().put("text", if (x.text.isEmpty()) " " else x.text)
                  return JSONObject().put("inline_data", JSONObject().put("mime_type", x.mime).put("data", x.b64))
              }

              private fun assistantParts(m: LlmMsg): JSONArray {
                  val raw = m.raw
                  if (raw != null) return raw
                  val parts = JSONArray()
                  for (x in m.parts) {
                      if (x.kind == LlmPart.TEXT && x.text.isNotBlank()) parts.put(JSONObject().put("text", x.text))
                  }
                  for (c in m.calls) {
                      parts.put(JSONObject().put("functionCall", JSONObject().put("name", c.name).put("args", c.args)))
                  }
                  if (parts.length() == 0) parts.put(JSONObject().put("text", " "))
                  return parts
              }

              private fun contents(msgs: List<LlmMsg>): JSONArray {
                  val out = JSONArray()
                  for (m in msgs) {
                      if (m.role == LlmMsg.USER) {
                          val parts = JSONArray()
                          for (x in m.parts) parts.put(partJson(x))
                          if (parts.length() == 0) parts.put(JSONObject().put("text", " "))
                          out.put(JSONObject().put("role", "user").put("parts", parts))
                      } else if (m.role == LlmMsg.ASSISTANT) {
                          out.put(JSONObject().put("role", "model").put("parts", assistantParts(m)))
                      } else {
                          val parts = JSONArray()
                          for (r in m.results) {
                              val resp = JSONObject().put("result", r.content)
                              parts.put(JSONObject().put("functionResponse", JSONObject().put("name", r.name).put("response", resp)))
                          }
                          out.put(JSONObject().put("role", "user").put("parts", parts))
                      }
                  }
                  return out
              }

              private fun declarations(tools: JSONArray): JSONArray {
                  val decls = JSONArray()
                  for (i in 0 until tools.length()) {
                      val t = tools.getJSONObject(i)
                      val d = JSONObject().put("name", t.getString("name")).put("description", t.optString("description", ""))
                      val params = t.optJSONObject("parameters")
                      if (params != null) {
                          val props = params.optJSONObject("properties")
                          if (props != null && props.length() > 0) d.put("parameters", params)
                      }
                      decls.put(d)
                  }
                  return decls
              }

              private fun errorText(r: Http.Resp): String {
                  if (r.code == -1) return "Ağ hatası: " + r.body
                  return try {
                      "Gemini " + r.code + ": " + JSONObject(r.body).getJSONObject("error").optString("message", r.body).take(300)
                  } catch (_: Exception) {
                      "Gemini " + r.code + ": " + r.body.take(300)
                  }
              }

              override fun chat(system: String, msgs: List<LlmMsg>, tools: JSONArray?): LlmReply {
                  val body = JSONObject()
                  body.put("contents", contents(msgs))
                  if (system.isNotBlank()) {
                      body.put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", system))))
                  }
                  if (tools != null && tools.length() > 0) {
                      body.put("tools", JSONArray().put(JSONObject().put("functionDeclarations", declarations(tools))))
                  }
                  body.put("generationConfig", JSONObject().put("temperature", 0.6))
                  val r = Http.postJsonRetry(modelUrl(), headers(), body.toString())
                  if (!r.ok) throw LlmException(errorText(r), r.code)
                  val resp = JSONObject(r.body)
                  val cand = resp.optJSONArray("candidates")?.optJSONObject(0)
                  if (cand == null) {
                      val why = resp.optJSONObject("promptFeedback")?.optString("blockReason") ?: ""
                      return LlmReply(if (why.isNotBlank()) "İstek reddedildi: " + why else "Cevap alamadım.", emptyList(), null, "blocked")
                  }
                  val finish = cand.optString("finishReason", "")
                  val parts = cand.optJSONObject("content")?.optJSONArray("parts")
                  if (parts == null || parts.length() == 0) return LlmReply("", emptyList(), null, finish)
                  val calls = ArrayList<LlmToolCall>()
                  val sb = StringBuilder()
                  for (i in 0 until parts.length()) {
                      val part = parts.getJSONObject(i)
                      val fc = part.optJSONObject("functionCall")
                      if (fc != null) {
                          calls.add(LlmToolCall("call_" + i, fc.optString("name"), fc.optJSONObject("args") ?: JSONObject()))
                      }
                      if (part.has("text") && !part.optBoolean("thought", false)) sb.append(part.getString("text"))
                  }
                  return LlmReply(sb.toString().trim(), calls, parts, finish)
              }

              /** Google Arama ile temellendirilmiş kısa cevap. */
              fun searchGrounded(query: String): String {
                  val body = JSONObject()
                      .put("contents", JSONArray().put(JSONObject().put("role", "user").put("parts", JSONArray().put(JSONObject().put("text", query)))))
                      .put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", "Türkçe, kısa ve doğru cevap ver. Güncel bilgiyi aramadan al. Markdown kullanma. En fazla 5 cümle."))))
                      .put("tools", JSONArray().put(JSONObject().put("google_search", JSONObject())))
                  val r = Http.postJsonRetry(modelUrl(), headers(), body.toString())
                  if (!r.ok) throw LlmException(errorText(r), r.code)
                  val parts = JSONObject(r.body).optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")
                      ?: return "Sonuç bulunamadı."
                  val sb = StringBuilder()
                  for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text"))
                  val s = sb.toString().trim()
                  return if (s.isBlank()) "Sonuç bulunamadı." else s
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Http.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Http.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          /** Bağımlılıksız HTTP istemcisi. Hata durumunda asla fırlatmaz; code=-1 döner. */
          object Http {
              class Resp(val code: Int, val body: String) {
                  val ok: Boolean get() = code in 200..299
              }

              fun get(url: String, headers: Map<String, String> = emptyMap(), timeoutMs: Int = 15000): Resp =
                  call("GET", url, headers, null, timeoutMs, timeoutMs)

              fun postJson(url: String, headers: Map<String, String>, body: String, connectMs: Int = 15000, readMs: Int = 90000): Resp {
                  val h = HashMap<String, String>(headers)
                  h["Content-Type"] = "application/json; charset=utf-8"
                  return call("POST", url, h, body.toByteArray(Charsets.UTF_8), connectMs, readMs)
              }

              /** 429 / 5xx / ağ hatalarında kısa beklemeyle tekrar dener. */
              fun postJsonRetry(url: String, headers: Map<String, String>, body: String, tries: Int = 3, readMs: Int = 90000): Resp {
                  var last = Resp(-1, "")
                  for (i in 0 until tries) {
                      last = postJson(url, headers, body, 15000, readMs)
                      val retry = last.code == 429 || last.code == -1 || (last.code in 500..599)
                      if (!retry) return last
                      if (i < tries - 1) {
                          try {
                              Thread.sleep(1200L * (i + 1))
                          } catch (_: InterruptedException) {
                          }
                      }
                  }
                  return last
              }

              fun postMultipart(
                  url: String,
                  headers: Map<String, String>,
                  fields: Map<String, String>,
                  fileField: String,
                  fileName: String,
                  mime: String,
                  bytes: ByteArray,
                  readMs: Int = 120000
              ): Resp {
                  val boundary = "----novax" + System.currentTimeMillis()
                  val bos = ByteArrayOutputStream()
                  for (e in fields.entries) {
                      bos.write(("--" + boundary + "\r\n").toByteArray())
                      bos.write(("Content-Disposition: form-data; name=\"" + e.key + "\"\r\n\r\n").toByteArray())
                      bos.write((e.value + "\r\n").toByteArray(Charsets.UTF_8))
                  }
                  bos.write(("--" + boundary + "\r\n").toByteArray())
                  bos.write(("Content-Disposition: form-data; name=\"" + fileField + "\"; filename=\"" + fileName + "\"\r\n").toByteArray())
                  bos.write(("Content-Type: " + mime + "\r\n\r\n").toByteArray())
                  bos.write(bytes)
                  bos.write(("\r\n--" + boundary + "--\r\n").toByteArray())
                  val h = HashMap<String, String>(headers)
                  h["Content-Type"] = "multipart/form-data; boundary=" + boundary
                  return call("POST", url, h, bos.toByteArray(), 15000, readMs)
              }

              private fun call(method: String, url: String, headers: Map<String, String>, body: ByteArray?, connectMs: Int, readMs: Int): Resp {
                  var c: HttpURLConnection? = null
                  try {
                      c = URL(url).openConnection() as HttpURLConnection
                      c.requestMethod = method
                      c.connectTimeout = connectMs
                      c.readTimeout = readMs
                      c.instanceFollowRedirects = true
                      for (e in headers.entries) c.setRequestProperty(e.key, e.value)
                      if (body != null) {
                          c.doOutput = true
                          c.outputStream.use { it.write(body) }
                      }
                      val code = c.responseCode
                      val stream = if (code in 200..299) c.inputStream else c.errorStream
                      val txt = if (stream != null) stream.bufferedReader(Charsets.UTF_8).use { it.readText() } else ""
                      return Resp(code, txt)
                  } catch (e: Exception) {
                      return Resp(-1, e.javaClass.simpleName + ": " + (e.message ?: ""))
                  } finally {
                      try {
                          c?.disconnect()
                      } catch (_: Exception) {
                      }
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/HudBackgroundView.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/HudBackgroundView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Shader
          import android.view.View
          import java.util.Random
          import kotlin.math.sin

          /** Koyu mavi HUD zemin: ızgara, tarama çizgisi, köşe parantezleri ve süzülen parçacıklar. */
          class HudBackgroundView(ctx: Context) : View(ctx) {
              private val dn = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rnd = Random(7)
              private val count = 42
              private val px = FloatArray(count) { rnd.nextFloat() }
              private val py = FloatArray(count) { rnd.nextFloat() }
              private val ps = FloatArray(count) { 0.01f + rnd.nextFloat() * 0.04f }
              private val pr = FloatArray(count) { 0.8f + rnd.nextFloat() * 1.8f }
              private var t = 0f
              private var last = 0L
              private var bgShader: LinearGradient? = null

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  bgShader = LinearGradient(0f, 0f, 0f, h.toFloat(), intArrayOf(0xFF010409.toInt(), 0xFF03111E.toInt(), 0xFF020A12.toInt()), null, Shader.TileMode.CLAMP)
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val now = System.nanoTime()
                  val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.05f)
                  last = now
                  t += dt

                  p.reset()
                  p.isAntiAlias = true
                  p.shader = bgShader
                  c.drawRect(0f, 0f, w, h, p)
                  p.shader = null

                  // ızgara
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 1f
                  p.color = 0x1200E5FF
                  val step = 38f * dn
                  var x = 0f
                  while (x < w) { c.drawLine(x, 0f, x, h, p); x += step }
                  var y = (t * 6f * dn) % step
                  while (y < h) { c.drawLine(0f, y, w, y, p); y += step }

                  // tarama çizgisi
                  val sy = ((t * 0.12f) % 1f) * h
                  p.shader = LinearGradient(0f, sy - 60f * dn, 0f, sy, intArrayOf(0, 0x2800E5FF), null, Shader.TileMode.CLAMP)
                  p.style = Paint.Style.FILL
                  c.drawRect(0f, sy - 60f * dn, w, sy, p)
                  p.shader = null

                  // parçacıklar
                  p.style = Paint.Style.FILL
                  for (i in 0 until count) {
                      py[i] -= ps[i] * dt
                      if (py[i] < 0f) { py[i] = 1f; px[i] = rnd.nextFloat() }
                      val a = (0.25f + 0.25f * sin(t * 2f + i)).coerceIn(0f, 1f)
                      p.color = ((a * 255).toInt() shl 24) or 0x0000E5FF
                      c.drawCircle(px[i] * w, py[i] * h, pr[i] * dn, p)
                  }

                  // köşe parantezleri
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 2f * dn
                  p.color = 0xAA00E5FF.toInt()
                  val m = 10f * dn
                  val l = 26f * dn
                  c.drawLine(m, m, m + l, m, p); c.drawLine(m, m, m, m + l, p)
                  c.drawLine(w - m, m, w - m - l, m, p); c.drawLine(w - m, m, w - m, m + l, p)
                  c.drawLine(m, h - m, m + l, h - m, p); c.drawLine(m, h - m, m, h - m - l, p)
                  c.drawLine(w - m, h - m, w - m - l, h - m, p); c.drawLine(w - m, h - m, w - m, h - m - l, p)

                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/JarvisReactorView.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/JarvisReactorView.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.view.View
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.min
          import kotlin.math.sin

          /** Arc-reaktör tarzı animasyonlu orb. Duruma göre renk, hız ve parlaklık değiştirir. */
          class JarvisReactorView(ctx: Context) : View(ctx) {
              var state: OrbState = OrbState.IDLE
                  set(v) {
                      field = v
                      postInvalidateOnAnimation()
                  }
              var level: Float = 0f

              private val dens = ctx.resources.displayMetrics.density
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val rect = RectF()
              private val path = Path()
              private var cx = 0f
              private var cy = 0f
              private var radius = 0f
              private var t = 0f
              private var phase = 0f
              private var smooth = 0.25f
              private var lvl = 0f
              private var lastNs = 0L

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  cx = w / 2f
                  cy = h / 2f
                  radius = min(w, h) / 2f * 0.95f
              }

              private fun orbColor(): Int = when (state) {
                  OrbState.IDLE -> 0xFF00B8D4.toInt()
                  OrbState.LISTENING -> 0xFF00F0FF.toInt()
                  OrbState.THINKING -> 0xFFFFB300.toInt()
                  OrbState.SPEAKING -> 0xFF69F0FF.toInt()
                  OrbState.ERROR -> 0xFFFF3D3D.toInt()
              }

              private fun withAlpha(c: Int, a: Float): Int = ((a.coerceIn(0f, 1f) * 255).toInt() shl 24) or (c and 0x00FFFFFF)

              override fun onDraw(c: Canvas) {
                  if (radius <= 0f) return
                  val now = System.nanoTime()
                  val dt = if (lastNs == 0L) 0.016f else ((now - lastNs) / 1e9f).coerceAtMost(0.05f)
                  lastNs = now
                  t += dt
                  val speed = when (state) {
                      OrbState.IDLE -> 0.5f
                      OrbState.LISTENING -> 1.3f
                      OrbState.THINKING -> 3.4f
                      OrbState.SPEAKING -> 1.9f
                      OrbState.ERROR -> 0.3f
                  }
                  phase += dt * speed
                  lvl += (level - lvl) * min(1f, dt * 10f)
                  val target = when (state) {
                      OrbState.IDLE -> 0.28f
                      OrbState.LISTENING -> 0.45f + lvl * 0.55f
                      OrbState.THINKING -> 0.65f + 0.2f * sin(t * 6f)
                      OrbState.SPEAKING -> 0.55f + 0.4f * abs(sin(t * 7.3f) * cos(t * 3.1f))
                      OrbState.ERROR -> 0.85f
                  }
                  smooth += (target - smooth) * min(1f, dt * 8f)
                  val col = orbColor()
                  val r = radius

                  // dış parıltı
                  p.reset()
                  p.isAntiAlias = true
                  p.shader = RadialGradient(cx, cy, r, intArrayOf(withAlpha(col, 0.55f * smooth), withAlpha(col, 0.12f * smooth), 0), floatArrayOf(0.15f, 0.65f, 1f), Shader.TileMode.CLAMP)
                  c.drawCircle(cx, cy, r, p)
                  p.shader = null

                  // 1) dış ince halka
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = 1.4f * dens
                  p.color = withAlpha(col, 0.55f)
                  c.drawCircle(cx, cy, r * 0.97f, p)

                  // 2) tik halkası (yavaş döner)
                  c.save()
                  c.rotate(phase * 9f, cx, cy)
                  p.strokeWidth = 1.2f * dens
                  for (i in 0 until 72) {
                      val a = i * (2f * PI.toFloat() / 72f)
                      val isLong = i % 6 == 0
                      val r1 = r * (if (isLong) 0.86f else 0.9f)
                      val r2 = r * 0.94f
                      p.color = withAlpha(col, if (isLong) 0.9f else 0.4f)
                      c.drawLine(cx + cos(a) * r1, cy + sin(a) * r1, cx + cos(a) * r2, cy + sin(a) * r2, p)
                  }
                  c.restore()

                  // 3) kalın yay parçaları (ters döner)
                  rect.set(cx - r * 0.78f, cy - r * 0.78f, cx + r * 0.78f, cy + r * 0.78f)
                  p.strokeWidth = 5.5f * dens
                  p.strokeCap = Paint.Cap.ROUND
                  for (i in 0 until 3) {
                      p.color = withAlpha(col, 0.35f + 0.5f * smooth)
                      c.drawArc(rect, -phase * 38f + i * 120f, 72f, false, p)
                  }
                  p.strokeCap = Paint.Cap.BUTT

                  // 4) kesikli halka
                  p.strokeWidth = 2f * dens
                  p.pathEffect = DashPathEffect(floatArrayOf(9f * dens, 13f * dens), phase * 40f * dens)
                  p.color = withAlpha(col, 0.6f)
                  c.drawCircle(cx, cy, r * 0.66f, p)
                  p.pathEffect = null

                  // 5) tarama yayı (düşünürken belirgin)
                  rect.set(cx - r * 0.7f, cy - r * 0.7f, cx + r * 0.7f, cy + r * 0.7f)
                  p.strokeWidth = 2.2f * dens
                  p.color = withAlpha(col, if (state == OrbState.THINKING) 0.95f else 0.3f)
                  c.drawArc(rect, phase * 110f, if (state == OrbState.THINKING) 110f else 30f, false, p)

                  // 6) altıgen çekirdek çerçevesi
                  c.save()
                  c.rotate(-phase * 22f, cx, cy)
                  path.reset()
                  val hr = r * (0.5f + 0.03f * smooth)
                  for (i in 0 until 6) {
                      val a = i * (PI.toFloat() / 3f)
                      val x = cx + cos(a) * hr
                      val y = cy + sin(a) * hr
                      if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                  }
                  path.close()
                  p.strokeWidth = 2.2f * dens
                  p.color = withAlpha(col, 0.85f)
                  c.drawPath(path, p)
                  p.strokeWidth = 1f * dens
                  p.color = withAlpha(col, 0.4f)
                  for (i in 0 until 6 step 2) {
                      val a = i * (PI.toFloat() / 3f)
                      c.drawLine(cx + cos(a) * hr, cy + sin(a) * hr, cx - cos(a) * hr, cy - sin(a) * hr, p)
                  }
                  c.restore()

                  // 7) ses seviyesi halkası
                  p.strokeWidth = 3f * dens
                  p.color = withAlpha(col, 0.35f + 0.5f * lvl)
                  c.drawCircle(cx, cy, r * (0.38f + 0.12f * (if (state == OrbState.LISTENING) lvl else smooth * 0.5f)), p)

                  // 8) yörünge noktaları
                  p.style = Paint.Style.FILL
                  for (i in 0 until 3) {
                      val a = phase * 1.6f + i * (2f * PI.toFloat() / 3f)
                      p.color = withAlpha(col, 0.95f)
                      c.drawCircle(cx + cos(a) * r * 0.58f, cy + sin(a) * r * 0.58f, 3f * dens, p)
                  }

                  // 9) çekirdek
                  val cr = r * (0.27f + 0.05f * smooth)
                  p.shader = RadialGradient(cx, cy, cr, intArrayOf(0xFFFFFFFF.toInt(), withAlpha(col, 0.95f), withAlpha(col, 0.15f)), floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP)
                  c.drawCircle(cx, cy, cr, p)
                  p.shader = null

                  postInvalidateOnAnimation()
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/KeyboardOps.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/KeyboardOps.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.graphics.Rect
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.Locale

          /** Kullanıcının kendi ekran klavyesinin tuşlarına dokunarak yazar (Gboard, Samsung, SwiftKey vb.). */
          object KeyboardOps {
              private class Key(val label: String, val node: AccessibilityNodeInfo, val rect: Rect)

              private val SPACE = listOf("boşluk", "space", "boşluk tuşu", "space bar", "spacebar", "boşluk çubuğu")
              private val ENTER = listOf("enter", "gir", "ara", "search", "git", "go", "gönder", "send", "tamam", "done", "ileri", "next", "yeni satır", "return", "bitti")
              private val SHIFT = listOf("shift", "üst karakter", "büyük harf", "caps", "büyük harf kilidi", "üst karakter tuşu", "caps lock")
              private val SYMBOLS = listOf("?123", "sembol", "symbols", "123", "simgeler", "sayılar", "sayı ve semboller", "numbers", "?1♪")
              private val ABC = listOf("abc", "harf", "harfler", "a b c", "alfabe", "letters")
              private val MORE = listOf("=\\<", "=<", "1/2", "2/2", "ikinci sayfa", "more symbols", "diğer semboller")

              private fun svc(): NovaxAccessibilityService? = NovaxAccessibilityService.instance

              fun isOpen(): Boolean {
                  val s = svc() ?: return false
                  return s.imeRoots().isNotEmpty()
              }

              private fun collect(): List<Key> {
                  val s = svc() ?: return emptyList()
                  val out = ArrayList<Key>()
                  for (r in s.imeRoots()) {
                      s.walkTree(r, 0) { n, _ ->
                          if (n.isVisibleToUser) {
                              val t = n.text?.toString() ?: ""
                              val d = n.contentDescription?.toString() ?: ""
                              val label = (if (t.isNotBlank()) t else d).trim()
                              if (label.isNotEmpty()) {
                                  val rect = Rect()
                                  n.getBoundsInScreen(rect)
                                  if (!rect.isEmpty) out.add(Key(label.lowercase(Locale.ROOT), n, rect))
                              }
                          }
                          true
                      }
                  }
                  return out
              }

              private fun find(keys: List<Key>, cands: List<String>): Key? {
                  for (c in cands) {
                      for (k in keys) {
                          if (k.label == c) return k
                      }
                  }
                  return null
              }

              private fun widest(keys: List<Key>): Key? {
                  var best: Key? = null
                  for (k in keys) {
                      val b = best
                      if (b == null || k.rect.width() > b.rect.width()) best = k
                  }
                  return best
              }

              private fun tapKey(k: Key) {
                  val s = svc() ?: return
                  val ok = k.node.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                  if (!ok) s.tap(k.rect.exactCenterX(), k.rect.exactCenterY(), 30L)
                  ScreenOps.nap(30L)
              }

              private fun relayout(): List<Key> {
                  ScreenOps.idle(400L, 70L)
                  return collect()
              }

              /** Alan odaklı ve klavye kapalıysa alana dokunup klavyeyi açar. */
              fun ensureOpen(): Boolean {
                  val s = svc() ?: return false
                  if (isOpen()) return true
                  val f = s.focusedInput() ?: return false
                  val r = Rect()
                  f.getBoundsInScreen(r)
                  if (!r.isEmpty) s.tap(r.exactCenterX(), r.exactCenterY(), 40L)
                  ScreenOps.idle(900L, 150L)
                  return isOpen()
              }

              fun info(): String {
                  val s = svc() ?: return ScreenOps.NEED
                  val roots = s.imeRoots()
                  if (roots.isEmpty()) return "Klavye kapalı."
                  val pkg = roots[0].packageName?.toString() ?: "?"
                  return "Klavye açık (" + pkg + "), okunan tuş sayısı: " + collect().size
              }

              fun type(text: String, enter: Boolean): String {
                  val s = svc() ?: return ScreenOps.NEED
                  if (!ensureOpen()) return "HATA: Klavye açılamadı (odakta yazılabilir alan yok). Önce alana dokun ya da type_text kullan."
                  var keys = collect()
                  if (keys.size < 8) return "HATA: Klavye tuşları erişilebilirlikle okunamadı (" + keys.size + " tuş). type_text kullan."
                  var inSymbols = false
                  val missing = StringBuilder()
                  for (ch in text) {
                      if (ch == ' ') {
                          val k = find(keys, SPACE) ?: widest(keys)
                          if (k != null) tapKey(k) else missing.append(ch)
                      } else if (ch == '\n') {
                          val k = find(keys, ENTER)
                          if (k != null) tapKey(k) else s.pressEnter()
                      } else if (ch.isLetter()) {
                          if (inSymbols) {
                              val abc = find(keys, ABC)
                              if (abc != null) {
                                  tapKey(abc)
                                  keys = relayout()
                              }
                              inSymbols = false
                          }
                          val upper = ch.isUpperCase()
                          val cands = ArrayList<String>()
                          if (ch == 'I') {
                              cands.add("ı")
                              cands.add("i")
                          } else if (ch == 'İ') {
                              cands.add("i")
                          } else {
                              cands.add(ch.lowercaseChar().toString())
                          }
                          if (upper) {
                              val sh = find(keys, SHIFT)
                              if (sh != null) {
                                  tapKey(sh)
                                  keys = relayout()
                              }
                          }
                          val k = find(keys, cands) ?: find(keys, listOf(ch.toString().lowercase(Locale.ROOT)))
                          if (k != null) tapKey(k) else missing.append(ch)
                          if (upper) keys = relayout()
                      } else {
                          var k = find(keys, listOf(ch.toString()))
                          if (k == null) {
                              val sw = find(keys, SYMBOLS)
                              if (sw != null) {
                                  tapKey(sw)
                                  keys = relayout()
                                  inSymbols = true
                                  k = find(keys, listOf(ch.toString()))
                                  if (k == null) {
                                      val more = find(keys, MORE)
                                      if (more != null) {
                                          tapKey(more)
                                          keys = relayout()
                                          k = find(keys, listOf(ch.toString()))
                                      }
                                  }
                              }
                          }
                          if (k != null) tapKey(k) else missing.append(ch)
                      }
                  }
                  if (inSymbols) {
                      val abc = find(keys, ABC)
                      if (abc != null) tapKey(abc)
                  }
                  if (missing.isNotEmpty()) {
                      val ok = s.typeText(text, false)
                      return if (ok) "Klavyede bulunamayan tuşlar (" + missing + ") yüzünden metin doğrudan yazıldı." else "HATA: bazı tuşlar bulunamadı: " + missing
                  }
                  if (enter) {
                      ScreenOps.nap(120L)
                      val k = find(collect(), ENTER)
                      if (k != null) tapKey(k) else s.pressEnter()
                  }
                  return "Klavye ile yazdım (" + text.length + " karakter)" + (if (enter) " ve Enter'a bastım" else "")
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/LiveActivity.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/LiveActivity.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.Manifest
          import android.app.Activity
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.TextureView
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          /** Canlı görüntülü konuşma: kamera önizlemesi + sesli sohbet. */
          class LiveActivity : Activity(), Bus.Listener, LiveSession.Callback {
              private lateinit var tv: TextureView
              private lateinit var cam: CameraController
              private lateinit var reactor: JarvisReactorView
              private lateinit var heardLabel: TextView
              private lateinit var replyLabel: TextView
              private lateinit var statusLabel: TextView
              private lateinit var watchBtn: TextView
              private var session: LiveSession? = null
              private var front = true
              private var started = false

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  front = intent.getBooleanExtra("front", Prefs.liveFront)
                  Voice.init(this)
                  setContentView(buildUi())
                  cam = CameraController(this, tv)
              }

              private fun buildUi(): View {
                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.BLACK)
                  tv = TextureView(this)
                  root.addView(tv, FrameLayout.LayoutParams(-1, -1))

                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setBackgroundColor(Color.parseColor("#99000000"))
                  top.setPadding(Ui.dp(this, 12f), Ui.dp(this, 28f), Ui.dp(this, 12f), Ui.dp(this, 8f))
                  top.addView(Ui.text(this, "◉ CANLI KAMERA", 15f, Ui.CYAN, true), Ui.lp(0, -2, 1f))
                  val flip = Ui.button(this, "🔄", Ui.CYAN) { cam.switchCamera() }
                  top.addView(flip, Ui.margins(Ui.lp(-2, -2), this, 0f, 0f, 6f, 0f))
                  watchBtn = Ui.button(this, "👁 Gözlem: kapalı", Ui.CYAN_DIM) { toggleWatch() }
                  top.addView(watchBtn, Ui.margins(Ui.lp(-2, -2), this, 0f, 0f, 6f, 0f))
                  val close = Ui.button(this, "✖", Ui.RED) { finish() }
                  top.addView(close)
                  root.addView(top, FrameLayout.LayoutParams(-1, -2, Gravity.TOP))

                  val bottom = LinearLayout(this)
                  bottom.orientation = LinearLayout.VERTICAL
                  bottom.setBackgroundColor(Color.parseColor("#B0000000"))
                  bottom.setPadding(Ui.dp(this, 14f), Ui.dp(this, 10f), Ui.dp(this, 14f), Ui.dp(this, 22f))
                  val row = LinearLayout(this)
                  row.gravity = Gravity.CENTER_VERTICAL
                  reactor = JarvisReactorView(this)
                  row.addView(reactor, Ui.lp(Ui.dp(this, 84f), Ui.dp(this, 84f)))
                  val texts = LinearLayout(this)
                  texts.orientation = LinearLayout.VERTICAL
                  statusLabel = Ui.text(this, "Başlıyor…", 12f, Ui.AMBER, true)
                  heardLabel = Ui.text(this, "", 13f, Color.WHITE)
                  replyLabel = Ui.text(this, "", 14f, Ui.CYAN)
                  texts.addView(statusLabel)
                  texts.addView(heardLabel)
                  texts.addView(replyLabel)
                  row.addView(texts, Ui.margins(Ui.lp(0, -2, 1f), this, 12f, 0f, 0f, 0f))
                  bottom.addView(row)
                  root.addView(bottom, FrameLayout.LayoutParams(-1, -2, Gravity.BOTTOM))
                  return root
              }

              private fun toggleWatch() {
                  val s = session ?: return
                  s.watch = !s.watch
                  watchBtn.text = if (s.watch) "👁 Gözlem: açık" else "👁 Gözlem: kapalı"
              }

              private fun needPerms(): Array<String> {
                  val need = ArrayList<String>()
                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.CAMERA)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.RECORD_AUDIO)
                  return need.toTypedArray()
              }

              override fun onResume() {
                  super.onResume()
                  Bus.add(this)
                  val need = needPerms()
                  if (need.isNotEmpty()) {
                      requestPermissions(need, 7711)
                      return
                  }
                  startAll()
              }

              private fun startAll() {
                  if (started) return
                  started = true
                  cam.start(front)
                  val s = LiveSession(cam, this)
                  s.watch = Prefs.liveWatch
                  watchBtn.text = if (s.watch) "👁 Gözlem: açık" else "👁 Gözlem: kapalı"
                  session = s
                  s.start()
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  if (needPerms().isEmpty()) {
                      startAll()
                  } else {
                      statusLabel.text = "Kamera ve mikrofon izni gerekli."
                  }
              }

              override fun onPause() {
                  super.onPause()
                  Bus.remove(this)
                  stopAll()
              }

              private fun stopAll() {
                  started = false
                  val s = session
                  if (s != null) s.stop()
                  session = null
                  try {
                      cam.stop()
                  } catch (_: Exception) {
                  }
              }

              // ------------------------------------------------------------------ LiveSession.Callback (iş parçacığından gelir)
              override fun onHeard(text: String) {
                  runOnUiThread { heardLabel.text = "› " + text }
              }

              override fun onReply(text: String) {
                  runOnUiThread { replyLabel.text = "◈ " + text }
              }

              override fun onStatus(s: String) {
                  runOnUiThread { statusLabel.text = s.uppercase() }
              }

              override fun onClosed() {
                  runOnUiThread {
                      if (!isFinishing) finish()
                  }
              }

              // ------------------------------------------------------------------ Bus
              override fun onState(s: OrbState) {
                  reactor.state = s
              }

              override fun onLevel(v: Float) {
                  reactor.level = v
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/LiveSession.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/LiveSession.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /** Canlı kamera sohbeti: dinle -> kareyi yakala -> modele sor -> sesli cevapla. */
          class LiveSession(private val cam: CameraController, private val ui: Callback) {
              interface Callback {
                  fun onHeard(text: String)
                  fun onReply(text: String)
                  fun onStatus(s: String)
                  fun onClosed()
              }

              @Volatile
              private var running = false

              @Volatile
              var watch: Boolean = false

              private var thread: Thread? = null
              private val history = ArrayList<LlmMsg>()

              fun start() {
                  if (running) return
                  running = true
                  val t = Thread { loop() }
                  t.start()
                  thread = t
              }

              fun stop() {
                  running = false
                  Voice.stopSpeaking()
                  try {
                      thread?.interrupt()
                  } catch (_: Exception) {
                  }
              }

              private fun isExit(s: String): Boolean {
                  val n = " " + Text.norm(s) + " "
                  val keys = listOf(" kapat ", " bitir ", " cikis ", " gorusuruz ", " hoscakal ", " kamerayi kapat ", " canli yayini kapat ", " gorusmeyi bitir ", " tamam kapat ")
                  for (k in keys) {
                      if (n.contains(k)) return true
                  }
                  return false
              }

              /** Eski kareleri geçmişten çıkarıp belleği ve maliyeti düşük tutar. */
              private fun trimHistory() {
                  while (history.size > 12) history.removeAt(0)
                  for (i in 0 until history.size - 1) {
                      val m = history[i]
                      if (m.role == LlmMsg.USER) {
                          var media = false
                          for (p in m.parts) {
                              if (p.kind != LlmPart.TEXT) media = true
                          }
                          if (media) {
                              val keep = ArrayList<LlmPart>()
                              for (p in m.parts) {
                                  if (p.kind == LlmPart.TEXT) keep.add(p)
                              }
                              history[i] = LlmMsg.userParts(keep)
                          }
                      }
                  }
                  while (history.isNotEmpty() && history[0].role != LlmMsg.USER) history.removeAt(0)
              }

              private fun loop() {
                  val client: LlmClient = try {
                      Llm.visionClient()
                  } catch (e: Exception) {
                      ui.onStatus(Llm.describeError(e))
                      running = false
                      ui.onClosed()
                      return
                  }
                  ui.onStatus("Hazır: " + client.label)
                  Voice.speakAndWait("Canlı kamera hazır. Bana bir şey sor ya da bak de.", 15000L)
                  var lastWatch = System.currentTimeMillis()
                  while (running) {
                      ui.onStatus("Dinliyorum…")
                      val heard = Voice.captureOnce(12000L)
                      if (!running) break
                      if (heard.isBlank()) {
                          if (watch && System.currentTimeMillis() - lastWatch >= Prefs.liveIntervalSec * 1000L) {
                              lastWatch = System.currentTimeMillis()
                              watchTick(client)
                          }
                          continue
                      }
                      ui.onHeard(heard)
                      if (isExit(heard)) {
                          Voice.speakAndWait("Tamam, canlı kamerayı kapatıyorum.", 8000L)
                          running = false
                          break
                      }
                      ui.onStatus("Bakıyorum…")
                      val frame = cam.frameBase64(1024)
                      val parts = ArrayList<LlmPart>()
                      parts.add(LlmPart.ofText(heard))
                      if (frame != null) parts.add(LlmPart.ofImage(frame)) else parts.add(LlmPart.ofText("(kamera karesi alınamadı)"))
                      history.add(LlmMsg.userParts(parts))
                      trimHistory()
                      val reply = try {
                          client.chat(Persona.liveSystem(), history, null).text
                      } catch (e: Exception) {
                          AppLog.e("live", "model hatası", e)
                          Llm.describeError(e)
                      }
                      val text = reply.ifBlank { "Bir şey göremedim." }
                      history.add(LlmMsg.assistantText(text))
                      ui.onReply(text)
                      ui.onStatus("Konuşuyorum…")
                      Voice.speakAndWait(text, 45000L)
                  }
                  ui.onClosed()
              }

              private fun watchTick(client: LlmClient) {
                  val frame = cam.frameBase64(768) ?: return
                  try {
                      val msg = LlmMsg.userParts(listOf(LlmPart.ofText("Yeni kare:"), LlmPart.ofImage(frame)))
                      val r = client.chat(Persona.watchSystem(), listOf(msg), null).text.trim()
                      if (r.isNotBlank() && !r.uppercase().startsWith("YOK")) {
                          ui.onReply(r)
                          Voice.speakAndWait(r, 20000L)
                      }
                  } catch (e: Exception) {
                      AppLog.e("live", "gözlem hatası", e)
                  }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/Llm.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/Llm.kt <<'NOVAX_EOF'
          package com.novax.assistant

          /** Ayarlardaki sağlayıcı/anahtar/modelden doğru istemciyi üretir. */
          object Llm {
              fun build(p: Provider, key: String, model: String): LlmClient {
                  return when (p.kind) {
                      Providers.KIND_GEMINI -> GeminiClient(p, key, model)
                      Providers.KIND_ANTHROPIC -> AnthropicClient(p, key, model)
                      else -> OpenAiClient(p, key, model)
                  }
              }

              private fun provider(): Provider {
                  val key = Prefs.apiKey
                  if (key.isBlank()) throw LlmException("API anahtarı yok. Ayarlar > Yapay zekâ bölümünden ekle.")
                  val p = Providers.byId(Prefs.providerId)
                      ?: throw LlmException("Şirket belirlenmedi. Ayarlar > Yapay zekâ > 'Algıla ve test et' düğmesine bas.")
                  return p
              }

              fun client(): LlmClient {
                  val p = provider()
                  val model = Prefs.model
                  if (model.isBlank()) throw LlmException("Model seçilmedi. Ayarlar > Yapay zekâ > 'Algıla ve test et' ya da 'Model seç'.")
                  return build(p, Prefs.apiKey, model)
              }

              /** Görüntü anlayabilen istemci: önce özel görüntü modeli, sonra ana model, sonra listeden uygun olan. */
              fun visionClient(): LlmClient {
                  val p = provider()
                  val key = Prefs.apiKey
                  val vm = Prefs.visionModel
                  if (vm.isNotBlank()) return build(p, key, vm)
                  val main = Prefs.model
                  if (main.isNotBlank() && ModelPicker.supportsVision(p, main)) return build(p, key, main)
                  val ids = Prefs.modelList.split("\n").filter { it.isNotBlank() }
                  val best = ModelPicker.bestVision(p, ids)
                  if (best != null) return build(p, key, best)
                  if (main.isNotBlank()) return build(p, key, main)
                  throw LlmException("Görüntü destekleyen model bulunamadı. Ayarlar'dan görüntü modeli seç.")
              }

              /** Ses/video için Gemini istemcisi (ana sağlayıcı Gemini ise o, değilse ek Gemini anahtarı). */
              fun geminiMediaClient(): GeminiClient? {
                  val p = Providers.byId("google") ?: return null
                  if (Prefs.providerId == "google" && Prefs.apiKey.isNotBlank()) {
                      val m = Prefs.model.ifBlank { "gemini-2.5-flash" }
                      return GeminiClient(p, Prefs.apiKey, m)
                  }
                  val extra = Prefs.mediaGeminiKey
                  if (extra.isNotBlank()) return GeminiClient(p, extra, "gemini-2.5-flash")
                  return null
              }

              /** Araçsız tek seferlik metin cevabı. */
              fun simple(system: String, user: String): String {
                  val c = client()
                  val r = c.chat(system, listOf(LlmMsg.user(user)), null)
                  return r.text.ifBlank { "Tamam." }
              }

              fun describeError(e: Exception): String {
                  if (e is LlmException) return e.message ?: "Yapay zekâ hatası."
                  return "Hata: " + e.javaClass.simpleName + " " + (e.message ?: "")
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/LlmTypes.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/LlmTypes.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException

          class LlmException(msg: String, val code: Int = 0) : IOException(msg)

          /** Mesaj parçası: metin, görüntü, ses ya da video (base64). */
          class LlmPart(val kind: Int, val text: String, val mime: String, val b64: String) {
              companion object {
                  const val TEXT = 0
                  const val IMAGE = 1
                  const val AUDIO = 2
                  const val VIDEO = 3

                  fun ofText(t: String): LlmPart = LlmPart(TEXT, t, "", "")
                  fun ofImage(b64: String, mime: String = "image/jpeg"): LlmPart = LlmPart(IMAGE, "", mime, b64)
                  fun ofAudio(b64: String, mime: String): LlmPart = LlmPart(AUDIO, "", mime, b64)
                  fun ofVideo(b64: String, mime: String): LlmPart = LlmPart(VIDEO, "", mime, b64)
              }
          }

          class LlmToolCall(val id: String, val name: String, val args: JSONObject)

          class LlmToolResult(val callId: String, val name: String, val content: String)

          class LlmMsg(
              val role: String,
              val parts: List<LlmPart>,
              val calls: List<LlmToolCall>,
              val results: List<LlmToolResult>,
              val raw: JSONArray?
          ) {
              companion object {
                  const val USER = "user"
                  const val ASSISTANT = "assistant"
                  const val TOOL = "tool"

                  fun user(text: String): LlmMsg = LlmMsg(USER, listOf(LlmPart.ofText(text)), emptyList(), emptyList(), null)
                  fun userParts(parts: List<LlmPart>): LlmMsg = LlmMsg(USER, parts, emptyList(), emptyList(), null)
                  fun assistantText(text: String): LlmMsg = LlmMsg(ASSISTANT, listOf(LlmPart.ofText(text)), emptyList(), emptyList(), null)
                  fun assistant(text: String, calls: List<LlmToolCall>, raw: JSONArray?): LlmMsg {
                      val parts = if (text.isBlank()) emptyList<LlmPart>() else listOf(LlmPart.ofText(text))
                      return LlmMsg(ASSISTANT, parts, calls, emptyList(), raw)
                  }
                  fun tool(results: List<LlmToolResult>): LlmMsg = LlmMsg(TOOL, emptyList(), emptyList(), results, null)
              }
          }

          class LlmReply(val text: String, val calls: List<LlmToolCall>, val raw: JSONArray?, val finish: String)

          interface LlmClient {
              val label: String
              fun chat(system: String, msgs: List<LlmMsg>, tools: JSONArray?): LlmReply
          }

          class CancelToken {
              @Volatile
              var cancelled: Boolean = false
          }

          class ToolCtx(val bg: Boolean, val cancel: CancelToken, val taskId: Int)
          NOVAX_EOF

