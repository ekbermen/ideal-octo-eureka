                  "chess" to listOf("com.chess"), "satranc" to listOf("com.chess"), "lichess" to listOf("org.lichess.mobileapp"),
                  "wild rift" to listOf("com.riotgames.league.wildrift"), "valorant mobile" to listOf("com.riotgames.valorant")
              )

              @Synchronized
              fun all(): List<App> {
                  val now = System.currentTimeMillis()
                  if (cache.isNotEmpty() && now - stamp < 120000L) return cache
                  val pm = NovaxApp.instance.packageManager
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = pm.queryIntentActivities(i, PackageManager.MATCH_ALL)
                      .map {
                          val lbl = it.loadLabel(pm).toString()
                          App(lbl, it.activityInfo.packageName, Text.norm(lbl))
                      }
                      .distinctBy { it.pkg }
                      .sortedBy { it.norm }
                  cache = list
                  stamp = now
                  return list
              }

              @Synchronized
              fun refresh() {
                  stamp = 0L
              }

              fun find(spoken: String): App? {
                  val apps = all()
                  val stems = Text.stems(spoken).map { it.removeSuffix(" uygulamasi").removeSuffix(" uygulamasini").trim() }.filter { it.isNotEmpty() }
                  for (cand in stems) {
                      val pk = alias[cand]
                      if (pk != null) {
                          for (p in pk) {
                              val hit = apps.firstOrNull { it.pkg == p || it.pkg.startsWith(p + ".") }
                              if (hit != null) return hit
                          }
                      }
                  }
                  var best: App? = null
                  var bestScore = 0
                  for (cand in stems) {
                      for (a in apps) {
                          var s = 0
                          if (a.norm == cand) s = 100
                          else if (a.norm.startsWith(cand) && cand.length >= 3) s = 80 - minOf(15, a.norm.length - cand.length)
                          else if (cand.length >= 4 && a.norm.contains(cand)) s = 60
                          else if (a.norm.length >= 4 && cand.contains(a.norm)) s = 50
                          else if (cand.length >= 5 && Text.lev(a.norm, cand) <= maxOf(1, cand.length / 5)) s = 40
                          if (s > bestScore) {
                              bestScore = s
                              best = a
                          }
                      }
                  }
                  return best
              }

              /** Takma ad tablosundan paket adı (yüklü olmasa da). Play Store kurulumu için. */
              fun pkgOf(name: String): String? {
                  val n = Text.norm(name).removeSuffix(" oyunu").removeSuffix(" uygulamasi").trim()
                  val direct = alias[n]
                  if (direct != null && direct.isNotEmpty()) return direct[0]
                  for (st in Text.stems(n)) {
                      val l = alias[st]
                      if (l != null && l.isNotEmpty()) return l[0]
                  }
                  return null
              }

              fun isInstalled(pkg: String): Boolean {
                  return try {
                      NovaxApp.instance.packageManager.getPackageInfo(pkg, 0)
                      true
                  } catch (_: Exception) {
                      false
                  }
              }

              fun installedPackages(): Set<String> {
                  val out = HashSet<String>()
                  try {
                      for (pi in NovaxApp.instance.packageManager.getInstalledPackages(0)) out.add(pi.packageName)
                  } catch (_: Exception) {
                  }
                  return out
              }

              fun listText(filter: String): String {
                  val n = Text.norm(filter)
                  val l = all().filter { n.isEmpty() || it.norm.contains(n) }
                  return if (l.isEmpty()) "Eşleşen uygulama yok." else l.take(60).joinToString(", ") { it.label }
              }
          }
          NOVAX_EOF

      - name: Yaz app/src/main/java/com/novax/assistant/BgTasks.kt
        run: |
          mkdir -p app/src/main/java/com/novax/assistant
          cat > app/src/main/java/com/novax/assistant/BgTasks.kt <<'NOVAX_EOF'
          package com.novax.assistant

          import android.app.Notification
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import java.util.concurrent.CopyOnWriteArrayList

          /** '@Arkaplan' görevleri: ayrı iş parçacığında çalışan bağımsız ajanlar. */
          object BgTasks {
              class Task(val id: Int, val goal: String) {
                  @Volatile var status: String = "çalışıyor"
                  @Volatile var result: String = ""
                  @Volatile var endedAt: Long = 0L
                  val startedAt: Long = System.currentTimeMillis()
                  val cancel = CancelToken()
                  val log = CopyOnWriteArrayList<String>()

                  fun addLog(s: String) {
                      log.add(s)
                      while (log.size > 60) log.removeAt(0)
                  }
              }

              val tasks = CopyOnWriteArrayList<Task>()
              private var nextId = 1
              private const val MAX_ACTIVE = 3

              fun active(): Int {
                  var n = 0
                  for (t in tasks) {
                      if (t.status == "çalışıyor") n++
                  }
                  return n
              }

              @Synchronized
              fun start(goal: String): String {
                  if (active() >= MAX_ACTIVE) return "Zaten " + MAX_ACTIVE + " arka plan görevi çalışıyor. Birinin bitmesini bekle ya da Görevler ekranından iptal et."
                  val t = Task(nextId++, goal)
                  tasks.add(t)
                  while (tasks.size > 30) tasks.removeAt(0)
                  postProgress(t, "Başladı")
                  val th = Thread { runTask(t) }
                  th.start()
                  return "Arka plan görevi #" + t.id + " başladı: " + Text.clip(goal, 80) + ". Bitince haber vereceğim."
              }

              fun cancel(id: Int): Boolean {
                  for (t in tasks) {
                      if (t.id == id && t.status == "çalışıyor") {
                          t.cancel.cancelled = true
                          t.status = "iptal ediliyor"
                          return true
                      }
                  }
                  return false
              }

              fun summary(): String {
                  if (tasks.isEmpty()) return "Arka plan görevi yok."
                  val sb = StringBuilder()
                  for (t in tasks) {
                      sb.append("#").append(t.id).append(" [").append(t.status).append("] ").append(Text.clip(t.goal, 70))
                      if (t.result.isNotBlank()) sb.append(" -> ").append(Text.clip(t.result, 100))
                      sb.append("\n")
                  }
                  return sb.toString().trim()
              }

              private fun runTask(t: Task) {
                  var out: String
                  try {
                      val ctx = ToolCtx(true, t.cancel, t.id)
                      var lastPost = 0L
                      out = Agent.run(listOf(LlmPart.ofText(t.goal)), emptyList(), ctx, Prefs.bgMaxSteps) { step ->
                          t.addLog(step)
                          val now = System.currentTimeMillis()
                          if (now - lastPost > 2500L) {
                              lastPost = now
                              postProgress(t, step)
                          }
                      }
                      t.status = if (t.cancel.cancelled) "iptal" else "bitti"
                  } catch (e: Exception) {
                      AppLog.e("bg", "görev #" + t.id + " hata", e)
                      out = Llm.describeError(e)
                      t.status = "hata"
                  }
                  t.result = out
                  t.endedAt = System.currentTimeMillis()
                  postDone(t)
                  MemoryStore.addTurn("model", "[arka plan #" + t.id + "] " + t.goal + " -> " + out)
                  Bus.novax("Arka plan #" + t.id + " (" + t.status + "): " + out)
                  if (!Voice.speaking && Bus.current == OrbState.IDLE && Prefs.ttsOn) {
                      Voice.speak("Arka plan görevi bitti. " + out)
                  }
              }

              private fun nm(): NotificationManager =
                  NovaxApp.instance.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager

              private fun postProgress(t: Task, step: String) {
                  val ctx = NovaxApp.instance
                  val cancelIntent = Intent(ctx, NovaxReceiver::class.java).setAction(NovaxReceiver.ACTION_CANCEL_TASK).putExtra("id", t.id)
                  val pi = PendingIntent.getBroadcast(ctx, 5000 + t.id, cancelIntent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val open = PendingIntent.getActivity(ctx, 5100 + t.id, Intent(ctx, TasksActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val action = Notification.Action.Builder(android.graphics.drawable.Icon.createWithResource(ctx, R.drawable.ic_notif), "İptal", pi).build()
                  val n = Notification.Builder(ctx, NovaxApp.CH_SERVICE)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("Arka plan #" + t.id)
                      .setContentText(Text.clip(step, 90))
                      .setStyle(Notification.BigTextStyle().bigText(Text.clip(t.goal, 100) + "\n" + Text.clip(step, 120)))
                      .setContentIntent(open)
                      .setOngoing(true)
                      .setProgress(0, 0, true)
                      .addAction(action)
                      .build()
                  nm().notify(3000 + t.id, n)
              }

              private fun postDone(t: Task) {
                  val ctx = NovaxApp.instance
                  val open = PendingIntent.getActivity(ctx, 5100 + t.id, Intent(ctx, TasksActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(ctx, NovaxApp.CH_ALERT)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("Arka plan #" + t.id + " " + t.status)
                      .setContentText(Text.clip(t.result, 120))
                      .setStyle(Notification.BigTextStyle().bigText(Text.clip(t.result, 900)))
                      .setContentIntent(open)
                      .setAutoCancel(true)
                      .build()
                  nm().notify(3000 + t.id, n)
              }
          }
          NOVAX_EOF

